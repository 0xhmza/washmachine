  - id: HideThread
    display: Thread Privacy
    default: true
    snippet: |
      {
          typedef NTSTATUS (NTAPI *pNtSIT)(HANDLE, ULONG, PVOID, ULONG);
          pNtSIT NtSIT = (pNtSIT)GetProcAddress(GetModuleHandleA("ntdll"), "NtSetInformationThread");
