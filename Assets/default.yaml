    display: Environment Variable Value Check
    default: false
    inputs:
    - id: env_var_name
      label: Variable name
      type: textbox
      placement: after
      required: true
      width: 180
      placeholder: COMPUTERNAME
      defaultValue: COMPUTERNAME
      infoAction: EnvVarNameInfo
      infoButtonLabel: Examples
    - id: env_var_value
      label: Expected value
      type: textbox
      placement: after
      required: true
      width: 180
      placeholder: TARGET
      defaultValue: TARGET
      infoAction: EnvVarValueInfo
      infoButtonLabel: Examples
    snippet: |
      // License condition: Environment variable must contain specific value
      {
          auto my_tolower = [](char c) -> char {
              return (c >= 'A' && c <= 'Z') ? c + 32 : c;
          };

          auto contains_ci = [&my_tolower](const char* haystack, const char* needle) -> bool {
              if (!haystack || !needle) return false;
              for (; *haystack; haystack++) {
                  const char* h = haystack;
                  const char* n = needle;
                  while (*h && *n && my_tolower(*h) == my_tolower(*n)) { h++; n++; }
                  if (*n == '\0') return true;
              }
              return false;
          };

          char buffer[1024];
          DWORD result = GetEnvironmentVariableA("$env_var_name$", buffer, 1024);
          if (result == 0 || !contains_ci(buffer, "$env_var_value$")) {
              return 0;
          }
      }

