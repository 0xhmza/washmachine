    snippet: "// Guardrail: Environment variable must contain specific value\n{\n    auto my_tolower = [](char c) -> char {\n        return (c >= 'A' && c <= 'Z') ? c + 32 : c;\n    };\n    \n    auto contains_ci = [&my_tolower](const char* haystack, const char* needle) -> bool {\n        if (!haystack || !needle) return false;\n        for (; *haystack; haystack++) {\n            const char* h = haystack;\n            const char* n = needle;\n            while (*h && *n && my_tolower(*h) == my_tolower(*n)) { h++; n++; }\n            if (*n == '\\0') return true;\n        }\n        return false;\n    };\n    \n    char buffer[1024];\n    DWORD result = GetEnvironmentVariableA(\"COMPUTERNAME\", buffer, 1024);\n    if (result == 0 || !contains_ci(buffer, \"__GUARDRAIL_PARAM__\")) {\n        return 0;\n    }\n}\n"
