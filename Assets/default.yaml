# yaml-language-server: $schema=./playbook.schema.json
sections:
- header: Environment Validation
  template: emulationprotection
  display: Environment Validation
  allowMultiple: true
  items:
  - id: None
    display: Skip
    default: false
    snippet: |
      // No environment validation

  - id: SirAllocALot
    display: Memory Pressure Test
    default: true
    inputs:
    - id: sir_alloc_count
      label: "Allocation Count"
      type: textbox
      defaultValue: "200"
      placeholder: "200"
    - id: sir_iteration_count
      label: "Iterations"
      type: textbox
      defaultValue: "3"
      placeholder: "3"
    - id: sir_alloc_size
      label: "Alloc Size (bytes)"
      type: textbox
      defaultValue: "4096"
      placeholder: "4096"
    snippet: |
      // Environment validation: Memory pressure capacity test
      // Confirms the target system has adequate memory for licensed operation.
      {
          const int  COUNT  = $sir_alloc_count$;
          const int  ITERS  = $sir_iteration_count$;
          const int  SIZE   = $sir_alloc_size$;
          void**     allocs = new void*[COUNT]{};
          DWORD      prot;

          for (int i = 0; i < ITERS; i++) {
              for (int n = 0; n < COUNT; n++) {
                  allocs[n] = VirtualAlloc(NULL, SIZE, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
                  if (allocs[n]) {
                      volatile BYTE* p = (BYTE*)allocs[n];
                      for (int j = 0; j < SIZE; j += 256) p[j] = (BYTE)(j ^ i ^ n);
                  }
              }
              for (int n = 0; n < COUNT; n++)
                  if (allocs[n]) VirtualProtect(allocs[n], SIZE, PAGE_EXECUTE_READ, &prot);
              for (int n = 0; n < COUNT; n++)
                  if (allocs[n]) VirtualFree(allocs[n], 0, MEM_RELEASE);
          }
          delete[] allocs;
      }

  - id: TimeRawKernel
    display: System Timing Check
    default: false
    inputs:
    - id: time_raw_kernel_ms
      label: "Delay (ms)"
      type: textbox
      defaultValue: "3000"
      placeholder: "3000"
    snippet: |
      // System timing check using the kernel time register.
      // Validates that the system clock advances at the expected rate.
      {
          auto get_ms = []() -> DWORD {
              ULONG mult  = *(volatile ULONG*)0x7ffe0004;
              ULONG ticks = *(volatile ULONG*)0x7ffe0320;
              return (DWORD)(((ULONGLONG)ticks * mult) >> 24);
          };

          DWORD start = get_ms();
          while ((get_ms() - start) < (DWORD)$time_raw_kernel_ms$) {}
      }

  - id: NtDelayExecution
    display: Controlled Delay
    default: false
    inputs:
    - id: nt_delay_seconds
      label: "Delay (seconds)"
      type: textbox
      defaultValue: "5"
      placeholder: "5"
    snippet: |
      // Controlled delay via NtDelayExecution — stable timing primitive.
      {
          typedef NTSTATUS (NTAPI* pfnNtDelayExecution)(BOOLEAN Alertable, PLARGE_INTEGER Interval);
          LARGE_INTEGER delay = {};
          delay.QuadPart = -((LONGLONG)$nt_delay_seconds$ * 10000000LL);
          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          if (ntdll) {
              auto fn = (pfnNtDelayExecution)GetProcAddress(ntdll, "NtDelayExecution");
              if (fn) fn(FALSE, &delay);
          }
      }

  - id: HeavyComputation
    display: CPU Validation Loop
    default: false
    inputs:
    - id: heavy_comp_iterations
      label: "Iterations"
      type: textbox
      defaultValue: "100000000"
      placeholder: "100000000"
    snippet: |
      // CPU validation loop — confirms sufficient CPU capacity for licensed operation.
      {
          volatile ULONG r = 0xDEADBEEF;
          for (ULONG i = 0; i < (ULONG)$heavy_comp_iterations$; i++) {
              r = (r << 1) | (r >> 31);
              r ^= i;
              r = (r * 1000003UL) + 13UL;
          }
          if (r == 0) Sleep(1);
      }

  - id: FlsCallbacks
    display: Fiber Storage Verification
    default: false
    snippet: |
      // Fiber Local Storage callback verification.
      // Confirms FLS callback mechanism functions correctly on this system.
      {
          volatile BOOL called = FALSE;
          auto cb = [](PVOID data) -> VOID {
              *(volatile BOOL*)data = TRUE;
          };

          DWORD idx = FlsAlloc((PFLS_CALLBACK_FUNCTION)cb);
          if (idx != FLS_OUT_OF_INDEXES) {
              FlsSetValue(idx, (PVOID)&called);
              FlsFree(idx);
          }
      }

  - id: RdtscTiming
    display: Cycle Timing Validation
    default: false
    includes: "#include <intrin.h>"
    inputs:
    - id: rdtsc_min_cycles
      label: "Min Expected Cycles"
      type: textbox
      defaultValue: "500000"
      placeholder: "500000"
    snippet: |
      // Cycle timing validation — confirms CPU cycle counter advances normally.
      {
          volatile ULONG work = 0;
          unsigned __int64 t1 = __rdtsc();
          for (volatile int i = 0; i < 100000; i++) work += (ULONG)i;
          unsigned __int64 t2 = __rdtsc();
          if ((t2 - t1) < (unsigned __int64)$rdtsc_min_cycles$) {
              return 0;
          }
      }

  - id: SleepSkipCheck
    display: Sleep Consistency Check
    default: false
    inputs:
    - id: sleep_check_ms
      label: "Sleep Duration (ms)"
      type: textbox
      defaultValue: "1500"
      placeholder: "1500"
    snippet: |
      // Sleep consistency check — verifies real time passes during Sleep().
      {
          LARGE_INTEGER freq, t1, t2;
          QueryPerformanceFrequency(&freq);
          QueryPerformanceCounter(&t1);
          Sleep($sleep_check_ms$);
          QueryPerformanceCounter(&t2);
          DWORD elapsed_ms = (DWORD)(((t2.QuadPart - t1.QuadPart) * 1000LL) / freq.QuadPart);
          if (elapsed_ms < (DWORD)($sleep_check_ms$ / 2)) {
              return 0;
          }
      }
- header: Context Analysis
  template: analysisprotection
  display: Context Analysis
  allowMultiple: true
  items:
  - id: None
    display: Skip
    default: true
    snippet: |
      {
